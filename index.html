<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-Меню для Бизнеса — Вход</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>[v-cloak]{display:none}</style>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(99,102,241,.12);top:-100px;left:-100px"></div>
<div id="app" v-cloak>
<div class="topbar">
<div class="brand"><div class="logo">QR</div><span>QR-Меню для Бизнеса</span></div>
<a class="btn btn-ghost btn-sm" href="menu.html">📱 Я клиент</a>
</div>
<div class="wrap">
<div class="glass card" style="max-width:420px;margin:30px auto">
<div class="tabs" style="margin-bottom:16px">
<button v-bind:class="{on:tab==='login'}" v-on:click="tab='login'">Вход</button>
<button v-bind:class="{on:tab==='reg'}" v-on:click="tab='reg'">Регистрация</button>
<button v-bind:class="{on:tab==='cook'}" v-on:click="tab='cook'">Повар</button>
<button v-bind:class="{on:tab==='courier'}" v-on:click="tab='courier'">🚗 Курьер</button>
<button v-bind:class="{on:tab==='waiter'}" v-on:click="tab='waiter'">🤵 Официант</button>
</div>
<div style="margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);text-align:center">
  <div style="color:#94a3b8;font-size:13px;margin-bottom:12px">🎮 Посмотреть без регистрации:</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button onclick="startDemo('cook.html')" class="btn btn-ghost">👨‍🍳 Демо кухни</button>
    <button onclick="startDemo('courier.html')" class="btn btn-ghost">🚗 Демо курьера</button>
    <button onclick="startDemo('waiter.html')" class="btn btn-ghost">🤵 Демо официанта</button>
    <button onclick="startDemo('manager-demo.html')" class="btn btn-primary">🏢 Демо кабинета</button>
  </div>
</div>

<script>
function startDemo(page){
  if(page === 'manager-demo.html'){
    location.href = page;
  } else {
    // Добавляем параметр demo=1, чтобы demo-mode.js активировался
    var separator = page.indexOf('?') === -1 ? '?' : '&';
    location.href = page + separator + 'demo=1';
  }
}
</script>

<template v-if="tab==='login'">
<div class="field"><label>Email</label><input v-model.trim="lform.email" type="email" v-on:keyup.enter="login"></div>
<div class="field"><label>Пароль</label><input v-model="lform.password" type="password" v-on:keyup.enter="login"></div>
<button class="btn btn-primary" style="width:100%" v-on:click="login" v-bind:disabled="busy">{{ busy?'Входим...':'Войти' }}</button>
</template>

<template v-else-if="tab==='reg'">
<div class="field"><label>Ваше имя</label><input v-model.trim="rform.name"></div>
<div class="field"><label>Email</label><input v-model.trim="rform.email" type="email"></div>
<div class="field"><label>Пароль (мин. 6)</label><input v-model="rform.password" type="password"></div>
<button class="btn btn-primary" style="width:100%" v-on:click="register" v-bind:disabled="busy">{{ busy?'Создаём...':'Создать аккаунт управляющего' }}</button>
</template>

<template v-else-if="tab==='cook'">
<div class="field"><label>Код заведения (slug)</label><input v-model.trim="cform.slug" placeholder="my-cafe"></div>
<div class="field"><label>PIN-код</label><input v-model.trim="cform.pin" type="password" inputmode="numeric" v-on:keyup.enter="cookLogin"></div>
<button class="btn btn-primary" style="width:100%" v-on:click="cookLogin" v-bind:disabled="busy">{{ busy?'Проверяем...':'Войти на кухню' }}</button>
</template>

<template v-else-if="tab==='courier'">
<div class="field"><label>Код заведения (slug)</label><input v-model.trim="dform.slug" placeholder="my-cafe"></div>
<div class="field"><label>PIN-код</label><input v-model.trim="dform.pin" type="password" inputmode="numeric" v-on:keyup.enter="courierLogin"></div>
<button class="btn btn-primary" style="width:100%" v-on:click="courierLogin" v-bind:disabled="busy">{{ busy?'Проверяем...':'Войти как курьер' }}</button>
</template>

<template v-else>
<div class="field"><label>Код заведения (slug)</label><input v-model.trim="wform.slug" placeholder="my-cafe"></div>
<div class="field"><label>PIN-код</label><input v-model.trim="wform.pin" type="password" inputmode="numeric" v-on:keyup.enter="waiterLogin"></div>
<button class="btn btn-primary" style="width:100%" v-on:click="waiterLogin" v-bind:disabled="busy">{{ busy?'Проверяем...':'Войти как официант' }}</button>
</template>

<div v-if="msg" class="msg" v-bind:class="msgType" style="margin-top:12px">{{ msg }}</div>
<p class="muted" style="font-size:12px;margin-top:14px">Регистрируются управляющие. Повара, курьеры и официанты входят по PIN — их добавляет управляющий или админ.</p>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/demo-data.js"></script>
<script src="/js/demo-mode.js"></script>
<script src="/js/app.js"></script>
<script>
Vue.createApp({
data:function(){return{
tab:'login',busy:false,msg:'',msgType:'',
lform:{email:'',password:''},
rform:{name:'',email:'',password:''},
cform:{slug:'',pin:''},
dform:{slug:'',pin:''},
wform:{slug:'',pin:''}
}},
methods:{
login:function(){var self=this;self.msg='';
if(!self.lform.email||!self.lform.password){self.msg='Заполните email и пароль';self.msgType='error';return}
self.busy=true;
db.auth.signInWithPassword({email:self.lform.email,password:self.lform.password}).then(function(r){
if(r.error){self.msg='Ошибка входа: '+r.error.message;self.msgType='error';self.busy=false;return}
self.routeByRole(r.data.user.id);
}).catch(function(e){self.msg='Ошибка: '+e.message;self.msgType='error';self.busy=false})},
register:function(){var self=this;self.msg='';
if(!self.rform.email||!self.rform.password||!self.rform.name){self.msg='Заполните все поля';self.msgType='error';return}
if(self.rform.password.length<6){self.msg='Пароль минимум 6 символов';self.msgType='error';return}
self.busy=true;
db.auth.signUp({email:self.rform.email,password:self.rform.password,options:{data:{display_name:self.rform.name,role:'manager'}}}).then(function(r){
if(r.error){var m=String(r.error.message).toLowerCase();
self.msg=m.indexOf('already registered')!==-1?'Этот email уже зарегистрирован. Войдите.':'Ошибка: '+r.error.message;
self.msgType='error';self.busy=false;return}
self.busy=false;
if(r.data.session){self.routeByRole(r.data.user.id)}
else{self.msg='✓ Аккаунт создан! Подтвердите email и войдите.';self.msgType='ok';self.tab='login'}
}).catch(function(e){self.msg='Ошибка: '+e.message;self.msgType='error';self.busy=false})},
cookLogin:function(){var self=this;self.msg='';
var slug=(self.cform.slug||'').trim().toLowerCase();var pin=(self.cform.pin||'').trim();
if(!slug||!pin){self.msg='Заполните код и PIN';self.msgType='error';return}
self.busy=true;
db.from('venues').select('id,name,slug').eq('slug',slug).maybeSingle().then(function(v){
if(!v.data){self.msg='Заведение не найдено';self.msgType='error';self.busy=false;return}
return db.from('cooks').select('*').eq('venue_id',v.data.id).eq('pin',pin).maybeSingle().then(function(c){
if(!c.data){self.msg='Неверный PIN';self.msgType='error';self.busy=false;return}
db.from('cooks').update({last_login_at:new Date().toISOString()}).eq('id',c.data.id).then(function(){});
localStorage.setItem('cook_session',JSON.stringify({venueId:v.data.id,venueName:v.data.name,venueSlug:v.data.slug,cookId:c.data.id,cookName:c.data.name}));
location.href='cook.html'})}).catch(function(e){self.msg='Ошибка: '+e.message;self.msgType='error';self.busy=false})},
courierLogin:function(){var self=this;self.msg='';
var slug=(self.dform.slug||'').trim().toLowerCase();var pin=(self.dform.pin||'').trim();
if(!slug||!pin){self.msg='Заполните код и PIN';self.msgType='error';return}
self.busy=true;
db.from('venues').select('id,name,slug').eq('slug',slug).maybeSingle().then(function(v){
if(!v.data){self.msg='Заведение не найдено';self.msgType='error';self.busy=false;return}
return db.from('couriers').select('*').eq('venue_id',v.data.id).eq('pin',pin).maybeSingle().then(function(c){
if(!c.data){self.msg='Неверный PIN';self.msgType='error';self.busy=false;return}
db.from('couriers').update({last_login_at:new Date().toISOString()}).eq('id',c.data.id).then(function(){});
localStorage.setItem('courier_session',JSON.stringify({venueId:v.data.id,venueName:v.data.name,venueSlug:v.data.slug,courierId:c.data.id,courierName:c.data.name}));
location.href='courier.html'})}).catch(function(e){self.msg='Ошибка: '+e.message;self.msgType='error';self.busy=false})},
waiterLogin:function(){var self=this;self.msg='';
var slug=(self.wform.slug||'').trim().toLowerCase();var pin=(self.wform.pin||'').trim();
if(!slug||!pin){self.msg='Заполните код и PIN';self.msgType='error';return}
self.busy=true;
db.from('venues').select('id,name,slug').eq('slug',slug).maybeSingle().then(function(v){
if(!v.data){self.msg='Заведение не найдено';self.msgType='error';self.busy=false;return}
return db.from('waiters').select('*').eq('venue_id',v.data.id).eq('pin',pin).maybeSingle().then(function(w){
if(!w.data){self.msg='Неверный PIN';self.msgType='error';self.busy=false;return}
db.from('waiters').update({last_login_at:new Date().toISOString()}).eq('id',w.data.id).then(function(){});
localStorage.setItem('waiter_session',JSON.stringify({venueId:v.data.id,venueName:v.data.name,venueSlug:v.data.slug,waiterId:w.data.id,waiterName:w.data.name}));
location.href='waiter.html'})}).catch(function(e){self.msg='Ошибка: '+e.message;self.msgType='error';self.busy=false})},
routeByRole:function(userId){var self=this;
db.from('profiles').select('*').eq('id',userId).maybeSingle().then(function(r){
if(!r.data){self.msg='⚠️ Аккаунт создан, но профиль не найден. Выполните SQL и нажмите «Войти».';self.msgType='error';self.busy=false;return}
location.href=(r.data.role==='admin')?'admin.html':'manager.html'})}
},
mounted:function(){var self=this;
db.auth.getSession().then(function(r){if(r.data&&r.data.session){self.routeByRole(r.data.session.user.id)}})}
}).mount('#app');
</script>
</body>
</html>
