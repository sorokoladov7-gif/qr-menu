<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-Меню для Бизнеса — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head><body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(99,102,241,.15);top:-100px;left:-100px"></div>
<div class="glow" style="width:40vw;height:40vw;background:rgba(139,92,246,.12);bottom:-100px;right:-100px"></div>

<div id="app" v-cloak>
  <div class="topbar">
    <div class="brand"><div class="logo">QR</div>QR-Меню <span class="muted" style="font-weight:500">для Бизнеса</span></div>
    <a href="menu.html" class="btn btn-ghost btn-sm">📱 Я клиент</a>
  </div>

  <div class="wrap" style="max-width:440px;padding-top:48px">
    <div class="glass card">
      <div class="tabs" style="margin-bottom:18px">
        <button :class="{on:tab==='login'}" @click="setTab('login')">Вход</button>
        <button :class="{on:tab==='signup'}" @click="setTab('signup')">Регистрация</button>
        <button :class="{on:tab==='cook'}" @click="setTab('cook')">Повар (PIN)</button>
      </div>

      <form v-if="tab==='login'" @submit.prevent="doLogin">
        <div class="field"><label>Email</label><input v-model="le" type="email" required></div>
        <div class="field"><label>Пароль</label><input v-model="lp" type="password" required></div>
        <button class="btn btn-primary" style="width:100%" :disabled="busy">Войти</button>
      </form>

      <form v-if="tab==='signup'" @submit.prevent="doSignup">
        <div class="field"><label>Ваше имя</label><input v-model="sn" required></div>
        <div class="field"><label>Email</label><input v-model="se" type="email" required></div>
        <div class="field"><label>Пароль (мин. 6)</label><input v-model="sp" type="password" minlength="6" required></div>
        <button class="btn btn-green" style="width:100%" :disabled="busy">Создать аккаунт управляющего</button>
        <p class="muted" style="font-size:12px;margin-top:10px">Регистрируются управляющие. Поваров добавляет управляющий, вход для них — по PIN. Заведения создаёт админ.</p>
      </form>

      <form v-if="tab==='cook'" @submit.prevent="doCook">
        <div class="field"><label>Код заведения (slug)</label><input v-model="cslug" placeholder="например shaurma-pro" required></div>
        <div class="field"><label>PIN-код</label><input v-model="cpin" placeholder="4 цифры" required></div>
        <button class="btn btn-primary" style="width:100%" :disabled="busy">Войти на кухню</button>
      </form>

      <div v-if="msg" class="msg" :class="msgType">{{ msg }}</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
<script>
Vue.createApp({
  data(){return{tab:'login',le:'',lp:'',sn:'',se:'',sp:'',cslug:'',cpin:'',msg:'',msgType:'',busy:false}},
  methods:{
    setTab(t){this.tab=t;this.msg=''},
    fail(t){this.msg=t;this.msgType='err';this.busy=false},
    ok(t){this.msg=t;this.msgType='ok';this.busy=false},
    async doLogin(){
      this.busy=true;
      const {error}=await db.auth.signInWithPassword({email:this.le,password:this.lp});
      if(error) return this.fail('Ошибка входа: '+error.message);
      const p=await getProfile();
      if(!p) return this.fail('Профиль не найден. Зарегистрируйтесь.');
      location.replace(homeForRole(p));
    },
    async doSignup(){
      this.busy=true;
      const {error}=await db.auth.signUp({email:this.se,password:this.sp,options:{data:{role:'manager',name:this.sn}}});
      if(error) return this.fail('Ошибка: '+error.message);
      this.ok('Аккаунт управляющего создан! Войдите. Заведение назначит админ.');
      this.tab='login';
    },
    async doCook(){
      this.busy=true;
      const {data,error}=await db.rpc('cook_login',{vslug:this.cslug.trim().toLowerCase(),cpin:this.cpin.trim()});
      if(error) return this.fail(error.message);
      if(!data||!data.length) return this.fail('Повар не найден. Проверьте код заведения и PIN.');
      const c=data[0];
      sessionStorage.setItem('cook_session',JSON.stringify({cookId:c.cook_id,cookName:c.cook_name,venueId:c.venue_id,venueName:c.venue_name,slug:this.cslug.trim().toLowerCase()}));
      location.replace('cook.html');
    }
  },
  async mounted(){ const p=await getProfile(); if(p) location.replace(homeForRole(p)); }
}).mount('#app');
</script>
</body></html>
