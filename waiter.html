<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Официант</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Официант">
<link rel="manifest" href="/manifest-waiter.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
[v-cloak]{display:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}
.col h4{margin:0 0 10px;font-size:14px}
.wcard{padding:12px;margin-bottom:10px}
.b-ready{background:rgba(52,211,153,.15);color:#6ee7b7}
.b-delivery{background:rgba(167,139,250,.15);color:#c4b5fd}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;text-align:center}
.stat-box .num{font-size:22px;font-weight:800}
.stat-box .lbl{font-size:11px;color:#9ca3af;margin-top:4px}
</style>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(6,182,212,.12);top:-100px;left:-100px"></div>
<div id="app" v-cloak>
<div class="topbar">
<div class="brand"><div class="logo">🤵</div><span>Официант{{ session?' · '+session.venueName:'' }}</span></div>
<div class="row"><button v-if="session" class="btn btn-ghost btn-sm" v-on:click="logout">Выйти</button></div>
</div>
<div class="wrap">
<div v-if="!session" class="glass card" style="max-width:400px;margin:40px auto">
<h3 style="margin-top:0">Вход для официанта</h3>
<div class="field"><label>Код заведения</label><input v-model.trim="loginForm.slug" placeholder="my-cafe"></div>
<div class="field"><label>PIN</label><input v-model.trim="loginForm.pin" type="password" inputmode="numeric" v-on:keyup.enter="login"></div>
<button class="btn btn-primary" style="width:100%" v-on:click="login" v-bind:disabled="busy">{{ busy?'Проверяем...':'Войти' }}</button>
<div v-if="err" class="msg error" style="margin-top:10px">{{ err }}</div>
</div>

<template v-else>
<div class="muted" style="font-size:12px;margin-bottom:12px">🤵 {{ session.waiterName }} · заказы обновляются автоматически</div>

<!-- ЛИЧНАЯ СТАТИСТИКА ОФИЦИАНТА -->
<div class="stats-grid">
  <div class="stat-box" style="border-color:#34d399"><div class="num">{{ waiterStats.served }}</div><div class="lbl">Выдано клиентам</div></div>
  <div class="stat-box" style="border-color:#f59e0b"><div class="num">{{ waiterStats.toCourier }}</div><div class="lbl">Передано курьеру</div></div>
  <div class="stat-box" style="border-color:#a78bfa"><div class="num">{{ waiterStats.total }}</div><div class="lbl">Всего обработано</div></div>
  <div class="stat-box" style="border-color:#f472b6"><div class="num">{{ fmt(waiterStats.revenue) }} ₽</div><div class="lbl">Выручка заказов</div></div>
</div>

<div class="cols">
<div class="col"><h4>✅ Готовы к выдаче ({{ colReady.length }})</h4>
<div v-for="o in colReady" v-bind:key="o.id" class="glass wcard">
<div class="spread"><b>№{{ o.order_number }}</b><span class="badge b-ready">{{ o.order_type==='delivery'?'доставка':'самовывоз' }}</span></div>
<div class="muted" style="font-size:12px;margin-top:6px">📞 {{ o.customer_phone }} {{ o.customer_name?'· '+o.customer_name:'' }}</div>
<div v-if="o.delivery_address" class="muted" style="font-size:12px;margin-top:4px">📍 {{ o.delivery_address }}</div>
<div style="font-size:13px;margin-top:6px"><div v-for="it in o.items" v-bind:key="it.id">{{ it.qty }}x {{ it.name }}</div></div>
<div class="muted" style="font-size:12px;margin-top:6px">{{ o.payment_method==='cash'?'💵 Собрать '+fmt(o.total_price)+' ₽':'💳 Оплачено' }}</div>
<button v-if="o.order_type==='pickup'" class="btn btn-green btn-sm" style="width:100%;margin-top:10px" v-on:click="serve(o.id)">🤝 Выдать клиенту</button>
<button v-else class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" v-on:click="toCourier(o.id)">🚗 Передать курьеру</button>
</div>
<p v-if="!colReady.length" class="muted">Пусто — ждите готовые заказы</p>
</div>
<div class="col"><h4>🚗 В доставке ({{ colDelivery.length }})</h4>
<div v-for="o in colDelivery" v-bind:key="o.id" class="glass wcard">
<div class="spread"><b>№{{ o.order_number }}</b><span class="badge b-delivery">в пути</span></div>
<div class="muted" style="font-size:12px;margin-top:6px">📍 {{ o.delivery_address }}</div>
<div class="muted" style="font-size:12px;margin-top:4px">📞 {{ o.customer_phone }}</div>
</div>
<p v-if="!colDelivery.length" class="muted">Пусто</p>
</div>
</div>

<!-- ИСТОРИЯ ВЫДАЧ -->
<div class="glass card" style="margin-top:18px">
<h4 style="margin:0 0 12px">📜 Моя история (последние выдачи)</h4>
<div v-for="o in waiterHistory" v-bind:key="o.id" class="row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">
<div style="flex:1;font-size:13px"><b>№{{ o.order_number }}</b> — {{ o.customer_name||'Клиент' }} <span class="muted" style="font-size:11px">({{ o.order_type }})</span></div>
<div class="muted" style="font-size:12px">{{ fmtDate(o.updated_at) }}</div>
<div style="color:#34d399;font-weight:700">{{ fmt(o.total_price) }} ₽</div>
</div>
<p v-if="!waiterHistory.length" class="muted" style="padding:8px 0">У вас пока нет завершённых выдач.</p>
</div>

</template>
</div>
</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() { navigator.serviceWorker.register('/sw.js').catch(function() {}); });
}
Vue.createApp({
data:function(){return{
session:null,busy:false,err:'',loginForm:{slug:'',pin:''},
orders:[],timer:null,statsTimer:null,history:[]
}},
computed:{
colReady:function(){return this.orders.filter(function(o){return o.status==='ready'})},
colDelivery:function(){return this.orders.filter(function(o){return o.status==='delivery'})},
waiterStats:function(){
var served=0,toCourier=0,rev=0;
this.history.forEach(function(o){
if(o.waiter_name===this.session.waiterName){
if(o.status==='done'){ served++; rev+=Number(o.total_price||0); }
if(o.status==='delivery') toCourier++;
}
},this);
return {served:served,toCourier:toCourier,total:served+toCourier,revenue:rev};
},
waiterHistory:function(){ return this.history.filter(function(o){return o.waiter_name===this.session.waiterName}).slice(0,20); }
},
methods:{
fmt:function(v){return window.fmt(v)},
fmtDate:function(d){return d?new Date(d).toLocaleDateString('ru-RU'):'-'},
login:function(){var self=this;self.err='';self.busy=true;
var slug=(self.loginForm.slug||'').trim().toLowerCase();
var pin=(self.loginForm.pin||'').trim();
if(!slug||!pin){self.err='Заполните оба поля';self.busy=false;return}
db.from('venues').select('*').eq('slug',slug).maybeSingle().then(function(v){
if(!v.data){self.err='Заведение не найдено';self.busy=false;return}
return db.from('waiters').select('*').eq('venue_id',v.data.id).eq('pin',pin).maybeSingle().then(function(w){
if(!w.data){self.err='Неверный PIN';self.busy=false;return}
db.from('waiters').update({last_login_at:new Date().toISOString()}).eq('id',w.data.id).then(function(){});
self.session={venueId:v.data.id,venueName:v.data.name,waiterId:w.data.id,waiterName:w.data.name};
localStorage.setItem('waiter_session',JSON.stringify(self.session));
self.busy=false;self.load();self.loadHistory();self.startTimer();self.startStatsTimer()});
}).catch(function(e){self.err='Ошибка: '+e.message;self.busy=false})},
logout:function(){localStorage.removeItem('waiter_session');
if(this.timer){clearInterval(this.timer);this.timer=null}
if(this.statsTimer){clearInterval(this.statsTimer);this.statsTimer=null}
this.session=null;this.orders=[];this.history=[];this.loginForm={slug:'',pin:''}},
load:function(){var self=this;if(!self.session)return;
db.from('orders').select('*, items:order_items(*)')
.eq('venue_id',self.session.venueId).in('status',['ready','delivery'])
.order('created_at',{ascending:false}).limit(30).then(function(r){
if(!r.error)self.orders=r.data||[]})},
loadHistory:function(){var self=this;if(!self.session)return;
db.from('orders').select('*').eq('venue_id',self.session.venueId)
.eq('waiter_name',self.session.waiterName).in('status',['done','delivery'])
.order('updated_at',{ascending:false}).limit(50).then(function(r){
if(!r.error)self.history=r.data||[]})},
startTimer:function(){if(this.timer)clearInterval(this.timer);var self=this;this.timer=setInterval(function(){self.load()},3000)},
startStatsTimer:function(){if(this.statsTimer)clearInterval(this.statsTimer);var self=this;this.statsTimer=setInterval(function(){self.loadHistory()},10000)},
serve:function(id){var self=this;
db.from('orders').update({status:'done',waiter_name:self.session.waiterName}).eq('id',id).then(function(){self.load();self.loadHistory()})},
toCourier:function(id){var self=this;
db.from('orders').update({status:'delivery',waiter_name:self.session.waiterName}).eq('id',id).then(function(){self.load();self.loadHistory()})}
},
mounted:function(){var saved=localStorage.getItem('waiter_session');var self=this;
if(saved){try{self.session=JSON.parse(saved);self.load();self.loadHistory();self.startTimer();self.startStatsTimer()}catch(e){localStorage.removeItem('waiter_session')}}},
beforeUnmount:function(){if(this.timer)clearInterval(this.timer);if(this.statsTimer)clearInterval(this.statsTimer)}
}).mount('#app');
</script>
</body>
</html>
