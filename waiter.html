<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Официант — QR-SETKA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/pwa-install.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#fff;font:14px system-ui,-apple-system,sans-serif}.top{position:sticky;top:0;z-index:30;padding:12px 16px;background:#0b1120ee;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:auto;padding:16px}.brand{font-weight:800}.muted{color:#94a3b8;font-size:12px}.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #ffffff12;border-radius:11px;padding:10px 14px;background:#111827;color:#cbd5e1;cursor:pointer;white-space:nowrap;font-weight:700}.tab.on{background:#6366f1;color:#fff;border-color:#818cf8}.panel{display:none}.panel.on{display:block}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}.stat{padding:14px;border-radius:14px;background:#111827;border:1px solid #ffffff12}.stat b{font-size:22px;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#111827;border:1px solid #ffffff12;border-radius:16px;padding:14px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;color:#fff;background:#ffffff12;cursor:pointer}.primary{background:#6366f1}.green{background:#047857}.red{background:#991b1b}.yellow{background:#a16207}.input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#0b1220;color:#fff;margin:5px 0 12px}.login{max-width:380px;margin:70px auto;padding:24px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#ffffff10}.modal{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#111827;border-radius:22px 22px 0 0;padding:18px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.product{padding:10px;border:1px solid #ffffff12;border-radius:12px}.empty{text-align:center;color:#64748b;padding:30px}.history-frame{width:100%;height:calc(100vh - 230px);min-height:560px;border:1px solid #ffffff10;border-radius:18px;background:#0b1120}.section-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.mobile-bottom{display:none}@media(max-width:720px){.wrap{padding:12px}.top{padding:10px 12px}.tabs{margin-bottom:12px}.tab{padding:9px 12px}.grid{grid-template-columns:1fr}.history-frame{height:calc(100vh - 245px);min-height:520px}.top .muted{display:none}.mobile-bottom{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const db=window.db;
const state={token:sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||'',session:(()=>{try{return JSON.parse(sessionStorage.getItem('waiter_session')||'null')}catch(e){return null}})(),orders:[],tables:[],products:[],busy:false,tab:localStorage.getItem('waiter_tab')||'overview'};
const app=document.getElementById('app');
const money=n=>Number(n||0).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(r){state.token=r.token;state.session={venueId:r.venueId,venueName:r.venueName,staffName:r.staffName};sessionStorage.setItem('waiter_token',r.token);sessionStorage.setItem('staff_token',r.token);sessionStorage.setItem('waiter_session',JSON.stringify(state.session));}
function logout(){['staff_token','waiter_token','waiter_session','waiter_tab'].forEach(k=>sessionStorage.removeItem(k));location.reload();}
function setTab(t){state.tab=t;localStorage.setItem('waiter_tab',t);render();}
async function login(){state.busy=true;renderLogin();const r=await db.rpc('staff_login',{p_type:'waiter',p_slug:document.getElementById('slug').value.trim(),p_pin:document.getElementById('pin').value.trim()});state.busy=false;if(r.error||!r.data||r.data.error){renderLogin(r.error?.message||r.data?.error||'Неверные данные');return}save(r.data);state.tab='overview';load();}
async function load(){if(!state.token)return;const [o,t,p]=await Promise.all([db.rpc('staff_orders_json',{p_token:state.token}),db.rpc('staff_table_board',{p_token:state.token}),db.from('products').select('id,name,price,category,is_available').eq('venue_id',state.session.venueId).eq('is_available',true).neq('category','addon')]);if(o.error){logout();return}state.orders=Array.isArray(o.data)?o.data:[];state.tables=Array.isArray(t.data?.tables)?t.data.tables:[];state.products=p.data||[];render();}
function status(s){return({new:'Новый',cooking:'Готовится',ready:'Готов',delivery:'У курьера',arrived:'Прибыл',done:'Выдан',cancelled:'Отменён'})[s]||s;}
async function orderStatus(id,s){const r=await db.rpc('staff_update_order',{p_token:state.token,p_order_id:id,p_status:s});if(r.error)alert(r.error.message);else load();}
async function tableAction(id,a){let r;if(a==='seat')r=await db.rpc('staff_seat_table',{p_token:state.token,p_table_id:id,p_guest_count:1,p_guest_name:null,p_guest_phone:null});if(a==='reserve')r=await db.rpc('staff_reserve_table',{p_token:state.token,p_table_id:id,p_reserved_until:new Date(Date.now()+7200000).toISOString(),p_note:null,p_guest_name:null,p_guest_phone:null});if(a==='release')r=await db.rpc('staff_release_table',{p_token:state.token,p_table_id:id});if(r?.error)alert(r.error.message);else load();}
function openOrder(tableId){const table=state.tables.find(t=>t.id===tableId);const cart={};if(!table)return;const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between"><h3>Заказ · '+esc(table.name||('Стол '+table.table_number))+'</h3><button class="btn" id="x">✕</button></div><div class="products" id="ps"></div><div id="cart"></div><button class="btn primary" id="send" style="width:100%;margin-top:12px">Отправить заказ</button></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();const ps=m.querySelector('#ps');state.products.forEach(p=>{const d=document.createElement('div');d.className='product';d.innerHTML='<b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' ₽</div><button class="btn" style="margin-top:7px">Добавить</button>';d.querySelector('button').onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;draw()};ps.appendChild(d);});function draw(){m.querySelector('#cart').innerHTML=Object.entries(cart).map(([id,q])=>{const p=state.products.find(x=>x.id===id);return '<div style="padding:8px 0;border-bottom:1px solid #ffffff0d">'+esc(p.name)+' × '+q+' — '+money(p.price*q)+' ₽</div>';}).join('')||'<div class="empty">Корзина пуста</div>';}
m.querySelector('#send').onclick=async()=>{const items=Object.entries(cart).map(([product_id,qty])=>({product_id,qty}));if(!items.length)return alert('Добавьте товары');const key=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const r=await db.rpc('staff_create_session_order',{p_token:state.token,p_table_id:tableId,p_customer_name:null,p_comment:null,p_payment_method:'cash',p_items:items,p_addons:[],p_operation_key:key});if(r.error)alert(r.error.message);else{m.remove();load();}};draw();}
function renderLogin(err=''){app.innerHTML='<div class="login card"><h2>🤵 Официант</h2><div class="muted">Код заведения + 4-значный PIN</div><input id="slug" class="input" placeholder="Код заведения"><input id="pin" class="input" placeholder="PIN" maxlength="4" inputmode="numeric" type="password"><div style="color:#f87171;min-height:20px">'+esc(err)+'</div><button class="btn primary" id="go" style="width:100%">'+(state.busy?'Проверяем…':'Войти')+'</button></div>';document.getElementById('go').onclick=login;}
function tableCard(t){const busy=t.occupancy_status==='occupied',res=t.occupancy_status==='reserved',d=document.createElement('div');d.className='card';d.innerHTML='<div style="display:flex;justify-content:space-between"><b>🪑 '+esc(t.name||('Стол '+t.table_number))+'</b><span class="badge">'+(busy?'Занят':res?'Резерв':'Свободен')+'</span></div><div class="muted" style="margin-top:6px">'+(t.session?'Заказов: '+(t.session.order_count||0)+' · '+money(t.session.total_price||0)+' ₽':'Нет активной сессии')+'</div><div class="actions">'+(busy?'<button class="btn red" data-a="release">Освободить</button><button class="btn primary" data-a="order">+ Заказ</button>':'<button class="btn green" data-a="seat">Посадить</button><button class="btn yellow" data-a="reserve">Резерв</button>')+'</div>';d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>b.dataset.a==='order'?openOrder(t.id):tableAction(t.id,b.dataset.a));return d;}
function orderCard(o){const d=document.createElement('div');d.className='card';d.innerHTML='<div style="display:flex;justify-content:space-between"><b>№'+esc(o.order_number)+'</b><span class="badge">'+status(o.status)+'</span></div><div style="margin-top:8px">'+(Array.isArray(o.items)?o.items.map(i=>(i.qty||1)+'× '+esc(i.name||i.product_name||'Товар')).join('<br>'):'')+'</div><b>'+money(o.total_price)+' ₽</b><div class="actions">'+(o.status==='new'?'<button class="btn primary" data-s="cooking">В работу</button>':'')+(o.status==='cooking'?'<button class="btn green" data-s="ready">Готово</button>':'')+(o.status==='ready'&&o.order_type==='delivery'?'<button class="btn primary" data-s="delivery">Курьеру</button>':'')+((o.status==='ready'||o.status==='arrived')?'<button class="btn green" data-s="done">Выдан</button>':'')+'</div>';d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>orderStatus(o.id,b.dataset.s));return d;}
function render(){if(!state.token){renderLogin();return}const active=state.orders.filter(o=>!['done','cancelled'].includes(o.status));const occupied=state.tables.filter(t=>t.occupancy_status==='occupied').length;app.innerHTML='<div class="top"><div><div class="brand">🤵 '+esc(state.session?.venueName||'Официант')+'</div><div class="muted">'+esc(state.session?.staffName||'')+'</div></div><button class="btn" id="logout">Выйти</button></div><div class="wrap"><nav class="tabs"><button class="tab '+(state.tab==='overview'?'on':'')+'" data-tab="overview">Обзор</button><button class="tab '+(state.tab==='tables'?'on':'')+'" data-tab="tables">🪑 Столы</button><button class="tab '+(state.tab==='orders'?'on':'')+'" data-tab="orders">📋 Заказы</button><button class="tab '+(state.tab==='history'?'on':'')+'" data-tab="history">🕘 История</button></nav><section class="panel '+(state.tab==='overview'?'on':'')+'" id="p-overview"><div class="stats"><div class="stat"><b>'+state.tables.length+'</b><span class="muted">Столов</span></div><div class="stat"><b>'+occupied+'</b><span class="muted">Занято</span></div><div class="stat"><b>'+active.length+'</b><span class="muted">В работе</span></div><div class="stat"><b>'+money(active.reduce((s,o)=>s+Number(o.total_price||0),0))+' ₽</b><span class="muted">Оборот активных</span></div></div><div class="grid"><div class="card"><div class="section-head"><h3>🪑 Быстрый доступ к залу</h3></div><div class="muted">Управление посадкой, резервом и заказами по столам.</div><div class="actions"><button class="btn primary" data-goto="tables">Открыть столы</button></div></div><div class="card"><div class="section-head"><h3>📋 Текущие заказы</h3></div><div class="muted">Новые и активные заказы персонала.</div><div class="actions"><button class="btn primary" data-goto="orders">Открыть заказы</button></div></div></div></section><section class="panel '+(state.tab==='tables'?'on':'')+'" id="p-tables"><div class="section-head"><div><h2 style="margin:0">🪑 Столы</h2><div class="muted">Посадка, резерв, освобождение и добавление заказа в текущую сессию.</div></div></div><div class="grid" id="tables"></div></section><section class="panel '+(state.tab==='orders'?'on':'')+'" id="p-orders"><div class="section-head"><div><h2 style="margin:0">📋 Заказы</h2><div class="muted">Все активные заказы заведения.</div></div></div><div class="grid" id="orders"></div></section><section class="panel '+(state.tab==='history'?'on':'')+'" id="p-history"><div class="section-head"><div><h2 style="margin:0">🕘 История заказов</h2><div class="muted">Полная история работы официанта.</div></div><a class="btn" href="staff-history.html" target="_blank" rel="noopener">Открыть отдельно</a></div><iframe class="history-frame" src="staff-history.html"></iframe></section></div>';
document.getElementById('logout').onclick=logout;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setTab(b.dataset.goto));
const tg=document.getElementById('tables');state.tables.forEach(t=>tg.appendChild(tableCard(t)));if(!tg.children.length)tg.innerHTML='<div class="empty">Столы не настроены</div>';const og=document.getElementById('orders');state.orders.filter(o=>!['done','cancelled'].includes(o.status)).forEach(o=>og.appendChild(orderCard(o)));if(!og.children.length)og.innerHTML='<div class="empty">Нет активных заказов</div>';}
try{state.session=JSON.parse(localStorage.getItem('waiter_session')||'null')}catch(e){}
render();if(state.token)load();setInterval(()=>state.token&&load(),5000);
</script>
<script data-qr-waiter-direct-login>
(() => {
  const SUPA_URL='https://ulxfsozdryqrnlxzlblt.supabase.co';
  const SUPA_KEY='sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq';
  const client=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});
  function install(){
    const btn=document.getElementById('go'), slug=document.getElementById('slug'), pin=document.getElementById('pin');
    if(!btn||!slug||!pin){setTimeout(install,150);return;}
    if(btn.dataset.qrWaiterDirectLogin==='1')return;
    btn.dataset.qrWaiterDirectLogin='1';
    btn.onclick=async(e)=>{
      e&&e.preventDefault();
      btn.disabled=true;btn.textContent='Проверяем...';
      const err=document.querySelector('#app .err, #app [style*="f87171"]');
      const s=String(slug.value||'').trim().toLowerCase();
      const p=String(pin.value||'').replace(/\s+/g,'').trim();
      try{
        if(!s)throw new Error('Введите код заведения');
        if(!/^\d{4}$/.test(p))throw new Error('PIN должен состоять из 4 цифр');
        const r=await client.rpc('staff_login',{p_type:'waiter',p_slug:s,p_pin:p});
        if(r.error||!r.data||r.data.error){
          let m=(r.error&&r.error.message)||(r.data&&r.data.error)||'Не удалось войти';
          m=String(m);
          if(m.includes('wrong_pin'))m='Неверный PIN';
          else if(m.includes('venue_not_found'))m='Заведение не найдено или неактивно';
          else if(m.includes('slug_or_pin_required'))m='Не передан код заведения или PIN';
          throw new Error(m);
        }
        sessionStorage.setItem('waiter_token',r.data.token);
        sessionStorage.setItem('waiter_session',JSON.stringify({token:r.data.token,venueId:r.data.venueId,venueName:r.data.venueName,staffName:r.data.staffName}));
        sessionStorage.setItem('waiter_tab','overview');
        location.reload();
      }catch(x){
        if(err)err.textContent=x.message||'Ошибка входа'; else alert(x.message||'Ошибка входа');
        btn.disabled=false;btn.textContent='Войти';
      }
    };
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
</script>
</body>
</html>
