<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Официант — QR-SETKA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/pwa-install.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#fff;font:14px system-ui}.top{position:sticky;top:0;z-index:20;padding:12px 16px;background:#0b1120ee;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:#111827;border:1px solid #ffffff12;border-radius:16px;padding:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.stat{padding:14px;border-radius:14px;background:#111827;border:1px solid #ffffff12}.stat b{font-size:22px;display:block}.muted{color:#94a3b8;font-size:12px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;color:#fff;background:#ffffff12;cursor:pointer}.primary{background:#6366f1}.green{background:#047857}.red{background:#991b1b}.yellow{background:#a16207}.input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#0b1220;color:#fff;margin:5px 0 12px}.login{max-width:380px;margin:70px auto;padding:24px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#ffffff10}.modal{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#111827;border-radius:22px 22px 0 0;padding:18px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.product{padding:10px;border:1px solid #ffffff12;border-radius:12px}.empty{text-align:center;color:#64748b;padding:30px}</style></head><body><div id="app"></div><script>
const db=window.db,state={token:localStorage.getItem('waiter_token')||'',session:null,orders:[],tables:[],products:[],busy:false},app=document.getElementById('app');
const money=n=>Number(n||0).toLocaleString('ru-RU'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(r){state.token=r.token;state.session={venueId:r.venueId,venueName:r.venueName,staffName:r.staffName};localStorage.setItem('waiter_token',r.token);localStorage.setItem('staff_token',r.token);localStorage.setItem('waiter_session',JSON.stringify(state.session))}function logout(){['waiter_token','staff_token','waiter_session'].forEach(k=>localStorage.removeItem(k));location.reload()}
async function login(){state.busy=true;render();const r=await db.rpc('staff_login',{p_type:'waiter',p_slug:document.getElementById('slug').value.trim(),p_pin:document.getElementById('pin').value.trim()});state.busy=false;if(r.error||!r.data||r.data.error){renderLogin(r.error?.message||r.data?.error||'Неверные данные');return}save(r.data);load()}
async function load(){if(!state.token)return;const [o,t,p]=await Promise.all([db.rpc('staff_orders_json',{p_token:state.token}),db.rpc('staff_table_board',{p_token:state.token}),db.from('products').select('id,name,price,category,is_available').eq('venue_id',state.session.venueId).eq('is_available',true).neq('category','addon')]);if(o.error){logout();return}state.orders=Array.isArray(o.data)?o.data:[];state.tables=Array.isArray(t.data?.tables)?t.data.tables:[];state.products=p.data||[];render()}
function status(s){return({new:'Новый',cooking:'Готовится',ready:'Готов',delivery:'У курьера',arrived:'Прибыл',done:'Выдан',cancelled:'Отменён'})[s]||s}
async function orderStatus(id,s){const r=await db.rpc('staff_update_order',{p_token:state.token,p_order_id:id,p_status:s});if(r.error)alert(r.error.message);else load()}
async function tableAction(id,a){let r;if(a==='seat')r=await db.rpc('staff_seat_table',{p_token:state.token,p_table_id:id,p_guest_count:1,p_guest_name:null,p_guest_phone:null});if(a==='reserve')r=await db.rpc('staff_reserve_table',{p_token:state.token,p_table_id:id,p_reserved_until:new Date(Date.now()+7200000).toISOString(),p_note:null,p_guest_name:null,p_guest_phone:null});if(a==='release')r=await db.rpc('staff_release_table',{p_token:state.token,p_table_id:id});if(r?.error)alert(r.error.message);else load()}
function openOrder(tableId){const table=state.tables.find(t=>t.id===tableId),cart={};if(!table)return;const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between"><h3>Заказ · '+esc(table.name||('Стол '+table.table_number))+'</h3><button class="btn" id="x">✕</button></div><div class="products" id="ps"></div><div id="cart"></div><button class="btn primary" id="send" style="width:100%;margin-top:12px">Отправить заказ</button></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();const ps=m.querySelector('#ps');state.products.forEach(p=>{const d=document.createElement('div');d.className='product';d.innerHTML='<b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' ₽</div><button class="btn" style="margin-top:7px">Добавить</button>';d.querySelector('button').onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;draw()};ps.appendChild(d)});function draw(){m.querySelector('#cart').innerHTML=Object.entries(cart).map(([id,q])=>{const p=state.products.find(x=>x.id===id);return '<div style="padding:8px 0;border-bottom:1px solid #ffffff0d">'+esc(p.name)+' × '+q+' — '+money(p.price*q)+' ₽</div>'}).join('')||'<div class="empty">Корзина пуста</div>'}m.querySelector('#send').onclick=async()=>{const items=Object.entries(cart).map(([product_id,qty])=>({product_id,qty}));if(!items.length)return alert('Добавьте товары');const r=await db.rpc('staff_create_session_order',{p_token:state.token,p_table_id:tableId,p_customer_name:null,p_comment:null,p_payment_method:'cash',p_items:items,p_addons:[],p_operation_key:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()});if(r.error)alert(r.error.message);else{m.remove();load()}};draw()}
function renderLogin(err=''){app.innerHTML='<div class="login card"><h2>🤵 Официант</h2><div class="muted">Код заведения + 4-значный PIN</div><input id="slug" class="input" placeholder="Код заведения"><input id="pin" class="input" placeholder="PIN" maxlength="4" inputmode="numeric" type="password"><div style="color:#f87171;min-height:20px">'+esc(err)+'</div><button class="btn primary" id="go" style="width:100%">'+(state.busy?'Проверяем…':'Войти')+'</button></div>';document.getElementById('go').onclick=login}
function render(){if(!state.token){renderLogin();return}const active=state.orders.filter(o=>!['done','cancelled'].includes(o.status));app.innerHTML='<div class="top"><b>🤵 '+esc(state.session?.venueName||'Официант')+'</b><div>'+esc(state.session?.staffName||'')+' <button class="btn" id="logout">Выйти</button></div></div><div class="wrap"><div class="stats"><div class="stat"><b>'+state.tables.length+'</b><span class="muted">Столов</span></div><div class="stat"><b>'+state.tables.filter(t=>t.occupancy_status==='occupied').length+'</b><span class="muted">Занято</span></div><div class="stat"><b>'+active.length+'</b><span class="muted">В работе</span></div></div><h3>🪑 Столы</h3><div class="grid" id="tables"></div><h3>📋 Заказы</h3><div class="grid" id="orders"></div></div>';document.getElementById('logout').onclick=logout;const tg=document.getElementById('tables');state.tables.forEach(t=>{const busy=t.occupancy_status==='occupied',res=t.occupancy_status==='reserved',d=document.createElement('div');d.className='card';d.innerHTML='<div style="display:flex;justify-content:space-between"><b>🪑 '+esc(t.name||('Стол '+t.table_number))+'</b><span class="badge">'+(busy?'Занят':res?'Резерв':'Свободен')+'</span></div><div class="muted" style="margin-top:6px">'+(t.session?'Заказов: '+(t.session.order_count||0)+' · '+money(t.session.total_price||0)+' ₽':'Нет активной сессии')+'</div><div class="actions">'+(busy?'<button class="btn red" data-a="release">Освободить</button><button class="btn primary" data-a="order">+ Заказ</button>':'<button class="btn green" data-a="seat">Посадить</button><button class="btn yellow" data-a="reserve">Резерв</button>')+'</div>';d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>b.dataset.a==='order'?openOrder(t.id):tableAction(t.id,b.dataset.a));tg.appendChild(d)});const og=document.getElementById('orders');state.orders.filter(o=>!['done','cancelled'].includes(o.status)).forEach(o=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div style="display:flex;justify-content:space-between"><b>№'+esc(o.order_number)+'</b><span class="badge">'+status(o.status)+'</span></div><div style="margin-top:8px">'+(Array.isArray(o.items)?o.items.map(i=>(i.qty||1)+'× '+esc(i.name||i.product_name||'Товар')).join('<br>'):'')+'</div><b>'+money(o.total_price)+' ₽</b><div class="actions">'+(o.status==='new'?'<button class="btn primary" data-s="cooking">В работу</button>':'')+(o.status==='cooking'?'<button class="btn green" data-s="ready">Готово</button>':'')+(o.status==='ready'&&o.order_type==='delivery'?'<button class="btn primary" data-s="delivery">Курьеру</button>':'')+((o.status==='ready'||o.status==='arrived')?'<button class="btn green" data-s="done">Выдан</button>':'')+'</div>';d.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>orderStatus(o.id,b.dataset.s));og.appendChild(d)});if(!og.children.length)og.innerHTML='<div class="empty">Нет активных заказов</div>'}
try{state.session=JSON.parse(localStorage.getItem('waiter_session')||'null')}catch(e){}render();if(state.token)load();setInterval(()=>state.token&&load(),5000);
</script></body></html>
