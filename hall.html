<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>План зала — QR-Menu</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>body{margin:0}.hall-wrap{padding:18px;max-width:1500px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar .hint{margin-left:auto}.hall-shell{position:relative;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:#0b1220;overflow:auto}.hall{position:relative;width:1400px;height:780px;background-color:#101827;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}.table-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;user-select:none;border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 28px rgba(0,0,0,.28);touch-action:none}.table-node.dragging{opacity:.72;z-index:10;cursor:grabbing}.round{border-radius:50%;width:96px;height:96px}.square{border-radius:16px;width:100px;height:100px}.rectangle{border-radius:16px;width:156px;height:88px}.free{background:rgba(34,197,94,.14);border-color:#22c55e}.reserved{background:rgba(245,158,11,.16);border-color:#f59e0b}.occupied{background:rgba(239,68,68,.16);border-color:#ef4444}.blocked,.maintenance{background:rgba(100,116,139,.18);border-color:#64748b}.table-num{font-weight:800;font-size:16px}.table-name{font-size:11px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table-meta{font-size:10px;opacity:.72}.panel{position:fixed;right:18px;top:18px;bottom:18px;width:min(390px,calc(100% - 36px));z-index:50;overflow:auto;background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.field{margin:10px 0}.field label{display:block;font-size:12px;opacity:.75;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0b1220;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 2px;color:#aeb9ca;font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.hint{opacity:.7;font-size:12px}.qr{word-break:break-all;font-size:11px;opacity:.75}.venue-title{font-size:19px;font-weight:800}.empty{padding:80px 20px;text-align:center;color:#9aa7bd}.tools{display:flex;gap:6px}.zoom{display:flex;align-items:center;gap:6px}.zoom span{min-width:45px;text-align:center;font-size:12px;color:#aeb9ca}.error-box{margin:12px 0;padding:12px;border-radius:12px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#fecaca}@media(max-width:700px){.hall-wrap{padding:10px}.hall{width:1100px;height:700px}.toolbar .hint{width:100%;order:10}.panel{right:10px;top:10px;bottom:10px;width:calc(100% - 20px)}}</style></head><body><div class="hall-wrap"><div class="toolbar"><div><div class="venue-title" id="venueTitle">План зала</div><div class="hint">Столы автоматически относятся к выбранному заведению. Перетаскивайте их мышью или пальцем.</div></div><div class="tools"><button class="btn btn-primary" id="add">＋ Стол</button><button class="btn btn-ghost" id="refresh">↻</button><div class="zoom"><button class="btn btn-ghost" id="zoomOut">−</button><span id="zoomLabel">100%</span><button class="btn btn-ghost" id="zoomIn">＋</button></div></div></div><div id="error" class="error-box" hidden></div><div class="hall-shell"><div id="hall" class="hall"></div></div><div class="legend"><span><i style="background:#22c55e"></i>Свободен</span><span><i style="background:#f59e0b"></i>Резерв</span><span><i style="background:#ef4444"></i>Занят</span><span><i style="background:#64748b"></i>Недоступен</span></div></div><div id="panel" class="panel" hidden></div><script>const db=window.db;let tables=[],selected=null,zoom=1;function getVenueId(){let id='';try{id=new URLSearchParams(location.search).get('venue')||''}catch(e){}if(id)return id;return localStorage.getItem('manager_venue_id')||localStorage.getItem('selectedVenueId')||''}const venueId=getVenueId();const $=id=>document.getElementById(id);function showError(msg){$('error').textContent=msg;$('error').hidden=!msg}function friendlyError(msg){if(!msg)return'Неизвестная ошибка';if(String(msg).includes('not_allowed')||String(msg).includes('not_authorized'))return'У текущего аккаунта нет прав управления выбранным заведением. Перейдите обратно в список заведений и заново откройте нужное заведение.';if(String(msg).includes('table_number_exists'))return'Стол с таким номером уже существует.';return String(msg)}async function load(){showError('');if(!venueId){$('venueTitle').textContent='Заведение не выбрано';$('hall').innerHTML='<div class="empty">Откройте вкладку «Зал» из кабинета управляющего.<br>ID заведения вводить не нужно.</div>';return}localStorage.setItem('manager_venue_id',venueId);const r=await db.rpc('manager_table_board',{p_venue_id:venueId});if(r.error){showError(friendlyError(r.error.message));return}tables=r.data?.tables||r.data||[];render()}function render(){const h=$('hall');h.innerHTML='';tables.forEach(t=>{const n=document.createElement('div'),shape=t.shape==='rectangle'?'rectangle':t.shape==='round'?'round':'square',status=t.occupancy_status||t.status||'free';n.className=`table-node ${shape} ${status}`;n.style.left=Number(t.pos_x??t.x??0)+'px';n.style.top=Number(t.pos_y??t.y??0)+'px';n.innerHTML=`<div class="table-num">№${t.table_number}</div><div class="table-name">${esc(t.name||'')}</div><div class="table-meta">${t.guest_count||t.session_guest_count||0}/${t.seats||4} мест</div>`;n.onclick=()=>open(t);n.onpointerdown=e=>dragStart(e,n,t);h.appendChild(n)})}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m))}function dragStart(e,n,t){if(e.button!==undefined&&e.button!==0)return;const sx=e.clientX,sy=e.clientY,ox=Number(t.pos_x??t.x??0),oy=Number(t.pos_y??t.y??0);let moved=false;n.setPointerCapture(e.pointerId);n.classList.add('dragging');const move=ev=>{const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;n.style.left=Math.max(0,Math.round((ox+dx)/16)*16)+'px';n.style.top=Math.max(0,Math.round((oy+dy)/16)*16)+'px'};const up=async()=>{n.classList.remove('dragging');n.removeEventListener('pointermove',move);n.removeEventListener('pointerup',up);if(!moved){open(t);return}const x=parseInt(n.style.left),y=parseInt(n.style.top),r=await db.rpc('manager_move_table',{p_venue_id:venueId,p_table_id:t.id,p_x:x,p_y:y});if(r.error){showError(friendlyError(r.error.message));return}t.pos_x=x;t.pos_y=y};n.addEventListener('pointermove',move);n.addEventListener('pointerup',up)}function open(t){selected=t;const p=$('panel');p.hidden=false;p.innerHTML=`<button class="btn btn-ghost" style="float:right" onclick="closePanel()">✕</button><h3>Стол №${t.table_number}</h3><div class="hint">${t.occupancy_status||t.status||'free'} · ${t.guest_count||t.session_guest_count||0} гостей · ${Number(t.total_amount||0).toLocaleString('ru-RU')} ₽</div><div class="field"><label>Номер</label><input id="tn" type="number" min="1" value="${t.table_number}"></div><div class="field"><label>Название</label><input id="tname" value="${esc(t.name||'')}"></div><div class="field"><label>Форма</label><select id="shape"><option value="round">Круг</option><option value="square">Квадрат</option><option value="rectangle">Прямоугольник</option></select></div><div class="field"><label>Мест</label><input id="seats" type="number" min="1" value="${t.seats||4}"></div><button class="btn btn-primary" style="width:100%" onclick="saveTable()">Сохранить</button><hr><div class="actions"><button class="btn btn-ghost" onclick="tableAction('reserved')">Резерв</button><button class="btn btn-green" onclick="tableAction('occupied')">Посадить</button><button class="btn btn-ghost" onclick="tableAction('free')">Освободить</button><button class="btn btn-ghost" onclick="showQR()">QR-код</button><button class="btn btn-danger" onclick="deleteTable()">Удалить</button></div><div id="qrbox" class="qr" style="margin-top:14px"></div><p class="hint">Освобождение проверяется сервером при наличии открытых заказов.</p>`;$('shape').value=t.shape==='rectangle'?'rectangle':t.shape==='round'?'round':'square'}function closePanel(){$('panel').hidden=true}async function saveTable(){const r=await db.rpc('manager_update_table',{p_venue_id:venueId,p_table_id:selected.id,p_number:+$('tn').value,p_name:$('tname').value,p_shape:$('shape').value,p_seats:+$('seats').value,p_active:true});if(r.error)return showError(friendlyError(r.error.message));closePanel();load()}async function tableAction(status){const r=await db.rpc('manager_set_table_status',{p_venue_id:venueId,p_table_id:selected.id,p_status:status,p_reserved_until:status==='reserved'?new Date(Date.now()+7200000).toISOString():null,p_note:null});if(r.error)return showError(friendlyError(r.error.message));closePanel();load()}async function deleteTable(){if(!selected||!confirm('Удалить стол?'))return;const r=await db.rpc('manager_delete_table',{p_venue_id:venueId,p_table_id:selected.id});if(r.error)return showError(friendlyError(r.error.message));closePanel();load()}async function addTable(){showError('');if(!venueId)return showError('Не выбрано заведение. Откройте «Зал» из кабинета управляющего.');const next=Math.max(0,...tables.map(x=>Number(x.table_number)||0))+1;const r=await db.rpc('manager_create_table',{p_venue_id:venueId,p_number:next,p_name:'Стол '+next,p_shape:'round',p_seats:4,p_x:120,p_y:120});if(r.error)return showError(friendlyError(r.error.message));load()}function showQR(){const url=location.origin+'/menu-v2.html?table='+encodeURIComponent(selected.qr_token||'');$('qrbox').innerHTML='<b>QR URL</b><br>'+url+'<br><br>QR закреплён за этим столом.'}function setZoom(v){zoom=Math.max(.75,Math.min(1.25,v));$('hall').style.transformOrigin='top left';$('hall').style.transform=`scale(${zoom})`;$('zoomLabel').textContent=Math.round(zoom*100)+'%'}$('add').onclick=addTable;$('refresh').onclick=load;$('zoomIn').onclick=()=>setZoom(zoom+.1);$('zoomOut').onclick=()=>setZoom(zoom-.1);load();</script></body></html>
