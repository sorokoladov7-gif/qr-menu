<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зал — QR-Menu</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<style>
body{margin:0}.hall-wrap{padding:20px;max-width:1400px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.hall{position:relative;min-height:680px;overflow:auto;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(99,102,241,.05));background-size:40px 40px;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px)}.table-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;border:2px solid rgba(255,255,255,.3);box-shadow:0 10px 30px rgba(0,0,0,.2);transition:.15s}.table-node:hover{transform:scale(1.04)}.table-node.dragging{opacity:.7;z-index:10}.round{border-radius:50%;width:92px;height:92px}.square{border-radius:16px;width:96px;height:96px}.rectangle{border-radius:16px;width:150px;height:88px}.free{background:rgba(34,197,94,.16);border-color:#22c55e}.reserved{background:rgba(245,158,11,.18);border-color:#f59e0b}.occupied{background:rgba(239,68,68,.18);border-color:#ef4444}.blocked,.maintenance{background:rgba(100,116,139,.2);border-color:#64748b}.table-num{font-weight:800}.table-meta{font-size:11px;opacity:.8}.panel{position:fixed;right:18px;top:18px;bottom:18px;width:min(390px,calc(100% - 36px));z-index:50;overflow:auto;background:#111827;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.field{margin:10px 0}.field label{display:block;font-size:12px;opacity:.75;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0b1220;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{padding:10px;border-radius:12px;margin:10px 0}.hint{opacity:.7;font-size:12px}.qr{word-break:break-all;font-size:11px;opacity:.75}
</style>
</head>
<body>
<div class="hall-wrap">
<h2>Схема зала</h2>
<div class="toolbar"><input id="venueId" placeholder="ID заведения" style="flex:1;min-width:220px"><button class="btn btn-primary" id="load">Загрузить</button><button class="btn btn-ghost" id="add">+ Стол</button><span id="msg" class="hint"></span></div>
<div id="hall" class="hall"></div>
</div>
<div id="panel" class="panel" hidden></div>
<script>
const db=window.db;let venueId=localStorage.getItem('manager_venue_id')||new URLSearchParams(location.search).get('venue');let tables=[];let selected=null;
const $=id=>document.getElementById(id);if(venueId)$('venueId').value=venueId;
function notify(t){$('msg').textContent=t;setTimeout(()=>{$('msg').textContent=''},3000)}
async function load(){venueId=$('venueId').value.trim();if(!venueId)return notify('Укажите ID заведения');localStorage.setItem('manager_venue_id',venueId);const r=await db.rpc('manager_table_board',{p_venue_id:venueId});if(r.error)return notify(r.error.message);tables=r.data?.tables||[];render()}
function render(){const h=$('hall');h.innerHTML='';tables.forEach(t=>{const n=document.createElement('div');n.className=`table-node ${t.shape} ${t.occupancy_status}`;n.style.left=t.pos_x+'px';n.style.top=t.pos_y+'px';n.dataset.id=t.id;n.innerHTML=`<div class="table-num">№${t.table_number}</div><div class="table-meta">${t.name||''}</div><div class="table-meta">${t.guest_count||0}/${t.seats}</div>`;n.onclick=()=>open(t);n.onpointerdown=e=>dragStart(e,n,t);h.appendChild(n)})}
function dragStart(e,n,t){if(e.button!==0)return;let sx=e.clientX,sy=e.clientY,ox=t.pos_x,oy=t.pos_y,moved=false;n.setPointerCapture(e.pointerId);n.classList.add('dragging');const move=ev=>{const x=Math.max(0,ox+ev.clientX-sx),y=Math.max(0,oy+ev.clientY-sy);n.style.left=x+'px';n.style.top=y+'px';moved=true};const up=async()=>{n.classList.remove('dragging');n.removeEventListener('pointermove',move);n.removeEventListener('pointerup',up);if(moved){t.pos_x=parseInt(n.style.left);t.pos_y=parseInt(n.style.top);const r=await db.rpc('manager_move_table',{p_venue_id:venueId,p_table_id:t.id,p_x:t.pos_x,p_y:t.pos_y});if(r.error)notify(r.error.message)}};n.addEventListener('pointermove',move);n.addEventListener('pointerup',up)}
function open(t){selected=t;const p=$('panel');p.hidden=false;p.innerHTML=`<button class="btn btn-ghost" style="float:right" onclick="closePanel()">✕</button><h3>Стол №${t.table_number}</h3><div class="status">Статус: <b>${t.occupancy_status}</b><br>Заказов: ${t.order_count||0}<br>Сумма: ${Number(t.total_amount||0).toLocaleString('ru-RU')} ₽</div><div class="field"><label>Номер</label><input id="tn" value="${t.table_number}"></div><div class="field"><label>Название</label><input id="tname" value="${t.name||''}"></div><div class="field"><label>Форма</label><select id="shape"><option value="round">Круг</option><option value="square">Квадрат</option><option value="rectangle">Прямоугольник</option></select></div><div class="field"><label>Мест</label><input id="seats" type="number" min="1" value="${t.seats}"></div><button class="btn btn-primary" style="width:100%" onclick="saveTable()">Сохранить</button><hr><div class="actions"><button class="btn btn-ghost" onclick="tableAction('reserved')">Резерв</button><button class="btn btn-green" onclick="tableAction('occupied')">Посадить</button><button class="btn btn-ghost" onclick="tableAction('free')">Освободить</button><button class="btn btn-ghost" onclick="showQR()">QR-код</button></div><div id="qrbox" class="qr" style="margin-top:14px"></div><p class="hint">Освобождение запрещено сервером, если у текущей сессии есть открытые заказы.</p>`;$('shape').value=t.shape}
function closePanel(){$('panel').hidden=true}
async function saveTable(){const r=await db.rpc('manager_update_table',{p_venue_id:venueId,p_table_id:selected.id,p_number:+$('tn').value,p_name:$('tname').value,p_shape:$('shape').value,p_seats:+$('seats').value,p_active:true});if(r.error)return notify(r.error.message);closePanel();await load()}
async function tableAction(status){const r=await db.rpc('manager_set_table_status',{p_venue_id:venueId,p_table_id:selected.id,p_status:status,p_reserved_until:status==='reserved'?new Date(Date.now()+7200000).toISOString():null,p_note:null});if(r.error)return notify(r.error.message);closePanel();await load()}
function showQR(){const url=location.origin+location.pathname.replace('hall.html','menu.html')+'?table='+selected.qr_token;$('qrbox').innerHTML='<b>QR URL</b><br>'+url+'<br><br>Для печати используйте URL как источник QR.'}
$('load').onclick=load;$('add').onclick=async()=>{const r=await db.from('venue_tables').insert({venue_id:venueId,table_number:(Math.max(0,...tables.map(x=>x.table_number||0))+1),name:'Новый стол',pos_x:80,pos_y:80,seats:4,shape:'round'}).select().single();if(r.error)notify(r.error.message);else load()};if(venueId)load();
</script>
</body></html>
