<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зал — QR-Menu</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#080d17;--card:#111827;--muted:#94a3b8;--line:rgba(255,255,255,.1)}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.hall-wrap{max-width:1550px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:15px}.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#182235;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.btn:hover{filter:brightness(1.12)}.btn-primary{background:#2563eb;border-color:#3b82f6}.btn-danger{background:#7f1d1d}.error{padding:12px 14px;border-radius:12px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.35);color:#fecaca;margin-bottom:14px}.error[hidden]{display:none}.hall-shell{border:1px solid var(--line);border-radius:20px;background:#0b1220;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}.hall{position:relative;width:1500px;height:760px;background-color:#0d1728;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:32px 32px}.hall-label{position:absolute;left:28px;top:22px;color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:1.5px}.table-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;user-select:none;border:2px solid rgba(255,255,255,.38);box-shadow:0 10px 30px rgba(0,0,0,.3);touch-action:none;transition:box-shadow .15s,transform .15s}.table-node:hover{box-shadow:0 14px 38px rgba(0,0,0,.42);transform:translateY(-1px)}.table-node.dragging{opacity:.72;cursor:grabbing;z-index:20}.round{width:96px;height:96px;border-radius:50%}.square{width:100px;height:100px;border-radius:15px}.rectangle{width:160px;height:88px;border-radius:15px}.free{background:rgba(34,197,94,.16);border-color:#22c55e}.reserved{background:rgba(245,158,11,.18);border-color:#f59e0b}.occupied{background:rgba(239,68,68,.18);border-color:#ef4444}.blocked,.maintenance{background:rgba(100,116,139,.18);border-color:#64748b}.table-num{font-weight:900;font-size:17px}.table-name{font-size:11px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table-meta{font-size:10px;color:#cbd5e1;margin-top:2px}.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 2px;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.cards-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.cards-title h3{margin:0;font-size:17px}.cards-title span{font-size:12px;color:var(--muted)}.table-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.table-card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;cursor:pointer;transition:.15s}.table-card:hover{border-color:rgba(96,165,250,.5);transform:translateY(-1px)}.card-head{display:flex;justify-content:space-between;align-items:center}.card-number{font-size:17px;font-weight:900}.status{font-size:11px;padding:4px 8px;border-radius:999px}.status.free{color:#86efac;background:rgba(34,197,94,.12)}.status.reserved{color:#fcd34d;background:rgba(245,158,11,.12)}.status.occupied{color:#fca5a5;background:rgba(239,68,68,.12)}.card-name{color:var(--muted);font-size:12px;margin:5px 0 10px}.card-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}.info-box{background:#0b1220;border-radius:10px;padding:8px}.info-box b{display:block;font-size:14px;color:#fff}.qr-row{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.qr-mini{width:72px;height:72px;background:#fff;border-radius:7px;padding:4px;box-sizing:border-box}.qr-mini img,.qr-mini canvas{width:64px!important;height:64px!important}.qr-text{font-size:11px;color:var(--muted);word-break:break-all}.empty{padding:70px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.panel{position:fixed;right:18px;top:18px;bottom:18px;width:min(410px,calc(100% - 36px));z-index:50;overflow:auto;background:#111827;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.panel .btn{width:100%}.qr-big{display:flex;justify-content:center;margin:15px 0}.qr-big>div{background:#fff;padding:10px;border-radius:10px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(420px,100%);background:#111827;border:1px solid var(--line);border-radius:20px;padding:20px}.modal h3{margin-top:0}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions .btn{flex:1}.hidden{display:none!important}@media(max-width:700px){.hall-wrap{padding:10px}.top{display:block}.toolbar{margin-top:12px}.hall{width:1200px;height:680px}.table-cards{grid-template-columns:1fr}.panel{right:10px;top:10px;bottom:10px;width:calc(100% - 20px)}}
</style>
</head>
<body>
<div class="hall-wrap">
  <div class="top">
    <div><div class="title" id="venueTitle">План зала</div><div class="sub">Перетаскивайте столы на плане. Нажмите на стол для управления.</div></div>
    <div class="toolbar"><button class="btn btn-primary" id="add">＋ Добавить стол</button><button class="btn" id="refresh">↻ Обновить</button><button class="btn" id="zoomOut">−</button><span id="zoomLabel" class="sub">100%</span><button class="btn" id="zoomIn">＋</button></div>
  </div>
  <div id="error" class="error" hidden></div>
  <div class="hall-shell"><div id="hall" class="hall"><div class="hall-label">ПЛАН ЗАЛА</div></div></div>
  <div class="legend"><span><i style="background:#22c55e"></i>Свободен</span><span><i style="background:#f59e0b"></i>Резерв</span><span><i style="background:#ef4444"></i>Занят</span><span><i style="background:#64748b"></i>Недоступен</span></div>
  <div class="cards-title"><h3>Столы и QR-коды</h3><span>Нажмите карточку для управления</span></div>
  <div id="cards" class="table-cards"></div>
</div>
<div id="panel" class="panel hidden"></div>
<div id="addModal" class="modal-back hidden"><div class="modal"><h3>Новый стол</h3><div class="field"><label>Номер стола</label><input id="newNumber" type="number" min="1"></div><div class="field"><label>Название</label><input id="newName" placeholder="Стол 1"></div><div class="field"><label>Форма</label><select id="newShape"><option value="round">Круг</option><option value="square">Квадрат</option><option value="rectangle">Прямоугольник</option></select></div><div class="field"><label>Количество мест</label><input id="newSeats" type="number" min="1" value="4"></div><div id="addError" class="error" hidden></div><div class="modal-actions"><button class="btn" id="cancelAdd">Отмена</button><button class="btn btn-primary" id="confirmAdd">Создать стол</button></div></div></div>
<script>
const db=window.db;
let tables=[],selected=null,zoom=1;
const $=id=>document.getElementById(id);
function getVenueId(){try{const q=new URLSearchParams(location.search).get('venue');if(q)return q}catch(e){}return localStorage.getItem('manager_venue_id')||localStorage.getItem('selectedVenueId')||''}
let venueId=getVenueId();
function showError(msg){$('error').textContent=msg;$('error').hidden=!msg}
function showAddError(msg){$('addError').textContent=msg;$('addError').hidden=!msg}
function friendlyError(msg){const s=String(msg||'');if(s.includes('not_allowed')||s.includes('not_authorized'))return'У аккаунта нет прав управления этим заведением. Закройте вкладку «Зал» и снова откройте её из выбранного заведения.';if(s.includes('table_number_exists'))return'Стол с таким номером уже существует.';if(s.includes('duplicate')&&s.includes('table'))return'Стол с таким номером уже существует.';return s||'Не удалось выполнить операцию.'}
function statusName(s){return s==='occupied'?'Занят':s==='reserved'?'Резерв':s==='blocked'||s==='maintenance'?'Недоступен':'Свободен'}
function normalize(t){return{...t,shape:t.shape==='rectangle'?'rectangle':t.shape==='round'?'round':'square',status:t.occupancy_status||t.status||'free',seats:Number(t.seats||4),x:Number(t.pos_x??t.x??0),y:Number(t.pos_y??t.y??0)}}
async function load(){showError('');venueId=getVenueId();if(!venueId){$('venueTitle').textContent='Заведение не выбрано';$('hall').innerHTML='<div class="empty">Откройте «Зал» из кабинета управляющего.</div>';$('cards').innerHTML='';return}localStorage.setItem('manager_venue_id',venueId);const r=await db.rpc('manager_table_board',{p_venue_id:venueId});if(r.error){showError(friendlyError(r.error.message));return}tables=(r.data?.tables||r.data||[]).map(normalize);$('venueTitle').textContent='План зала';render()}
function render(){renderHall();renderCards()}
function renderHall(){const h=$('hall');h.querySelectorAll('.table-node').forEach(x=>x.remove());tables.forEach(t=>{const n=document.createElement('div');n.className=`table-node ${t.shape} ${t.status}`;n.style.left=t.x+'px';n.style.top=t.y+'px';n.innerHTML=`<div class="table-num">№${t.table_number}</div><div class="table-name">${esc(t.name||'')}</div><div class="table-meta">${t.guest_count||t.session_guest_count||0}/${t.seats} мест</div>`;n.addEventListener('click',()=>openPanel(t));n.addEventListener('pointerdown',e=>dragStart(e,n,t));h.appendChild(n)})}
function renderCards(){const c=$('cards');if(!tables.length){c.innerHTML='<div class="empty">Пока нет столов. Нажмите «＋ Добавить стол».</div>';return}c.innerHTML='';tables.forEach(t=>{const card=document.createElement('div');card.className='table-card';const qrId='qr-'+t.id;card.innerHTML=`<div class="card-head"><div class="card-number">Стол №${t.table_number}</div><span class="status ${t.status}">${statusName(t.status)}</span></div><div class="card-name">${esc(t.name||'Без названия')}</div><div class="card-info"><div class="info-box"><span>Места</span><b>${t.seats}</b></div><div class="info-box"><span>Гостей</span><b>${t.guest_count||t.session_guest_count||0}</b></div><div class="info-box"><span>Заказов</span><b>${t.order_count||0}</b></div><div class="info-box"><span>Сумма</span><b>${Number(t.total_amount||0).toLocaleString('ru-RU')} ₽</b></div></div><div class="qr-row"><div id="${qrId}" class="qr-mini"></div><div class="qr-text">QR стола<br>${t.qr_token?'Закреплён':'Не создан'}<br><small>Нажмите для управления</small></div></div>`;card.onclick=()=>openPanel(t);c.appendChild(card);if(t.qr_token)new QRCode($(qrId),{text:location.origin+'/menu-v2.html?table='+encodeURIComponent(t.qr_token),width:64,height:64,colorDark:'#111827',colorLight:'#fff'})})}
function dragStart(e,n,t){if(e.button!==undefined&&e.button!==0)return;const sx=e.clientX,sy=e.clientY,ox=t.x,oy=t.y;let moved=false;n.setPointerCapture(e.pointerId);n.classList.add('dragging');const move=ev=>{const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;n.style.left=Math.max(0,Math.round((ox+dx)/16)*16)+'px';n.style.top=Math.max(0,Math.round((oy+dy)/16)*16)+'px'};const up=async()=>{n.classList.remove('dragging');n.removeEventListener('pointermove',move);n.removeEventListener('pointerup',up);if(!moved){openPanel(t);return}const x=parseInt(n.style.left),y=parseInt(n.style.top);const r=await db.rpc('manager_move_table',{p_venue_id:venueId,p_table_id:t.id,p_x:x,p_y:y});if(r.error){showError(friendlyError(r.error.message));render();return}t.x=x;t.y=y;renderCards()};n.addEventListener('pointermove',move);n.addEventListener('pointerup',up)}
function openPanel(t){selected=t;const p=$('panel');p.classList.remove('hidden');p.innerHTML=`<button class="btn" style="float:right;width:auto" onclick="closePanel()">✕</button><h3>Стол №${t.table_number}</h3><div class="sub">${statusName(t.status)} · ${t.guest_count||t.session_guest_count||0} гостей · ${Number(t.total_amount||0).toLocaleString('ru-RU')} ₽</div><div class="field"><label>Номер</label><input id="tn" type="number" min="1" value="${t.table_number}"></div><div class="field"><label>Название</label><input id="tname" value="${esc(t.name||'')}"></div><div class="field"><label>Форма</label><select id="shape"><option value="round">Круг</option><option value="square">Квадрат</option><option value="rectangle">Прямоугольник</option></select></div><div class="field"><label>Мест</label><input id="seats" type="number" min="1" value="${t.seats}"></div><button class="btn btn-primary" id="saveBtn">Сохранить изменения</button><div class="actions"><button class="btn" onclick="tableAction('reserved')">Резерв</button><button class="btn" onclick="tableAction('occupied')">Посадить</button><button class="btn" onclick="tableAction('free')">Освободить</button><button class="btn" onclick="showQR()">Открыть QR</button><button class="btn btn-danger" onclick="deleteTable()">Удалить</button></div><div id="qrBig" class="qr-big"></div>`;$('shape').value=t.shape;$('saveBtn').onclick=saveTable}
function closePanel(){$('panel').classList.add('hidden');selected=null}
async function saveTable(){if(!selected)return;const r=await db.rpc('manager_update_table',{p_venue_id:venueId,p_table_id:selected.id,p_number:+$('tn').value,p_name:$('tname').value,p_shape:$('shape').value,p_seats:+$('seats').value,p_active:true});if(r.error)return showError(friendlyError(r.error.message));closePanel();await load()}
async function tableAction(status){if(!selected)return;const r=await db.rpc('manager_set_table_status',{p_venue_id:venueId,p_table_id:selected.id,p_status:status,p_reserved_until:status==='reserved'?new Date(Date.now()+7200000).toISOString():null,p_note:null});if(r.error)return showError(friendlyError(r.error.message));closePanel();await load()}
async function deleteTable(){if(!selected||!confirm('Удалить стол?'))return;const r=await db.rpc('manager_delete_table',{p_venue_id:venueId,p_table_id:selected.id});if(r.error)return showError(friendlyError(r.error.message));closePanel();await load()}
function showQR(){if(!selected||!selected.qr_token)return showError('Для этого стола QR-код ещё не создан.');const box=$('qrBig');box.innerHTML='';new QRCode(box,{text:location.origin+'/menu-v2.html?table='+encodeURIComponent(selected.qr_token),width:210,height:210,colorDark:'#111827',colorLight:'#fff'})}
function openAdd(){showAddError('');const max=Math.max(0,...tables.map(x=>Number(x.table_number)||0))+1;$('newNumber').value=max;$('newName').value='Стол '+max;$('newShape').value='round';$('newSeats').value=4;$('addModal').classList.remove('hidden');setTimeout(()=>$('newNumber').focus(),50)}
function closeAdd(){$('addModal').classList.add('hidden')}
async function confirmAdd(){showAddError('');const number=Number($('newNumber').value),name=$('newName').value.trim()||('Стол '+number),shape=$('newShape').value,seats=Number($('newSeats').value)||4;if(!venueId)return showAddError('Заведение не выбрано. Откройте вкладку «Зал» из кабинета управляющего.');if(!number||number<1)return showAddError('Укажите номер стола.');if(tables.some(t=>Number(t.table_number)===number))return showAddError('Стол с таким номером уже есть.');const x=120+(tables.length%6)*180,y=120+Math.floor(tables.length/6)*150;const r=await db.rpc('manager_create_table',{p_venue_id:venueId,p_number:number,p_name:name,p_shape:shape,p_seats:seats,p_x:x,p_y:y});if(r.error)return showAddError(friendlyError(r.error.message));closeAdd();await load()}
function setZoom(v){zoom=Math.max(.7,Math.min(1.35,v));$('hall').style.transformOrigin='top left';$('hall').style.transform=`scale(${zoom})`;$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m))}
$('add').addEventListener('click',openAdd);$('confirmAdd').addEventListener('click',confirmAdd);$('cancelAdd').addEventListener('click',closeAdd);$('addModal').addEventListener('click',e=>{if(e.target===$('addModal'))closeAdd()});$('refresh').addEventListener('click',load);$('zoomIn').addEventListener('click',()=>setZoom(zoom+.1));$('zoomOut').addEventListener('click',()=>setZoom(zoom-.1));load();
</script>
</body>
</html>
