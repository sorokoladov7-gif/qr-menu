<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рецептуры — QR Menu</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0b1020;color:#eef2ff;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.card{padding:18px;border-radius:16px}.list button{width:100%;text-align:left;margin:4px 0}.recipe-row{display:grid;grid-template-columns:1fr 120px 90px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}.muted{color:#94a3b8}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:10px;border-radius:10px;margin:10px 0}.ok{background:#064e3b}.err{background:#7f1d1d}.cost-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.cost-card{padding:12px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff06}.cost-card .n{font-size:20px;font-weight:800}.cost-card .l{font-size:11px;color:#94a3b8;margin-top:3px}@media(max-width:800px){.grid{grid-template-columns:1fr}.recipe-row{grid-template-columns:1fr 100px 80px 1fr auto}.cost-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body><div class="wrap">
<div class="toolbar"><h2 style="margin-right:auto">🧾 Рецептуры</h2><a class="btn btn-ghost" href="manager.html">← В кабинет</a></div>
<p class="muted">Товар → ингредиенты → точное количество и единица измерения. Соусы и дополнения клиента остаются отдельными позициями заказа.</p>
<div id="msg"></div>
<div class="grid">
<div class="glass card"><h3>Блюда</h3><div id="products" class="list"></div></div>
<div class="glass card"><div class="toolbar"><h3 id="title" style="margin-right:auto">Выберите товар</h3><button id="save" class="btn btn-primary" hidden>Сохранить рецептуру</button></div><div id="cost"></div><div id="recipe"></div>
<hr style="border-color:#ffffff12;margin:22px 0"><h3>Ингредиенты заведения</h3><div class="toolbar"><input id="iname" placeholder="Название"><select id="iunit"><option value="g">г</option><option value="kg">кг</option><option value="ml">мл</option><option value="l">л</option><option value="pcs">шт</option></select><input id="iqty" type="number" min="0.001" step="0.001" value="1" placeholder="Закуп. кол-во"><input id="iprice" type="number" min="0" step="0.01" value="0" placeholder="Цена закупки"><button id="addIng" class="btn btn-green">Добавить</button></div><div id="ingredients" style="margin-top:12px"></div></div>
</div></div>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
(function(){
'use strict';
var db=window.db, venueId=localStorage.getItem('manager_venue_id')||localStorage.getItem('selectedVenueId');
var products=[], ingredients=[], selected=null, rows=[];
var $=function(id){return document.getElementById(id)};
function msg(t,e){$('msg').innerHTML=t?'<div class="msg '+(e?'err':'ok')+'">'+t+'</div>':'';}
function rpc(name,args){return db.rpc(name,args).then(function(r){if(r.error)throw r.error;return r.data;});}
function esc(s){return String(s==null?'':s).replace(/[&<>\\\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\\\\':'&#39;'}[c]});}
function load(){if(!venueId){msg('Не найдено выбранное заведение. Откройте manager.html, выберите заведение и затем снова откройте эту страницу.',true);return;}
 Promise.all([db.from('products').select('id,name,category,price').eq('venue_id',venueId).order('name'),rpc('manager_ingredient_list',{p_venue_id:venueId})]).then(function(rs){if(rs[0].error)throw rs[0].error;products=rs[0].data||[];ingredients=Array.isArray(rs[1])?rs[1]:[];renderProducts();renderIngredients();}).catch(function(e){msg('Ошибка загрузки: '+e.message,true);});}
function renderProducts(){$('products').innerHTML=products.map(function(p){return '<button class="btn '+(selected===p.id?'btn-primary':'btn-ghost')+'" onclick="window.pickRecipe(\\\''+p.id+'\\\')">'+esc(p.name)+' <span class="muted">'+esc(p.category)+' · '+p.price+' ₽</span></button>';}).join('')||'<p class="muted">Нет товаров.</p>';}
window.pickRecipe=function(id){selected=id;var p=products.find(function(x){return x.id===id});$('title').textContent='Рецептура: '+p.name;$('save').hidden=false;rpc('manager_recipe_list',{p_venue_id:venueId,p_product_id:id}).then(function(data){rows=(Array.isArray(data)?data:[]).map(function(r){return {ingredient_id:r.ingredient_id,quantity:Number(r.quantity),note:r.note||''};});renderRecipe();renderProducts();return loadCost();}).catch(function(e){msg('Ошибка загрузки рецептуры: '+e.message,true);});};
function loadCost(){if(!selected){$('cost').innerHTML='';return Promise.resolve();}return rpc('manager_recipe_cost',{p_venue_id:venueId,p_product_id:selected}).then(function(c){$('cost').innerHTML='<div class="cost-grid"><div class="cost-card"><div class="n">'+Number(c.cost||0).toFixed(2)+' ₽</div><div class="l">Себестоимость</div></div><div class="cost-card"><div class="n">'+Number(c.price||0).toFixed(2)+' ₽</div><div class="l">Цена продажи</div></div><div class="cost-card"><div class="n">'+Number(c.gross_profit||0).toFixed(2)+' ₽</div><div class="l">Валовая прибыль</div></div><div class="cost-card"><div class="n">'+Number(c.margin_percent||0).toFixed(1)+'%</div><div class="l">Маржа</div></div></div>';}).catch(function(e){$('cost').innerHTML='<div class="msg err">Ошибка расчёта себестоимости: '+esc(e.message)+'</div>';});}
function renderRecipe(){if(!selected){$('recipe').innerHTML='<p class="muted">Выберите товар.</p>';return;} $('recipe').innerHTML=rows.map(function(r,i){var ing=ingredients.find(function(x){return x.id===r.ingredient_id});return '<div class="recipe-row"><select onchange="window.recipeIng('+i+',this.value)">'+ingredients.map(function(x){return '<option value="'+x.id+'" '+(x.id===r.ingredient_id?'selected':'')+'>'+esc(x.name)+' ('+esc(x.unit)+')</option>';}).join('')+'</select><input type="number" min="0.001" step="0.001" value="'+r.quantity+'" onchange="window.recipeQty('+i+',this.value)"><span class="muted">'+esc(ing?ing.unit:'')+'</span><input placeholder="Примечание" value="'+esc(r.note)+'" onchange="window.recipeNote('+i+',this.value)"><button class="btn btn-danger" onclick="window.delRow('+i+')">×</button></div>';}).join('')+'<button class="btn btn-ghost" onclick="window.addRow()">+ Ингредиент</button>';}
window.addRow=function(){if(!ingredients.length){msg('Сначала добавьте ингредиент.',true);return;}rows.push({ingredient_id:ingredients[0].id,quantity:1,note:''});renderRecipe();};window.delRow=function(i){rows.splice(i,1);renderRecipe();};window.recipeIng=function(i,v){rows[i].ingredient_id=v;renderRecipe();};window.recipeQty=function(i,v){rows[i].quantity=Number(v)||0;};window.recipeNote=function(i,v){rows[i].note=v;};
$('save').onclick=function(){if(!selected)return;for(var i=0;i<rows.length;i++)if(!(rows[i].quantity>0)){msg('Количество ингредиента должно быть больше нуля.',true);return;}rpc('manager_product_recipe_save',{p_venue_id:venueId,p_product_id:selected,p_rows:rows}).then(function(){msg('Рецептура сохранена.');renderRecipe();return loadCost();}).catch(function(e){msg('Ошибка сохранения: '+e.message,true);});};
$('addIng').onclick=function(){var n=$('iname').value.trim();if(!n){msg('Введите название ингредиента.',true);return;}rpc('manager_ingredient_upsert',{p_venue_id:venueId,p_name:n,p_unit:$('iunit').value,p_purchase_quantity:Number($('iqty').value)||1,p_purchase_price:Number($('iprice').value)||0,p_id:null}).then(function(){msg('Ингредиент добавлен.');$('iname').value='';return rpc('manager_ingredient_list',{p_venue_id:venueId});}).then(function(data){ingredients=Array.isArray(data)?data:[];renderIngredients();renderRecipe();if(selected)loadCost();}).catch(function(e){msg('Ошибка: '+e.message,true);});};
window.deleteIngredient=function(id,name){if(!confirm('Удалить ингредиент «'+name+'»?'))return;rpc('manager_ingredient_delete',{p_venue_id:venueId,p_ingredient_id:id}).then(function(){msg('Ингредиент удалён.');return rpc('manager_ingredient_list',{p_venue_id:venueId});}).then(function(data){ingredients=Array.isArray(data)?data:[];rows=rows.filter(function(r){return ingredients.some(function(i){return i.id===r.ingredient_id;});});renderIngredients();renderRecipe();if(selected)loadCost();}).catch(function(e){var m=e&&e.message?e.message:'';msg(m==='ingredient_in_use'?'Ингредиент используется в рецептуре. Сначала удалите его из рецептур блюд.':m==='ingredient_not_found'?'Ингредиент не найден.':('Ошибка удаления: '+m),true);});};
function renderIngredients(){$('ingredients').innerHTML=ingredients.map(function(i){return '<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff12"><div style="flex:1"><b>'+esc(i.name)+'</b> <span class="muted">'+esc(i.unit)+' · закупка '+i.purchase_price+' ₽ / '+i.purchase_quantity+' '+esc(i.unit)+'</span></div><button class="btn btn-danger" onclick="window.deleteIngredient(\\\''+i.id+'\\\',\\\''+esc(i.name).replace(/\\\'/g,'&#39;')+'\\\')">Удалить</button></div>';}).join('')||'<span class="muted">Пока нет ингредиентов.</span>';}
load();
})();
</script></body></html>
