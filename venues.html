<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заведения — QR-Menu</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>.wrap{max-width:1000px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.cardx{display:block;text-decoration:none;color:inherit;padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.04);transition:.15s}.cardx:hover{transform:translateY(-2px);border-color:#6366f1}.logo{width:52px;height:52px;border-radius:15px;object-fit:cover;margin-bottom:10px}.muted{opacity:.7;font-size:13px}</style></head><body><div class="wrap"><h1>Выберите заведение</h1><p class="muted">Откройте меню, закажите в зале или оформите доставку.</p><div id="grid" class="grid"></div><p id="msg" class="muted"></p></div><script>async function load(){const r=await db.rpc('public_venues_list');if(r.error){document.getElementById('msg').textContent=r.error.message;return}const g=document.getElementById('grid');g.innerHTML=(r.data||[]).map(v=>`<a class="cardx" href="menu-v2.html?venue=${encodeURIComponent(v.slug)}"><div class="logo" style="background:${v.brand_color||'#6366f1'};display:flex;align-items:center;justify-content:center;font-size:26px">🍽️</div><h3>${escapeHtml(v.name)}</h3><div class="muted">${escapeHtml(v.description||'Меню и заказ онлайн')}</div></a>`).join('')||'<p>Нет активных заведений.</p>'}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load()</script></body></html>
