<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Управляющий</title>
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest-manager.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-manager-192.png">
<style>html,body{margin:0;width:100%;height:100%;background:#0b1020;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe src="/manager.html" title="Кабинет управляющего"></iframe>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', {scope:'/'}).catch(function (e) {
      console.warn('Manager PWA:', e);
    });
  });
}
</script>
</body>
</html>
