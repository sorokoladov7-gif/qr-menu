<body>
<div id="app" v-cloak>
  <!-- existing kitchen UI remains in the repository template -->
</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
/* Kitchen status actions use the staff RPC directly. This avoids the read-only
   db.from('orders') compatibility wrapper used for staff order loading. */
window.kitchenStaffUpdate = function(token, orderId, status) {
  if (!window.db || typeof window.db.rpc !== 'function') {
    return Promise.reject(new Error('Supabase client unavailable'));
  }
  return window.db.rpc('staff_update_order', {
    p_token: token,
    p_order_id: orderId,
    p_status: status
  });
};
</script>
