<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR-Menu</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>body{margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,var(--brand,#6366f1),#8b5cf6);color:#fff;margin-bottom:14px}.cats{display:flex;gap:7px;flex-wrap:wrap}.cats button{padding:8px 12px;border-radius:999px;border:1px solid #ffffff22;background:#ffffff08;color:#fff}.cats .on{background:#fff;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.dish{padding:12px;border-radius:18px}.dish img{width:100%;height:130px;object-fit:cover;border-radius:14px}.price{font-weight:800;margin:8px 0}.cart{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(600px,calc(100% - 30px));z-index:10}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:30}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#111827;border-radius:24px 24px 0 0;padding:20px}.field{margin:9px 0}.field label{display:block;font-size:12px;opacity:.7;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;background:#0b1220;color:#fff;border:1px solid #ffffff18}.item{padding:9px 0;border-bottom:1px solid #ffffff0d}.muted{opacity:.7;font-size:12px}</style></head><body><div class="wrap"><div id="app"><div v-if="!ready" class="muted">Загрузка…</div><template v-else><div class="hero" :style="{'--brand':venue?.brand_color||'#6366f1'}"><h2 style="margin:0">{{venue?.name||'QR-Menu'}}</h2><div>{{table?'Стол №'+table.table_number:'Онлайн-заказ'}}</div></div><div v-if="error" class="glass card">{{error}}</div><div v-else><div class="cats"><button :class="{on:cat==='all'}" @click="cat='all'">Все</button><button v-for="c in cats" :key="c" :class="{on:cat===c}" @click="cat=c">{{c}}</button></div><div class="grid" style="margin-top:12px"><div v-for="p in filtered" :key="p.id" class="glass dish"><img :src="p.image_url||'https://placehold.co/600x400?text=Menu'" alt=""><b>{{p.name}}</b><div class="muted">{{p.description}}</div><div class="price">{{money(p.price)}} ₽</div><button class="btn btn-primary" style="width:100%" @click="add(p)">＋ Добавить</button></div></div><p v-if="!filtered.length" class="muted">Меню пусто.</p></div></template></div></div><div v-if="cart.length" class="cart"><button class="btn btn-primary" style="width:100%" @click="checkout=true">🛒 {{cartCount}} · {{money(cartTotal)}} ₽</button></div><div v-if="checkout" class="modal" @click.self="checkout=false"><div class="box"><button class="btn btn-ghost" style="float:right" @click="checkout=false">✕</button><h3>Оформление</h3><div v-for="i in cart" :key="i.id" class="item"><div class="row"><span style="flex:1">{{i.name}}</span><button class="btn btn-ghost btn-sm" @click="dec(i)">−</button><b>{{i.qty}}</b><button class="btn btn-ghost btn-sm" @click="i.qty++">+</button></div></div><div class="field"><label>Имя</label><input v-model="form.name"></div><div class="field"><label>Телефон</label><input v-model="form.phone" type="tel"></div><div class="field"><label>Получение</label><select v-model="form.type"><option value="table" v-if="table">За столом</option><option value="pickup">Самовывоз</option><option value="delivery">Доставка</option></select></div><div v-if="form.type==='delivery'" class="field"><label>Адрес доставки</label><textarea v-model="form.address" rows="3"></textarea><button class="btn btn-ghost btn-sm" @click="locate">Определить координаты</button><div class="muted">{{coords.lat?'Координаты получены':'Для доставки нужны координаты устройства'}}</div></div><div class="field"><label>Комментарий</label><textarea v-model="form.comment" rows="2"></textarea></div><div class="spread" style="margin:12px 0"><b>Итого</b><b>{{money(cartTotal)}} ₽</b></div><button class="btn btn-primary" style="width:100%" :disabled="busy" @click="submit">{{busy?'Отправка…':'Оформить заказ'}}</button><p class="muted">Стоимость доставки рассчитывается сервером по тарифу заведения.</p></div></div><div v-if="done" class="modal"><div class="box" style="text-align:center"><h2>Заказ принят</h2><p>№{{done.order_number}}</p><p>Сумма: {{money(done.total_price)}} ₽</p><button class="btn btn-primary" @click="location.reload()">Вернуться в меню</button></div></div><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script>const {createApp}=Vue;createApp({data(){return{ready:false,error:'',venue:null,table:null,products:[],cat:'all',cart:[],checkout:false,busy:false,done:null,coords:{lat:null,lng:null},form:{name:'',phone:'',type:'table',address:'',comment:''}}},computed:{cats(){return [...new Set(this.products.map(p=>p.category).filter(Boolean))]},filtered(){return this.cat==='all'?this.products:this.products.filter(p=>p.category===this.cat)},cartCount(){return this.cart.reduce((n,i)=>n+i.qty,0)},cartTotal(){return this.cart.reduce((n,i)=>n+i.price*i.qty,0)}},methods:{money(n){return Number(n||0).toLocaleString('ru-RU')},add(p){const x=this.cart.find(i=>i.id===p.id);if(x)x.qty++;else this.cart.push({id:p.id,name:p.name,price:p.price,qty:1})},dec(i){if(i.qty>1)i.qty--;else this.cart=this.cart.filter(x=>x!==i)},locate(){if(!navigator.geolocation)return alert('Геолокация недоступна');navigator.geolocation.getCurrentPosition(p=>{this.coords.lat=p.coords.latitude;this.coords.lng=p.coords.longitude},e=>alert('Не удалось получить координаты: '+e.message),{enableHighAccuracy:true,timeout:10000})},async submit(){if(!this.form.phone.trim())return alert('Введите телефон');if(!this.cart.length)return;if(this.form.type==='delivery'&&(!this.coords.lat||!this.coords.lng))return alert('Определите координаты для доставки');this.busy=true;const items=this.cart.map(i=>({product_id:i.id,qty:i.qty}));const r=await db.rpc('create_public_order_v2',{p_venue_id:this.venue.id,p_order_type:this.form.type,p_customer_name:this.form.name,p_customer_phone:this.form.phone,p_delivery_address:this.form.address,p_comment:this.form.comment,p_payment_method:'cash',p_items:items,p_addons:[],p_table_token:this.table?.qr_token||null,p_delivery_lat:this.coords.lat,p_delivery_lng:this.coords.lng,p_operation_key:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())});this.busy=false;if(r.error){alert(r.error.message);return}this.done=r.data},async init(){const q=new URLSearchParams(location.search);const slug=q.get('venue');const token=q.get('table');if(token){const r=await db.rpc('public_table_by_qr',{p_token:token});if(r.error||!r.data?.length){this.error='Стол не найден';this.ready=true;return}this.table=r.data[0];const v=await db.rpc('public_venue_by_id',{p_venue_id:this.table.venue_id});this.venue=v.data?.[0]||v.data;if(!this.venue)this.error='Заведение не найдено'}else if(slug){const r=await db.rpc('public_venue_by_slug',{p_slug:slug});this.venue=r.data?.[0]||r.data;if(!this.venue)this.error='Заведение не найдено';this.form.type='pickup'}else{location.href='venues.html';return}if(this.venue){const r=await db.from('products').select('id,name,description,price,category,image_url,is_available').eq('venue_id',this.venue.id).eq('is_available',true).neq('category','addon').order('category');if(r.error)this.error=r.error.message;else this.products=r.data||[]}this.ready=true}}}).mount('#app')</script></body></html>
