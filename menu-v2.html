<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS QR-Меню — Демо сотрудника</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a14;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#fff}

iframe{width:100%;height:100%;border:0;display:block;opacity:0;
  transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
iframe.visible{opacity:1;transform:scale(1)}

/* ═══════════════════════════════
   WOW LOADING OVERLAY
   ═══════════════════════════════ */
.loading-overlay{position:fixed;inset:0;z-index:99999;background:#060a14;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.loading-overlay.out{opacity:0;transform:scale(1.08);pointer-events:none}

/* ── Starfield ── */
#starfield{position:absolute;inset:0;z-index:0}

/* ── Ambient Orbs ── */
.lb-orbs{position:absolute;inset:0;pointer-events:none;z-index:1}
.lb-orb{position:absolute;border-radius:50%;filter:blur(100px)}
.lb-orb.a{width:450px;height:450px;background:rgba(99,102,241,.12);top:-12%;left:-12%;animation:lbOrbA 14s ease-in-out infinite}
.lb-orb.b{width:350px;height:350px;background:rgba(236,72,153,.08);bottom:-10%;right:-10%;animation:lbOrbB 18s ease-in-out infinite 2s}
.lb-orb.c{width:280px;height:280px;background:rgba(16,185,129,.06);top:45%;left:55%;animation:lbOrbC 20s ease-in-out infinite 5s}
.lb-orb.d{width:200px;height:200px;background:rgba(245,158,11,.06);top:20%;right:10%;animation:lbOrbD 16s ease-in-out infinite 3s}
@keyframes lbOrbA{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(80px,60px) scale(1.1)}66%{transform:translate(-30px,40px) scale(.95)}}
@keyframes lbOrbB{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
@keyframes lbOrbC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,70px) scale(1.15)}}
@keyframes lbOrbD{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-60px)}}

/* ── Grid ── */
.lb-grid{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:60px 60px;animation:lbGrid 40s linear infinite}
@keyframes lbGrid{0%{transform:translate(0,0)}100%{transform:translate(60px,60px)}}

/* ── Scan Line ── */
.lb-scan{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.lb-scan-line{position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,.35),rgba(6,182,212,.35),transparent);
  box-shadow:0 0 20px rgba(99,102,241,.2);
  animation:lbScan 2.5s ease-in-out infinite}
@keyframes lbScan{0%{top:-2%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:102%;opacity:0}}

/* ── Particles ── */
.lb-particles{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb-particle{position:absolute;border-radius:50%;animation:lbParticle linear infinite}
@keyframes lbParticle{
  0%{transform:translateY(100vh) rotate(0deg) scale(0);opacity:0}
  10%{opacity:.6;transform:translateY(80vh) rotate(72deg) scale(1)}
  90%{opacity:.4;transform:translateY(10vh) rotate(648deg) scale(1)}
  100%{transform:translateY(-10vh) rotate(720deg) scale(0);opacity:0}
}

/* ── Floating Rings ── */
.lb-rings{position:absolute;inset:0;pointer-events:none;z-index:2}
.lb-floating-ring{position:absolute;border-radius:50%;border:1px solid rgba(99,102,241,.08);
  animation:lbFloatRing linear infinite}
@keyframes lbFloatRing{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:.3}90%{opacity:.3}100%{transform:translateY(-100vh) rotate(360deg);opacity:0}}

/* ── Noise ── */
.loading-overlay::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.02;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}

/* ── Footer Glow ── */
.lb-footer-glow{position:absolute;bottom:0;left:0;right:0;height:1px;z-index:5;
  background:linear-gradient(90deg,transparent,#6366f1,#ec4899,#10b981,#f59e0b,transparent);
  opacity:.3;animation:lbFooterGlow 4s ease-in-out infinite}
@keyframes lbFooterGlow{0%,100%{opacity:.15;transform:scaleX(.6)}50%{opacity:.5;transform:scaleX(1)}}

/* ── Corner Accents ── */
.lb-corner{position:absolute;width:40px;height:40px;z-index:6;opacity:0;animation:lbCorner .5s ease-out .9s forwards}
.lb-corner::before,.lb-corner::after{content:'';position:absolute;border-radius:1px}
@keyframes lbCorner{to{opacity:1}}
.lb-corner.tl{top:24px;left:24px}.lb-corner.tl::before{top:0;left:0;width:24px;height:2px;background:rgba(99,102,241,.4)}.lb-corner.tl::after{top:0;left:0;width:2px;height:24px;background:rgba(99,102,241,.4)}
.lb-corner.tr{top:24px;right:24px}.lb-corner.tr::before{top:0;right:0;width:24px;height:2px;background:rgba(236,72,153,.4)}.lb-corner.tr::after{top:0;right:0;width:2px;height:24px;background:rgba(236,72,153,.4)}
.lb-corner.bl{bottom:24px;left:24px}.lb-corner.bl::before{bottom:0;left:0;width:24px;height:2px;background:rgba(16,185,129,.4)}.lb-corner.bl::after{bottom:0;left:0;width:2px;height:24px;background:rgba(16,185,129,.4)}
.lb-corner.br{bottom:24px;right:24px}.lb-corner.br::before{bottom:0;right:0;width:24px;height:2px;background:rgba(245,158,11,.4)}.lb-corner.br::after{bottom:0;right:0;width:2px;height:24px;background:rgba(245,158,11,.4)}

/* ── Content ── */
.lb-content{position:relative;z-index:10;text-align:center;padding:0 24px}

/* ── Logo ── */
.lb-logo{position:relative;width:110px;height:110px;margin:0 auto 28px}
.lb-logo-ring{position:absolute;inset:0;border:2px solid transparent;border-top-color:#6366f1;
  border-right-color:#ec4899;border-radius:50%;animation:lbRingSpin 1.5s linear infinite}
.lb-logo-ring.r2{inset:10px;border-top-color:#10b981;border-right-color:#8b5cf6;
  animation-duration:2.2s;animation-direction:reverse}
.lb-logo-ring.r3{inset:20px;border-top-color:#f59e0b;border-right-color:#06b6d4;
  animation-duration:2.8s}
@keyframes lbRingSpin{to{transform:rotate(360deg)}}
.lb-logo-core{position:absolute;inset:28px;border-radius:50%;
  display:grid;place-items:center;font-size:32px;font-weight:800;
  box-shadow:0 0 50px rgba(99,102,241,.3),inset 0 0 30px rgba(255,255,255,.05);
  animation:lbCorePulse 2.5s ease-in-out infinite;overflow:hidden;position:absolute}
.lb-logo-core .core-bg{position:absolute;inset:0;border-radius:50%;
  animation:lbCoreBg 8s linear infinite}
@keyframes lbCoreBg{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.lb-logo-core span{position:relative;z-index:2}
@keyframes lbCorePulse{0%,100%{box-shadow:0 0 50px rgba(99,102,241,.3)}50%{box-shadow:0 0 80px rgba(99,102,241,.5),0 0 120px rgba(236,72,153,.2)}}

/* ── Role Icon ── */
.lb-role-icon{font-size:48px;margin-bottom:16px;
  animation:lbRoleBounce .7s cubic-bezier(.34,1.56,.64,1) .4s both,
            lbRoleFloat 3.5s ease-in-out infinite 1.1s}
@keyframes lbRoleBounce{from{opacity:0;transform:scale(0) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes lbRoleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ── Badge ── */
.lb-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border-radius:999px;
  background:rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.2);
  font-size:11px;font-weight:700;color:#c7d2fe;margin-bottom:18px;
  animation:lbBadgeIn .6s cubic-bezier(.34,1.56,.64,1) .25s both}
@keyframes lbBadgeIn{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.lb-badge .dot{width:7px;height:7px;border-radius:50%;background:#34d399;
  box-shadow:0 0 10px rgba(52,211,153,.6);animation:dotBlink 1.5s ease-in-out infinite}
@keyframes dotBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.8)}}

/* ── Title ── */
.lb-title{font-size:28px;font-weight:800;letter-spacing:-1px;margin-bottom:8px;
  background:linear-gradient(135deg,#fff 0%,#c7d2fe 40%,#67e8f9 70%,#a5b4fc 100%);
  background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:lbTitleIn .7s ease-out .45s both,lbTitleShimmer 6s ease-in-out infinite 1.2s}
@keyframes lbTitleIn{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes lbTitleShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.lb-subtitle{color:#94a3b8;font-size:14px;font-weight:500;
  animation:lbSubIn .5s ease-out .6s both}
@keyframes lbSubIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Progress ── */
.lb-progress{width:220px;height:4px;background:rgba(255,255,255,.05);border-radius:4px;
  margin:24px auto 0;overflow:hidden;position:relative}
.lb-progress-bar{height:100%;width:0%;border-radius:4px;position:relative;
  background:linear-gradient(90deg,#6366f1,#ec4899,#10b981,#f59e0b);
  background-size:300% 100%;
  animation:lbProgress 2.8s ease-in-out forwards,lbProgressShimmer 1.2s linear infinite}
.lb-progress-bar::after{content:'';position:absolute;right:0;top:-2px;bottom:-2px;width:20px;
  background:radial-gradient(circle,rgba(255,255,255,.6),transparent);
  border-radius:50%;filter:blur(2px)}
@keyframes lbProgress{0%{width:0%}20%{width:30%}50%{width:60%}75%{width:82%}90%{width:93%}100%{width:100%}}
@keyframes lbProgressShimmer{0%{background-position:0% 0}100%{background-position:300% 0}}

.lb-progress-label{margin-top:12px;font-size:12px;color:#64748b;font-weight:600;
  min-height:18px;transition:opacity .3s}

/* ── Status Dots ── */
.lb-status{display:flex;gap:8px;justify-content:center;margin-top:16px}
.lb-status-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.08);
  transition:all .5s cubic-bezier(.22,1,.36,1)}
.lb-status-dot.active{background:#6366f1;box-shadow:0 0 16px rgba(99,102,241,.6);transform:scale(1.3)}

/* ── Version Text ── */
.lb-version{position:absolute;bottom:28px;left:0;right:0;text-align:center;z-index:10;
  font-size:11px;color:#334155;font-weight:500;letter-spacing:.5px;
  animation:lbSubIn .5s ease-out 1s both}

/* ── Error State ── */
.lb-error{text-align:center;padding:40px 24px;position:relative;z-index:10;
  animation:lbErrorIn .6s cubic-bezier(.22,1,.36,1)}
@keyframes lbErrorIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.lb-error .error-icon{font-size:56px;margin-bottom:16px;
  animation:lbRoleBounce .7s cubic-bezier(.34,1.56,.64,1) .1s both}
.lb-error h2{color:#f87171;font-size:22px;margin:0 0 8px;
  animation:lbTitleIn .5s ease-out .2s both}
.lb-error p{color:#94a3b8;font-size:14px;line-height:1.6;
  animation:lbSubIn .5s ease-out .3s both}
.lb-error .btn{margin-top:20px;padding:12px 28px;border-radius:14px;border:0;font-weight:700;
  font-size:15px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  box-shadow:0 8px 30px rgba(99,102,241,.3);
  transition:all .3s cubic-bezier(.22,1,.36,1);
  animation:lbSubIn .5s ease-out .4s both;position:relative;overflow:hidden}
.lb-error .btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(99,102,241,.45)}
.lb-error .btn:active{transform:translateY(-1px) scale(.97)}
.lb-error .btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
  animation:btnShine 3s ease-in-out infinite}
@keyframes btnShine{0%{left:-100%}50%,100%{left:100%}}

/* ── Role-specific color accents ── */
.lb-content[data-role="cook"] .lb-logo-core{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.lb-content[data-role="cook"] .lb-logo-ring{border-top-color:#f59e0b;border-right-color:#ef4444}
.lb-content[data-role="cook"] .lb-badge{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2);color:#fcd34d}
.lb-content[data-role="cook"] .lb-status-dot.active{background:#f59e0b;box-shadow:0 0 16px rgba(245,158,11,.6)}

.lb-content[data-role="courier"] .lb-logo-core{background:linear-gradient(135deg,#a78bfa,#6366f1)}
.lb-content[data-role="courier"] .lb-logo-ring{border-top-color:#a78bfa;border-right-color:#6366f1}
.lb-content[data-role="courier"] .lb-badge{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.2);color:#c4b5fd}
.lb-content[data-role="courier"] .lb-status-dot.active{background:#a78bfa;box-shadow:0 0 16px rgba(167,139,250,.6)}

.lb-content[data-role="waiter"] .lb-logo-core{background:linear-gradient(135deg,#06b6d4,#10b981)}
.lb-content[data-role="waiter"] .lb-logo-ring{border-top-color:#06b6d4;border-right-color:#10b981}
.lb-content[data-role="waiter"] .lb-badge{background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.2);color:#67e8f9}
.lb-content[data-role="waiter"] .lb-status-dot.active{background:#06b6d4;box-shadow:0 0 16px rgba(6,182,212,.6)}
</style>
</head>
<body>

<!-- ═══ LOADING OVERLAY ═══ -->
<div class="loading-overlay" id="loadingOverlay">
  <canvas id="starfield"></canvas>
  <div class="lb-orbs">
    <div class="lb-orb a"></div><div class="lb-orb b"></div>
    <div class="lb-orb c"></div><div class="lb-orb d"></div>
  </div>
  <div class="lb-grid"></div>
  <div class="lb-scan"><div class="lb-scan-line"></div></div>
  <div class="lb-particles" id="lbParticles"></div>
  <div class="lb-rings" id="lbRings"></div>
  <div class="lb-footer-glow"></div>

  <div class="lb-corner tl"></div><div class="lb-corner tr"></div>
  <div class="lb-corner bl"></div><div class="lb-corner br"></div>

  <div class="lb-content" id="lbContent">
    <div class="lb-logo">
      <div class="lb-logo-ring"></div>
      <div class="lb-logo-ring r2"></div>
      <div class="lb-logo-ring r3"></div>
      <div class="lb-logo-core">
        <div class="core-bg" style="background:linear-gradient(135deg,#6366f1,#ec4899)"></div>
        <span>QR</span>
      </div>
    </div>

    <div class="lb-badge"><span class="dot"></span><span id="badgeText">Демо-режим</span></div>

    <div class="lb-role-icon" id="roleIcon">👨‍🍳</div>
    <div class="lb-title" id="roleTitle">Загрузка...</div>
    <div class="lb-subtitle" id="roleSubtitle">Подготавливаем рабочее пространство</div>

    <div class="lb-progress"><div class="lb-progress-bar" id="progressBar"></div></div>
    <div class="lb-progress-label" id="progressLabel">Инициализация...</div>

    <div class="lb-status">
      <div class="lb-status-dot" id="sd1"></div>
      <div class="lb-status-dot" id="sd2"></div>
      <div class="lb-status-dot" id="sd3"></div>
      <div class="lb-status-dot" id="sd4"></div>
    </div>
  </div>

  <div class="lb-version">OS QR-Меню · Staff Portal v2.0</div>
</div>

<!-- ═══ IFRAME ═══ -->
<iframe id="demoFrame"></iframe>

<script>
(function(){
  /* ── Parse role ── */
  var p = new URLSearchParams(location.search);
  var role = (p.get('role') || '').toLowerCase();
  var pages = {cook:'cook.html', courier:'courier.html', waiter:'waiter.html'};
  var roleInfo = {
    cook:    {icon:'👨‍🍳', title:'Рабочее место повара',   subtitle:'Заказы, готовка, выдача',       color:'#f59e0b', gradient:'linear-gradient(135deg,#f59e0b,#ef4444)'},
    courier: {icon:'🚗',  title:'Рабочее место курьера',  subtitle:'Доставки, маршруты, навигация',  color:'#a78bfa', gradient:'linear-gradient(135deg,#a78bfa,#6366f1)'},
    waiter:  {icon:'🤵',  title:'Рабочее место официанта',subtitle:'Столы, заказы, обслуживание',   color:'#06b6d4', gradient:'linear-gradient(135deg,#06b6d4,#10b981)'}
  };

  var overlay = document.getElementById('loadingOverlay');

  if(!pages[role]){
    overlay.innerHTML = '<div class="lb-orbs"><div class="lb-orb a"></div><div class="lb-orb b"></div><div class="lb-orb c"></div></div><div class="lb-grid"></div><div class="lb-scan"><div class="lb-scan-line"></div></div><div class="lb-corner tl"></div><div class="lb-corner tr"></div><div class="lb-corner bl"></div><div class="lb-corner br"></div><div class="lb-error"><div class="error-icon">😕</div><h2>Роль не указана</h2><p>Добавьте параметр <code style="background:rgba(99,102,241,.15);padding:2px 8px;border-radius:6px;color:#a5b4fc">?role=cook</code>, <code style="background:rgba(99,102,241,.15);padding:2px 8px;border-radius:6px;color:#a5b4fc">courier</code> или <code style="background:rgba(99,102,241,.15);padding:2px 8px;border-radius:6px;color:#a5b4fc">waiter</code></p><button class="btn" onclick="location.href=\'index.html\'">← На главную</button></div>';
    return;
  }

  /* ── Update UI with role info ── */
  var info = roleInfo[role];
  document.getElementById('roleIcon').textContent = info.icon;
  document.getElementById('roleTitle').textContent = info.title;
  document.getElementById('roleSubtitle').textContent = info.subtitle;
  document.getElementById('badgeText').textContent = role.charAt(0).toUpperCase() + role.slice(1);
  document.getElementById('lbContent').setAttribute('data-role', role);

  var core = document.querySelector('.lb-logo-core .core-bg');
  if(core) core.style.background = info.gradient;

  /* ── Starfield ── */
  var c = document.getElementById('starfield');
  var ctx = c.getContext('2d');
  var stars = [];

  function resize(){c.width = window.innerWidth; c.height = window.innerHeight;}
  resize();
  window.addEventListener('resize', resize);

  for(var i = 0; i < 100; i++){
    stars.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 0.3 + 0.1,
      phase: Math.random() * Math.PI * 2,
      brightness: Math.random() * 0.4 + 0.1
    });
  }

  var animating = true;
  function drawStars(){
    if(!animating) return;
    ctx.clearRect(0, 0, c.width, c.height);
    var t = Date.now() * 0.001;
    for(var i = 0; i < stars.length; i++){
      var s = stars[i];
      var alpha = s.brightness + Math.sin(t * s.speed + s.phase) * 0.3;
      alpha = Math.max(0.05, Math.min(0.7, alpha));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.fill();
      // Glow for brighter stars
      if(s.r > 1){
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(99,102,241,' + (alpha * 0.15) + ')';
        ctx.fill();
      }
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();

  /* ── Particles ── */
  var pc = document.getElementById('lbParticles');
  var particleColors = [
    'rgba(99,102,241,.4)', 'rgba(236,72,153,.35)', 'rgba(16,185,129,.3)',
    'rgba(245,158,11,.35)', 'rgba(6,182,212,.3)', 'rgba(167,139,250,.3)'
  ];
  for(var i = 0; i < 15; i++){
    var el = document.createElement('div');
    el.className = 'lb-particle';
    el.style.left = Math.random() * 100 + '%';
    el.style.animationDuration = (10 + Math.random() * 18) + 's';
    el.style.animationDelay = (Math.random() * 12) + 's';
    var sz = 2 + Math.random() * 3.5;
    el.style.width = el.style.height = sz + 'px';
    el.style.background = particleColors[Math.floor(Math.random() * particleColors.length)];
    el.style.boxShadow = '0 0 ' + (sz * 2) + 'px ' + el.style.background;
    pc.appendChild(el);
  }

  /* ── Floating Rings ── */
  var rc = document.getElementById('lbRings');
  for(var i = 0; i < 5; i++){
    var ring = document.createElement('div');
    ring.className = 'lb-floating-ring';
    var sz = 40 + Math.random() * 80;
    ring.style.width = ring.style.height = sz + 'px';
    ring.style.left = Math.random() * 100 + '%';
    ring.style.top = (80 + Math.random() * 20) + '%';
    ring.style.animationDuration = (15 + Math.random() * 20) + 's';
    ring.style.animationDelay = (Math.random() * 10) + 's';
    var ringColors = ['rgba(99,102,241,.06)', 'rgba(236,72,153,.05)', 'rgba(16,185,129,.04)'];
    ring.style.borderColor = ringColors[Math.floor(Math.random() * ringColors.length)];
    rc.appendChild(ring);
  }

  /* ── Progress simulation ── */
  var stepLabels = [
    'Инициализация модулей...',
    'Загрузка интерфейса ' + role + '...',
    'Подключение к системе...',
    'Подготовка демо-данных...',
    'Интерфейс готов!'
  ];
  var dots = [
    document.getElementById('sd1'),
    document.getElementById('sd2'),
    document.getElementById('sd3'),
    document.getElementById('sd4')
  ];
  var labelEl = document.getElementById('progressLabel');
  var step = 0;

  function advanceStep(){
    if(step >= dots.length) return;
    dots[step].classList.add('active');
    labelEl.textContent = stepLabels[step] || '';
    step++;
    if(step < dots.length) setTimeout(advanceStep, 600);
    else{
      labelEl.textContent = stepLabels[stepLabels.length - 1];
      setTimeout(hideOverlay, 500);
    }
  }
  setTimeout(advanceStep, 350);

  /* ── Hide overlay ── */
  function hideOverlay(){
    animating = false;
    overlay.classList.add('out');
    var f = document.getElementById('demoFrame');
    f.style.transform = 'scale(1.03)';
    f.classList.add('visible');
    setTimeout(function(){
      overlay.remove();
      f.style.transform = '';
    }, 1000);
  }

  /* ── Load iframe ── */
  var f = document.getElementById('demoFrame');
  f.src = pages[role] + '?demo=1&role=' + encodeURIComponent(role);
  f.addEventListener('load', function(){
    try{
      var d = f.contentDocument || f.contentWindow.document;
      function add(src){
        return new Promise(function(resolve, reject){
          var s = d.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          d.head.appendChild(s);
        });
      }
      add('/js/demo-data.js')
        .then(function(){ return add('/js/demo-staff-v2.js'); })
        .catch(function(e){ console.error('Demo staff bootstrap failed', e); });
    }catch(e){ console.error('Demo staff frame error', e); }
  });

  /* ── Ripple on click ── */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.btn');
    if(!btn) return;
    var r = document.createElement('span');
    r.style.cssText = 'position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:rippleAnim .6s ease-out forwards;pointer-events:none;z-index:99';
    var rect = btn.getBoundingClientRect();
    var sz = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = sz + 'px';
    r.style.left = (e.clientX - rect.left - sz / 2) + 'px';
    r.style.top = (e.clientY - rect.top - sz / 2) + 'px';
    btn.style.position = 'relative';
    btn.appendChild(r);
    setTimeout(function(){ r.remove(); }, 600);
  });

  // Inject ripple keyframe
  var style = document.createElement('style');
  style.textContent = '@keyframes rippleAnim{to{transform:scale(4);opacity:0}}';
  document.head.appendChild(style);
})();
</script>
</body>
</html>
