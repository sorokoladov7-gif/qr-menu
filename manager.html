<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кабинет управляющего — QR-Меню</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(99,102,241,.12);top:-100px;left:-100px"></div>

<div id="app" v-cloak>
  <div class="topbar">
    <div class="brand"><div class="logo">QR</div><span>{{ venue ? venue.name : 'Кабинет' }}</span></div>
    <div class="row">
      <span class="muted" style="font-size:13px">{{ profile ? profile.display_name : '' }}</span>
      <button class="btn btn-ghost btn-sm" @click="logout">Выйти</button>
    </div>
  </div>

  <div class="wrap">
    <div v-if="!ready" class="muted" style="text-align:center;padding:60px">Загрузка…</div>

    <div v-else-if="!venue" class="glass card" style="text-align:center;padding:50px">
      ⏳ Ваш аккаунт ещё не привязан к заведению.<br>Админ должен назначить вам заведение в админ-панели.
    </div>

    <template v-else>
      <!-- СТАТИСТИКА -->
      <div class="stats" style="margin-bottom:18px">
        <div class="glass stat"><div class="num">{{ fmt(revenue) }} ₽</div><div class="lbl">Выручка</div></div>
        <div class="glass stat" style="border-color:#60a5fa"><div class="num">{{ orders.length }}</div><div class="lbl">Заказов</div></div>
        <div class="glass stat" style="border-color:#fbbf24"><div class="num">{{ activeCount }}</div><div class="lbl">В работе</div></div>
        <div class="glass stat" style="border-color:#34d399"><div class="num">{{ products.length }}</div><div class="lbl">Позиций</div></div>
      </div>

      <!-- ВКЛАДКИ -->
      <div class="tabs" style="margin-bottom:18px">
        <button :class="{on:tab==='menu'}" @click="tab='menu'">🍔 Меню</button>
        <button :class="{on:tab==='orders'}" @click="tab='orders'">📋 Заказы</button>
        <button :class="{on:tab==='staff'}" @click="tab='staff'">👨‍🍳 Повара</button>
        <button :class="{on:tab==='settings'}" @click="tab='settings'">⚙️ Настройки</button>
      </div>

      <!-- ===== МЕНЮ ===== -->
      <div v-if="tab==='menu'">
        <div class="spread" style="margin-bottom:14px">
          <h3 style="margin:0">Позиции меню</h3>
          <button class="btn btn-primary btn-sm" @click="openAdd">+ Добавить блюдо</button>
        </div>

        <div v-for="p in products" :key="p.id" class="glass menu-item" style="margin-bottom:10px">
          <img class="thumb" :src="p.image_url || DEFAULT_IMG">
          <div style="flex:1;min-width:0">
            <b>{{ p.name }}</b>
            <span class="badge" :class="catBadge(p.category)">{{ catLabel(p.category) }}</span>
            <div class="muted" style="font-size:12px">{{ p.description }}</div>
          </div>
          <b style="color:#a5b4fc">{{ p.price }} ₽</b>
          <button class="btn btn-ghost btn-sm" @click="toggleAvail(p)">{{ p.is_available ? 'Вкл' : 'Выкл' }}</button>
          <button class="btn btn-ghost btn-sm" @click="openEdit(p)">✏️</button>
          <button class="btn btn-danger btn-sm" @click="delProduct(p)">🗑</button>
        </div>
        <p v-if="!products.length" class="muted">Меню пустое — добавьте первое блюдо.</p>
      </div>

      <!-- ===== ЗАКАЗЫ ===== -->
      <div v-if="tab==='orders'">
        <div v-for="o in orders" :key="o.id" class="glass order-card" :style="{borderTopColor: statusColor(o.status)}">
          <div class="spread">
            <div>
              <b>№{{ o.order_number }}</b>
              <span class="badge" :class="'b-'+o.status">{{ statusName(o.status) }}</span>
              <span class="muted" style="font-size:12px;margin-left:6px">{{ o.order_type==='delivery' ? '🚗 Доставка' : '🏠 Самовывоз' }}</span>
            </div>
            <b>{{ fmt(o.total_price) }} ₽</b>
          </div>

          <div class="muted" style="font-size:13px;margin-top:6px">
            📞 {{ o.customer_phone }}<span v-if="o.customer_name"> · {{ o.customer_name }}</span>
            <span v-if="o.delivery_address"> · 📍 {{ o.delivery_address }}</span>
            <span> · {{ timeStr(o.created_at) }}</span>
          </div>

          <div style="margin-top:6px;font-size:13px">
            <div v-for="it in o.items" :key="it.id">{{ it.qty }}x {{ it.name }} — {{ it.price*it.qty }} ₽</div>
            <div v-for="a in o.addons" :key="a.id" class="muted">+ {{ a.name }} — {{ a.price }} ₽</div>
          </div>

          <div v-if="o.comment" class="muted" style="font-size:12px;margin-top:6px">💬 {{ o.comment }}</div>

          <div class="row" style="margin-top:10px">
            <span class="muted" style="font-size:12px">Оплата: {{ o.payment_method==='card' ? 'карта' : 'наличные' }}</span>
            <button v-if="o.status==='ready' && o.order_type==='delivery'" class="btn btn-primary btn-sm" @click="setStatus(o.id,'delivery')">Курьеру</button>
            <button v-if="['ready','delivery'].includes(o.status)" class="btn btn-green btn-sm" @click="setStatus(o.id,'done')">Завершить</button>
            <button v-if="['new','cooking'].includes(o.status)" class="btn btn-danger btn-sm" @click="setStatus(o.id,'cancelled')">Отменить</button>
          </div>
        </div>
        <p v-if="!orders.length" class="muted">Заказов пока нет.</p>
      </div>

      <!-- ===== ПОВАРА ===== -->
      <div v-if="tab==='staff'">
        <div class="glass card" style="margin-bottom:14px">
          <div class="row">
            <input v-model="cookName" placeholder="Имя повара" style="flex:1;min-width:160px">
            <button class="btn btn-green btn-sm" @click="addCook">+ Добавить повара</button>
          </div>
        </div>

        <div v-for="c in cooks" :key="c.id" class="glass menu-item" style="margin-bottom:10px">
          <div style="flex:1">
            <b>👨‍🍳 {{ c.name }}</b>
            <div class="muted" style="font-size:12px">
              PIN: <b style="color:#a5b4fc">{{ c.pin }}</b> · вход на cook.html (код заведения: {{ venue.slug }})
            </div>
          </div>
          <button class="btn btn-danger btn-sm" @click="delCook(c)">🗑</button>
        </div>
        <p v-if="!cooks.length" class="muted">Добавьте поваров — они будут принимать заказы по PIN.</p>
      </div>

      <!-- ===== НАСТРОЙКИ ===== -->
      <div v-if="tab==='settings'" class="glass card" style="max-width:560px">
        <div class="field"><label>Название</label><input v-model="vform.name"></div>
        <div class="field"><label>Описание</label><textarea v-model="vform.description" rows="2"></textarea></div>

        <div class="field">
          <label>Логотип заведения</label>
          <div v-if="vform.logo_url" style="margin-bottom:10px">
            <img :src="vform.logo_url" style="width:70px;height:70px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
          </div>
          <div class="row">
            <label class="btn btn-ghost btn-sm" style="cursor:pointer;display:inline-flex">
              <span v-if="!uploading">📸 Загрузить логотип</span>
              <span v-else>⏳ Загружаю…</span>
              <input type="file" accept="image/*" @change="uploadImage($event,'logo')" :disabled="uploading" style="display:none">
            </label>
            <button v-if="vform.logo_url" class="btn btn-danger btn-sm" @click="vform.logo_url=''">✕ Убрать</button>
          </div>
          <input v-model="vform.logo_url" placeholder="или вставь ссылку на логотип" style="margin-top:8px">
        </div>

        <div class="field"><label>Фирменный цвет</label><input v-model="vform.brand_color" type="color" style="height:44px;padding:4px"></div>
        <button class="btn btn-primary" @click="saveVenue">Сохранить</button>

        <div style="margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)">
          <label>QR-код и ссылка для клиентов</label>
          <div class="row">
            <img :src="qrUrl" style="width:140px;height:140px;border-radius:12px;background:#fff;padding:6px">
            <div style="flex:1;min-width:200px">
              <div class="muted" style="font-size:12px;word-break:break-all">{{ clientLink }}</div>
              <button class="btn btn-ghost btn-sm" style="margin-top:8px" @click="copyLink">Копировать ссылку</button>
              <a class="btn btn-primary btn-sm" style="margin-top:8px" :href="clientLink" target="_blank">Открыть меню</a>
            </div>
          </div>
        </div>

        <div v-if="msg" class="msg" :class="msgType">{{ msg }}</div>
      </div>
    </template>
  </div>

  <!-- ===== МОДАЛКА БЛЮДА ===== -->
  <div v-if="showModal" class="modal" @click.self="showModal=false">
    <div class="glass box">
      <h3 style="margin-top:0">{{ editing ? 'Редактировать блюдо' : 'Новое блюдо' }}</h3>

      <div class="field"><label>Название</label><input v-model="pform.name"></div>
      <div class="field"><label>Описание</label><textarea v-model="pform.description" rows="2"></textarea></div>

      <div class="row">
        <div class="field" style="flex:1"><label>Цена ₽</label><input v-model.number="pform.price" type="number"></div>
        <div class="field" style="flex:1">
          <label>Категория</label>
          <select v-model="pform.category">
            <option value="main">Блюдо</option>
            <option value="drink">Напиток</option>
            <option value="addon">Доп / соус</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Фото блюда</label>
        <div v-if="pform.image_url" style="margin-bottom:10px">
          <img :src="pform.image_url" style="width:110px;height:110px;object-fit:cover;border-radius:12px;border:1px solid rgba(255,255,255,.1)">
        </div>
        <div class="row">
          <label class="btn btn-ghost btn-sm" style="cursor:pointer;display:inline-flex">
            <span v-if="!uploading">📸 Загрузить фото</span>
            <span v-else>⏳ Загружаю…</span>
            <input type="file" accept="image/*" @change="uploadImage($event,'product')" :disabled="uploading" style="display:none">
          </label>
          <button v-if="pform.image_url" class="btn btn-danger btn-sm" @click="pform.image_url=''">✕ Убрать</button>
        </div>
        <input v-model="pform.image_url" placeholder="…или вставь ссылку на картинку" style="margin-top:8px">
      </div>

      <div class="row">
        <button class="btn btn-primary" style="flex:1" @click="saveProduct">Сохранить</button>
        <button class="btn btn-ghost" @click="showModal=false">Отмена</button>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
Vue.createApp({
  data(){return{
    ready:false, profile:null, venue:null,
    products:[], orders:[], cooks:[],
    tab:'menu', showModal:false, editing:null, pform:{},
    cookName:'', vform:{}, msg:'', msgType:'', timer:null, uploading:false
  }},
  computed:{
    revenue(){return this.orders.filter(o=>o.status==='done').reduce((s,o)=>s+Number(o.total_price),0)},
    activeCount(){return this.orders.filter(o=>['new','cooking','delivery'].includes(o.status)).length},
    clientLink(){return this.venue ? location.origin + '/menu.html?venue=' + this.venue.slug : ''},
    qrUrl(){return 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + encodeURIComponent(this.clientLink)}
  },
  methods:{
    fmt, statusName, logout,
    statusColor(s){return {new:'#60a5fa',cooking:'#fbbf24',ready:'#34d399',delivery:'#a78bfa',done:'#64748b',cancelled:'#f87171'}[s]||'#64748b'},
    catLabel(c){return {main:'Блюдо',drink:'Напиток',addon:'Доп'}[c]||c},
    catBadge(c){return c==='addon' ? 'b-delivery' : c==='drink' ? 'b-cooking' : 'b-new'},
    timeStr(ts){const d=new Date(ts);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})},

    async init(){
      this.profile = await requireAuth(['manager','admin']);
      if(!this.profile) return;
      if(this.profile.venue_id){
        const {data} = await db.from('venues').select('*').eq('id', this.profile.venue_id).maybeSingle();
        this.venue = data;
        if(this.venue){
          this.vform = {name:this.venue.name, description:this.venue.description, logo_url:this.venue.logo_url, brand_color:this.venue.brand_color};
          await Promise.all([this.loadProducts(), this.loadOrders(), this.loadCooks()]);
          this.timer = setInterval(()=>this.loadOrders(), 5000);
        }
      }
      this.ready = true;
    },
    async loadProducts(){const {data}=await db.from('products').select('*').eq('venue_id',this.venue.id).order('created_at');this.products=data||[]},
    async loadOrders(){const {data}=await db.from('orders').select('*').eq('venue_id',this.venue.id).order('created_at',{ascending:false}).limit(50);this.orders=data||[]},
    async loadCooks(){const {data}=await db.from('cooks').select('*').eq('venue_id',this.venue.id);this.cooks=data||[]},

    openAdd(){this.editing=null;this.pform={name:'',description:'',price:0,category:'main',image_url:''};this.showModal=true},
    openEdit(p){this.editing=p;this.pform={...p};this.showModal=true},
    async saveProduct(){
      if(!this.pform.name) return;
      const row={name:this.pform.name, description:this.pform.description, price:this.pform.price||0, category:this.pform.category, image_url:this.pform.image_url||null};
      if(this.editing){ await db.from('products').update(row).eq('id',this.editing.id); }
      else { row.venue_id=this.venue.id; await db.from('products').insert(row); }
      this.showModal=false; await this.loadProducts();
    },
    async delProduct(p){if(confirm('Удалить "'+p.name+'"?')){await db.from('products').delete().eq('id',p.id);await this.loadProducts()}},
    async toggleAvail(p){await db.from('products').update({is_available:!p.is_available}).eq('id',p.id);await this.loadProducts()},

    async addCook(){
      if(!this.cookName.trim()) return;
      const pin=String(Math.floor(1000+Math.random()*9000));
      await db.from('cooks').insert({venue_id:this.venue.id, name:this.cookName.trim(), pin});
      this.cookName=''; await this.loadCooks();
    },
    async delCook(c){if(confirm('Удалить повара '+c.name+'?')){await db.from('cooks').delete().eq('id',c.id);await this.loadCooks()}},

    async setStatus(id,status){await db.from('orders').update({status}).eq('id',id);await this.loadOrders()},

    async saveVenue(){
      await db.from('venues').update({name:this.vform.name, description:this.vform.description, logo_url:this.vform.logo_url, brand_color:this.vform.brand_color}).eq('id',this.venue.id);
      this.msg='Сохранено'; this.msgType='ok';
      const {data}=await db.from('venues').select('*').eq('id',this.venue.id).maybeSingle(); this.venue=data;
    },
    copyLink(){navigator.clipboard.writeText(this.clientLink);this.msg='Ссылка скопирована';this.msgType='ok'},

    // ===== ЗАГРУЗКА ФОТО В SUPABASE STORAGE =====
    async uploadImage(event, target){
      const file = event.target.files[0];
      if(!file) return;
      this.uploading = true;
      try{
        const blob = await this.resizeImage(file, 900, 0.85);
        const dir = this.venue ? this.venue.id : 'general';
        const fileName = dir + '/' + Date.now() + '.jpg';
        const { error } = await db.storage.from('menu-images').upload(fileName, blob, {
          cacheControl:'3600', upsert:true, contentType:'image/jpeg'
        });
        if(error) throw error;
        const { data } = db.storage.from('menu-images').getPublicUrl(fileName);
        if(target==='logo') this.vform.logo_url = data.publicUrl;
        else this.pform.image_url = data.publicUrl;
      }catch(e){
        alert('Ошибка загрузки: ' + e.message);
      }finally{
        this.uploading = false;
        event.target.value = '';
      }
    },
    resizeImage(file, maxWidth, quality){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = (e)=>{
          const img = new Image();
          img.onload = ()=>{
            const canvas = document.createElement('canvas');
            let w=img.width, h=img.height;
            if(w>maxWidth){ h=Math.round(h*maxWidth/w); w=maxWidth; }
            canvas.width=w; canvas.height=h;
            const ctx=canvas.getContext('2d');
            ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
            ctx.drawImage(img,0,0,w,h);
            canvas.toBlob(b=>b?resolve(b):reject(new Error('Не удалось обработать фото')),'image/jpeg',quality);
          };
          img.onerror=()=>reject(new Error('Не удалось загрузить фото'));
          img.src=e.target.result;
        };
        reader.onerror=()=>reject(new Error('Не удалось прочитать файл'));
        reader.readAsDataURL(file);
      });
    }
  },
  mounted(){this.init()},
  beforeUnmount(){if(this.timer) clearInterval(this.timer)}
}).mount('#app');
</script>
</body>
</html>
