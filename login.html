<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в QR-Menu</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shared/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</head>
<body>
<div id="app" v-cloak style="max-width:400px;margin:60px auto;padding:20px">
  <div class="glass box">
    <h2 style="text-align:center;margin-top:0">Вход в систему</h2>
    <div v-if="msg" class="msg" :class="msgType" style="margin-bottom:16px">{{ msg }}</div>
    <div class="field">
      <label>Email</label>
      <input v-model.trim="lform.email" type="email" placeholder="manager@qr-menu.ru" :disabled="busy">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input v-model.trim="lform.password" type="password" placeholder="••••••••" :disabled="busy">
    </div>
    <button id="loginButton" class="btn btn-primary" style="width:100%;margin-top:16px" @click="login" :disabled="busy">Войти</button>
    <div style="text-align:center;margin-top:16px">
      <a href="register.html" class="muted" style="font-size:13px">Нет аккаунта? Зарегистрироваться</a>
    </div>
  </div>
</div>

<script>
  Vue.createApp({
    data: function() {
      return { busy: false, msg: '', msgType: '', lform: { email: '', password: '' } };
    },
    watch: {
      busy: function(v) {
        var b = document.getElementById('loginButton');
        if (b) b.textContent = v ? 'Входим...' : 'Войти';
      }
    },
    methods: {
      login: function() {
        var self = this;
        self.msg = '';
        if (!self.lform.email || !self.lform.password) {
          self.msg = 'Заполните email и пароль';
          self.msgType = 'error';
          return;
        }
        self.busy = true;
        db.auth.signInWithPassword({ email: self.lform.email, password: self.lform.password })
          .then(function(r) {
            if (r.error) {
              self.msg = 'Ошибка входа: ' + r.error.message;
              self.msgType = 'error';
              self.busy = false;
              return;
            }
            self.routeByRole(r.data.user.id);
          })
          .catch(function(e) {
            self.msg = 'Ошибка: ' + e.message;
            self.msgType = 'error';
            self.busy = false;
          });
      },
      routeByRole: function(userId) {
        var self = this;
        db.from('profiles').select('*').eq('id', userId).maybeSingle()
          .then(function(r) {
            if (!r.data) {
              self.msg = '⚠️ Аккаунт создан, но профиль не найден. Выполните SQL и нажмите «Войти».';
              self.msgType = 'error';
              self.busy = false;
              return;
            }
            location.href = (r.data.role === 'admin') ? 'admin.html' : 'manager.html';
          })
          .catch(function(e) {
            self.msg = 'Ошибка профиля: ' + e.message;
            self.msgType = 'error';
            self.busy = false;
          });
      }
    },
    mounted: function() {
      var self = this;
      db.auth.getSession().then(function(r) {
        if (r.data && r.data.session) {
          self.routeByRole(r.data.session.user.id);
        }
      }).catch(function(e) {
        console.warn('Проверка сессии не удалась:', e);
        self.busy = false;
      });
    }
  }).mount('#app');
</script>
</body>
</html>
