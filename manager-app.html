<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Управляющий</title>
<link rel="manifest" href="/manifest-manager.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Управляющий">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icon-manager-192.png">
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1020;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.box{text-align:center;padding:24px}.spinner{width:32px;height:32px;margin:0 auto 12px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spinner"></div><div>Открываем кабинет управляющего…</div></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
setTimeout(function(){location.replace('/manager.html');},100);
</script>
</body>
</html>
