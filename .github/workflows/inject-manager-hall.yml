name: Connect AI hall planner
on:
  push:
    branches: [main]
    paths-ignore:
      - 'manager.html'
      - '.github/workflows/inject-manager-hall.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject hall planner script
        shell: python
        run: |
          from pathlib import Path
          p=Path('manager.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/js/manager-hall-ai.js"></script>'
          if tag not in s:
              marker='</head>'
              if marker not in s: raise SystemExit('manager.html: </head> not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'qr-menu-bot'
          git config user.email 'actions@github.com'
          git add manager.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: connect AI hall planner to manager cabinet'
          git push
