name: One-time repair app.js

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove malformed native Vue Hall block and validate JS
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* Native Vue Manager Hall / Tables. Existing manager functionality is preserved. */'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'
              p.write_text(s, encoding='utf-8')
          else:
              print('Native Hall block already absent')
      - name: Syntax check
        run: node --check js/app.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix: remove malformed native Vue Hall block'
          git push origin main
