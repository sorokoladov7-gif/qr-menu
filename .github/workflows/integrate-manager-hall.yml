name: Integrate Manager Hall
on:
  push:
    branches: [main]
jobs:
  integrate:
    if: github.event.head_commit.message != 'chore: integrate standalone manager hall'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Hall module
        run: node --check js/manager-hall.js
      - name: Integrate script
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='manager.html';
          let s=fs.readFileSync(p,'utf8');
          const tag='<script src="js/manager-hall.js"></script>';
          if(!s.includes(tag)){
            const marker='<script src="js/config.js"></script>';
            if(!s.includes(marker)) throw new Error('manager.html marker not found');
            s=s.replace(marker,tag+'\n'+marker);
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Validate integration
        run: |
          node --check js/manager-hall.js
          node -e "const fs=require('fs'); const s=fs.readFileSync('manager.html','utf8'); if(!s.includes('js/manager-hall.js')) process.exit(1)"
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager.html
          git diff --cached --quiet || git commit -m 'chore: integrate standalone manager hall'
          git push
