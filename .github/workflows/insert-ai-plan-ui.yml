name: insert-ai-plan-ui
on:
  push:
    branches: [fix/manager-ai-chat-entitlement-2026-09-06]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Add native AI controls to tariff editor')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Insert native Vue AI controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html'); s=p.read_text()
          marker='''<div class="field"><label>Позиций меню</label><input class="num-in" v-model.number="p.max_products" type="number" min="1"></div>'''
          block='''<div class="plan-ai-controls" style="margin:12px 0;padding:12px;border:1px solid rgba(99,102,241,.24);border-radius:14px;background:rgba(99,102,241,.06)">\n  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap">\n    <div><b>ИИ-функции тарифа</b><div class="muted" style="font-size:11px;margin-top:3px">{{ aiFeatureCount(p) }}/10 функций подключено</div></div>\n    <div class="field" style="margin:0;min-width:130px"><label style="font-size:11px">Доплата за ИИ ₽/мес</label><input v-model.number="p.ai_addon_price" type="number" min="0" step="1" style="width:100%;box-sizing:border-box"></div>\n  </div>\n  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px">\n    <button v-for="feature in aiFeatureList()" :key="feature[0]" type="button" class="btn btn-sm" @click="togglePlanAIFeature(p,feature[0])" :style="{textAlign:'left',justifyContent:'flex-start',width:'100%',borderColor:p.ai_features&&p.ai_features[feature[0]]?'rgba(52,211,153,.55)':'rgba(255,255,255,.08)',background:p.ai_features&&p.ai_features[feature[0]]?'rgba(52,211,153,.10)':'rgba(255,255,255,.025)'}">{{ p.ai_features&&p.ai_features[feature[0]] ? '✓ ' : '○ ' }}{{ feature[1] }}</button>\n  </div>\n  <div class="muted" style="font-size:10px;margin-top:8px">Настройка сохраняется вместе с тарифом. Серверная проверка доступа остаётся обязательной.</div>\n</div>'''
          if 'class="plan-ai-controls"' in s: raise SystemExit('AI controls already present')
          if marker not in s: raise SystemExit('tariff marker not found')
          p.write_text(s.replace(marker, marker+'\n'+block, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/insert-ai-plan-ui.yml
          git add admin.html
          git commit -m 'Add native AI controls to tariff editor'
          git push origin HEAD:fix/manager-ai-chat-entitlement-2026-09-06
