name: Inject address suggestions

on:
  push:
    branches: [feature/real-address-suggestions]

jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject script into menu.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('menu.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/js/address-suggestions.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('menu.html: </body> not found')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Address script already injected')
      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable address suggestions in menu [skip ci]"
          git push
