name: Fix manager personnel tab
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[manager-personnel-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manager personnel tab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('manager.html')
          s = p.read_text(encoding='utf-8')

          old_btn = '''<button v-bind:class="{on:tab==='staff'}" v-on:click="tab='staff'">Повара</button>'''
          new_btn = '''<button v-bind:class="{on:tab==='personnel'}" v-on:click="tab='personnel';loadStaffAnalytics()">👥 Персонал</button>\n<button v-bind:class="{on:tab==='cooks'}" v-on:click="tab='cooks'">Повара</button>'''
          if "tab==='personnel'" not in s:
              if old_btn not in s:
                  raise SystemExit('Expected staff tab button was not found')
              s = s.replace(old_btn, new_btn, 1)

          if 'tab===\'cooks\'' not in s:
              old_block = '''<div v-if="tab==='staff'">'''
              if old_block not in s:
                  raise SystemExit('Expected cooks panel was not found')
              s = s.replace(old_block, '''<div v-if="tab==='cooks'">''', 1)

          if 'data-manager-personnel-panel' not in s:
              marker = '''<div v-if="tab==='cooks'">'''
              personnel = r'''<div v-if="tab==='personnel'" data-manager-personnel-panel>
<div class="glass card" style="margin-bottom:16px">
  <div class="spread" style="margin-bottom:12px">
    <div>
      <h3 style="margin:0">👥 Персонал</h3>
      <div class="muted" style="font-size:12px">Производительность персонала и аналитика за выбранный период.</div>
    </div>
    <select v-model="staffAnalyticsDays" v-on:change="loadStaffAnalytics" style="width:auto">
      <option value="7">7 дней</option>
      <option value="30">30 дней</option>
      <option value="90">90 дней</option>
    </select>
  </div>
  <div class="analytics-grid">
    <div class="glass stat"><div class="num">{{ staffAnalytics.cooks.reduce(function(s,x){return s+Number(x.orders_count||0)},0) }}</div><div class="lbl">Заказы поваров</div></div>
    <div class="glass stat"><div class="num">{{ staffAnalytics.couriers.reduce(function(s,x){return s+Number(x.deliveries_count||0)},0) }}</div><div class="lbl">Доставки</div></div>
    <div class="glass stat"><div class="num">{{ staffAnalytics.waiters.reduce(function(s,x){return s+Number(x.served_count||0)},0) }}</div><div class="lbl">Выдачи официантов</div></div>
  </div>
  <p class="muted" style="font-size:12px;margin-bottom:12px">За последние {{ staffAnalytics.period_days }} дней · данные из заказов</p>
</div>

<div class="glass card" style="margin-bottom:14px">
  <h4 style="margin:0 0 10px">👨‍🍳 Производительность поваров</h4>
  <table class="tbl">
    <tr><th>Имя</th><th>Заказов</th><th>Ср. время</th><th>Выручка</th></tr>
    <tr v-for="c in staffAnalytics.cooks" v-bind:key="'cook-'+c.name">
      <td>{{ c.name }}</td><td>{{ c.orders_count }}</td>
      <td v-bind:style="{color:c.avg_time_min<=10?'#6ee7b7':c.avg_time_min<=20?'#fcd34d':'#fca5a5'}">{{ c.avg_time_min }} мин</td>
      <td style="color:#6ee7b7">{{ fmt(c.revenue) }} ₽</td>
    </tr>
    <tr v-if="!staffAnalytics.cooks.length"><td colspan="4" class="muted">Нет данных</td></tr>
  </table>
</div>

<div class="glass card" style="margin-bottom:14px">
  <h4 style="margin:0 0 10px">🚗 Производительность курьеров</h4>
  <table class="tbl">
    <tr><th>Имя</th><th>Доставок</th><th>Выручка</th></tr>
    <tr v-for="c in staffAnalytics.couriers" v-bind:key="'courier-'+c.name">
      <td>{{ c.name }}</td><td>{{ c.deliveries_count }}</td><td style="color:#6ee7b7">{{ fmt(c.revenue) }} ₽</td>
    </tr>
    <tr v-if="!staffAnalytics.couriers.length"><td colspan="3" class="muted">Нет данных</td></tr>
  </table>
</div>

<div class="glass card">
  <h4 style="margin:0 0 10px">🤵 Производительность официантов</h4>
  <table class="tbl">
    <tr><th>Имя</th><th>Выдач</th><th>Выручка</th></tr>
    <tr v-for="w in staffAnalytics.waiters" v-bind:key="'waiter-'+w.name">
      <td>{{ w.name }}</td><td>{{ w.served_count }}</td><td style="color:#6ee7b7">{{ fmt(w.revenue) }} ₽</td>
    </tr>
    <tr v-if="!staffAnalytics.waiters.length"><td colspan="3" class="muted">Нет данных</td></tr>
  </table>
</div>
</div>

'''
              if marker not in s:
                  raise SystemExit('Expected cooks panel marker was not found')
              s = s.replace(marker, personnel + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q "tab==='personnel'" manager.html
          grep -q "tab==='cooks'" manager.html
          grep -q "data-manager-personnel-panel" manager.html
      - name: Commit manager personnel fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager.html .github/workflows/fix-manager-personnel.yml
          git rm -f .github/workflows/fix-manager-personnel.yml
          git add manager.html
          git commit -m 'Add personnel analytics tab before cooks [manager-personnel-fixed]'
          git push
