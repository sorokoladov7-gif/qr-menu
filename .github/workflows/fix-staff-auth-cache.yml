name: One-time staff auth cache fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix staff auth cache and session storage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cook.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('/js/config.js?v=2026082201', '/js/config.js?v=2026082402')
          s = s.replace("localStorage.getItem('staff_token')", "sessionStorage.getItem('cook_token')")
          s = s.replace("localStorage.setItem('staff_token',this.token)", "sessionStorage.setItem('cook_token',this.token)")
          s = s.replace("localStorage.setItem('cook_session',JSON.stringify(this.session))", "sessionStorage.setItem('cook_session',JSON.stringify(this.session))")
          s = s.replace("localStorage.removeItem('cook_session')", "sessionStorage.removeItem('cook_session')")
          s = s.replace("localStorage.removeItem('staff_token')", "sessionStorage.removeItem('cook_token')")
          s = s.replace("localStorage.getItem('cook_session')", "sessionStorage.getItem('cook_session')")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-staff-auth-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cook.html .github/workflows/fix-staff-auth-cache.yml
          git commit -m 'fix staff auth cache and isolate cook session'
          git push
