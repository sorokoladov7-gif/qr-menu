name: Fix manager cook UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[manager-cook-ui-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch manager cook UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('manager.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("{{ w.phone||'не указан' }}", "{{ c.phone||'не указан' }}")
          s=s.replace("select('id,name,venue_id,created_at')", "select('id,name,phone,venue_id,created_at')")
          s=s.replace("<div class=\"field\" v-if=\"createStaffType!=='cook'\"><label>Телефон</label>", "<div class=\"field\"><label>Телефон</label>")
          needle="copyWaiterAccess: function(w) { this.copyText('Вход для официанта '+w.name+':\\nСайт: '+location.origin+'/waiter.html\\nКод заведения: '+this.venue.slug+'\\n\\nНажмите «🔄 PIN» чтобы сгенерировать новый PIN.'); },"
          insert=needle+"\n    copyCookAccess: function(c) { this.copyText('Вход для повара '+c.name+':\\nСайт: '+location.origin+'/cook.html\\nКод заведения: '+this.venue.slug+'\\n\\nНажмите «🔄 PIN» чтобы сгенерировать новый PIN.'); },"
          if needle in s and 'copyCookAccess: function(c)' not in s:
              s=s.replace(needle, insert, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired manager
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager.html
          git commit -m 'Fix manager cook UI [manager-cook-ui-fixed]' || exit 0
          git push