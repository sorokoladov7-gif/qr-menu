name: One-time admin analytics patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'admin analytics patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin analytics
        run: python3 .github/admin_analytics_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git rm -f .github/admin_analytics_patch.py .github/workflows/one-time-admin-analytics.yml
          git diff --cached --quiet || git commit -m "feat: расширить аналитику админ-панели [admin analytics patch]"
          git push
