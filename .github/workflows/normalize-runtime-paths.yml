name: normalize-runtime-paths

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/normalize-runtime-paths.py
