name: Finalize manager personnel UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[manager-personnel-final]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair manager personnel tabs and staff references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('manager.html')
          s = p.read_text(encoding='utf-8')

          # 1) Fix staff variable mix-ups that can crash Vue rendering.
          cooks = re.compile(r'(<div v-for="c in cooks"[\s\S]*?</div>\s*<button class="btn btn-ghost btn-sm" v-on:click="resetStaffPin\(c,\'cook\'\)"[\s\S]*?</div>)')
          m = cooks.search(s)
          if m:
              block = m.group(1).replace('{{ w.phone||\'не указан\' }}', '{{ c.phone||\'не указан\' }}')
              s = s[:m.start(1)] + block + s[m.end(1):]

          couriers = re.compile(r'(<div v-for="c in couriers"[\s\S]*?</div>\s*<button class="btn btn-ghost btn-sm" v-on:click="resetStaffPin\(c,\'courier\'\)"[\s\S]*?</div>)')
          m = couriers.search(s)
          if m:
              block = m.group(1).replace('{{ w.phone||\'не указан\' }}', '{{ c.phone||\'не указан\' }}')
              s = s[:m.start(1)] + block + s[m.end(1):]

          waiters = re.compile(r'(<div v-for="w in waiters"[\s\S]*?</div>\s*<button class="btn btn-ghost btn-sm" v-on:click="resetStaffPin\(w,\'waiter\'\)"[\s\S]*?</div>)')
          m = waiters.search(s)
          if m:
              block = m.group(1).replace('{{ c.phone||\'не указан\' }}', '{{ w.phone||\'не указан\' }}')
              s = s[:m.start(1)] + block + s[m.end(1):]

          # 2) Ensure cook data includes phone.
          s = s.replace(
              "db.from('cooks').select('id,name,venue_id,created_at')",
              "db.from('cooks').select('id,name,phone,venue_id,created_at')"
          )

          # 3) Put a real Personnel tab before the individual staff tabs.
          nav_old = '<button v-bind:class="{on:tab===\'staff\'}" v-on:click="tab=\'staff\'">Повара</button>'
          nav_new = '<button v-bind:class="{on:tab===\'staff\'}" v-on:click="tab=\'staff\';loadStaffAnalytics()">👥 Персонал</button>\n<button v-bind:class="{on:tab===\'cooks\'}" v-on:click="tab=\'cooks\'">Повара</button>'
          if '👥 Персонал' not in s and nav_old in s:
              s = s.replace(nav_old, nav_new, 1)

          # 4) The existing staff panel is the cook management panel. Rename it to cooks.
          cook_start = '<div v-if="tab===\'staff\'">\n<div class="glass card" style="margin-bottom:14px"><div class="row">\n<button class="btn btn-green btn-sm" v-on:click="openCreateStaff(\'cook\')"'
          if 'openCreateStaff(\'cook\')' in s and cook_start in s:
              s = s.replace(cook_start, cook_start.replace("tab==='staff'", "tab==='cooks'"), 1)

          # 5) Insert a standalone Personnel analytics panel once.
          if 'data-manager-personnel-panel' not in s:
              marker = '<div v-if="tab===\'cooks\'">'
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('Cook panel marker not found after normalization')
              panel = r'''<div v-if="tab==='staff'" data-manager-personnel-panel>
<div class="glass card">
<div class="spread" style="margin-bottom:12px">
<div><h3 style="margin:0">👥 Персонал</h3><div class="muted">Производительность и аналитика сотрудников.</div></div>
<select v-model="staffAnalyticsDays" v-on:change="loadStaffAnalytics" style="width:auto">
<option value="7">7 дней</option><option value="30">30 дней</option><option value="90">90 дней</option>
</select>
</div>
<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px">
<div class="glass stat"><div class="num">{{ cooks.length }}</div><div class="lbl">Повара</div></div>
<div class="glass stat"><div class="num">{{ couriers.length }}</div><div class="lbl">Курьеры</div></div>
<div class="glass stat"><div class="num">{{ waiters.length }}</div><div class="lbl">Официанты</div></div>
</div>
<div class="glass card" style="margin-bottom:12px"><h4 style="margin:0 0 10px">👨‍🍳 Производительность поваров</h4>
<table class="tbl"><tr><th>Имя</th><th>Заказов</th><th>Ср. время</th><th>Выручка</th></tr>
<tr v-for="c in staffAnalytics.cooks" v-bind:key="'cook-'+c.name"><td>{{ c.name }}</td><td>{{ c.orders_count }}</td><td>{{ c.avg_time_min }} мин</td><td>{{ fmt(c.revenue) }} ₽</td></tr>
<tr v-if="!staffAnalytics.cooks.length"><td colspan="4" class="muted">Нет данных за выбранный период</td></tr></table></div>
<div class="glass card" style="margin-bottom:12px"><h4 style="margin:0 0 10px">🚗 Производительность курьеров</h4>
<table class="tbl"><tr><th>Имя</th><th>Доставок</th><th>Выручка</th></tr>
<tr v-for="c in staffAnalytics.couriers" v-bind:key="'courier-'+c.name"><td>{{ c.name }}</td><td>{{ c.deliveries_count }}</td><td>{{ fmt(c.revenue) }} ₽</td></tr>
<tr v-if="!staffAnalytics.couriers.length"><td colspan="3" class="muted">Нет данных за выбранный период</td></tr></table></div>
<div class="glass card"><h4 style="margin:0 0 10px">🤵 Производительность официантов</h4>
<table class="tbl"><tr><th>Имя</th><th>Выдач</th><th>Выручка</th></tr>
<tr v-for="w in staffAnalytics.waiters" v-bind:key="'waiter-'+w.name"><td>{{ w.name }}</td><td>{{ w.served_count }}</td><td>{{ fmt(w.revenue) }} ₽</td></tr>
<tr v-if="!staffAnalytics.waiters.length"><td colspan="3" class="muted">Нет данных за выбранный период</td></tr></table></div>
</div>
</div>

'''
              s = s[:idx] + panel + s[idx:]

          p.write_text(s, encoding='utf-8')
          PY

          # Remove old conflicting auto-patches which rewrite manager.html staff variables.
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if grep -q "manager-staff-refs-fixed\|Fix manager staff references\|manager staff reference repair" "$f"; then
              rm -f "$f"
            fi
          done

      - name: Validate repaired manager HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('manager.html').read_text(encoding='utf-8')
          assert "tab==='staff'" in s and '👥 Персонал' in s
          assert "tab==='cooks'" in s
          assert "{{ w.phone||'не указан' }}" in s
          assert "{{ c.phone||'не указан' }}" in s
          assert "select('id,name,phone,venue_id,created_at')" in s
          assert 'data-manager-personnel-panel' in s
          print('manager personnel validation OK')
          PY

      - name: Commit final manager personnel fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager.html .github/workflows
          git commit -m 'Fix manager personnel tab and staff rendering [manager-personnel-final]' || exit 0
          git push
