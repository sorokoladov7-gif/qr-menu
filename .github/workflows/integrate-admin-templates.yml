name: Integrate admin templates tab

on:
  push:
    paths:
      - '.github/workflows/integrate-admin-templates.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          tab_marker = '<button v-bind:class="{on:tab===\'plans\'}" v-on:click="switchTab(\'plans\')">💳 Тарифы и оплаты</button>'
          tab_insert = tab_marker + '\n<button v-bind:class="{on:tab===\'templates\'}" v-on:click="switchTab(\'templates\')">🍽️ Шаблоны заведений</button>'

          if "tab==='templates'" not in s:
              if tab_marker not in s:
                  raise SystemExit('Could not find admin tabs marker')
              s = s.replace(tab_marker, tab_insert, 1)

          content_marker = '<!-- ===================== СТАТИСТИКА ===================== -->'
          content_insert = '''<!-- ===================== ШАБЛОНЫ ЗАВЕДЕНИЙ ===================== -->
<div v-if="tab==='templates'">
  <div class="spread" style="margin-bottom:14px">
    <div>
      <h3 style="margin:0">🍽️ Шаблоны заведений</h3>
      <div class="muted" style="margin-top:4px;font-size:13px">Редактор шаблонов 2.0. Изменения применяются только к будущим заведениям.</div>
    </div>
    <a class="btn btn-primary" href="admin_templates.html">Открыть редактор</a>
  </div>
  <div class="glass card" style="padding:0;overflow:hidden;min-height:720px">
    <iframe src="admin_templates.html" title="Редактор шаблонов заведений" style="display:block;width:100%;height:720px;border:0;background:transparent"></iframe>
  </div>
</div>

'''
          if "Редактор шаблонов 2.0" not in s:
              if content_marker not in s:
                  raise SystemExit('Could not find admin content marker')
              s = s.replace(content_marker, content_insert + content_marker, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git rm .github/workflows/integrate-admin-templates.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(admin): add venue templates tab"
          git push
