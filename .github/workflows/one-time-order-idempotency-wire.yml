name: one-time-order-idempotency-wire
on:
  push:
    branches: ["tmp/idempotency-wire-20260908"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical PWA RPC wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/pwa-install.js')
          s=p.read_text(encoding='utf-8')
          old="""      db.rpc = async function(name, params, options) {\n        if (name === 'create_public_order_v2' && params) {"""
          new="""      const orderKey = (params) => {\n        if (!params || !/\\/menu\\.html$/i.test(location.pathname)) return params;\n        const stable = {\n          venue: params.p_venue_id || '', type: params.p_order_type || '', phone: params.p_customer_phone || '',\n          address: params.p_delivery_address || '', payment: params.p_payment_method || '', table: params.p_table_token || '',\n          items: params.p_items || [], addons: params.p_addons || [], total: params.p_total_price || 0, fee: params.p_delivery_fee || 0\n        };\n        let fingerprint;\n        try { fingerprint = JSON.stringify(stable); } catch (e) { fingerprint = String(Date.now()); }\n        let saved = null;\n        try { saved = JSON.parse(sessionStorage.getItem('qr_public_order_idempotency') || 'null'); } catch (e) {}\n        const now = Date.now();\n        if (!saved || saved.fingerprint !== fingerprint || (saved.expires_at && saved.expires_at < now)) {\n          saved = { key: (crypto.randomUUID ? crypto.randomUUID() : ('qr-' + now + '-' + Math.random().toString(36).slice(2))), fingerprint, expires_at: now + 10 * 60 * 1000 };\n          sessionStorage.setItem('qr_public_order_idempotency', JSON.stringify(saved));\n        }\n        return Object.assign({}, params, { p_operation_key: saved.key });\n      };\n      db.rpc = async function(name, params, options) {\n        if (name === 'create_public_order' && params) {\n          const prepared = orderKey(params);\n          const result = await rpc(name, prepared, options);\n          if (result && !result.error && prepared.p_payment_method !== 'sbp') {\n            try { sessionStorage.removeItem('qr_public_order_idempotency'); } catch (e) {}\n          }\n          return result;\n        }\n        if (name === 'create_public_order_v2' && params) {"""
          if old not in s:
            raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "QR Menu Bot"
          git config user.email "qr-menu-bot@users.noreply.github.com"
          git add js/pwa-install.js
          git commit -m "fix(menu): wire public order idempotency key"
          git push
