name: One-shot admin modularization
on:
  push:
    branches: [refactor/admin-real-modular]
permissions:
  contents: write
jobs:
  split:
    if: contains(github.event.head_commit.message, '[run-admin-modularization]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/admin-refactor.mjs
      - name: Commit generated modular tree
        run: |
          git config user.name 'qr-menu-refactor-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/pages/admin src/assets/css/admin/admin-motion.css src/assets/js/admin/admin-bootstrap.js
          git rm -f src/assets/js/admin/admin-module-manifest.js 2>/dev/null || true
          git rm -f src/pages/admin/admin-shell.html 2>/dev/null || true
          git add -A
          git commit -m 'refactor(admin): split cabinet into real template modules'
          git push
