name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Normalize canonical internal paths
        shell: python {0}
        run: |
          from pathlib import Path
          import re, subprocess

          root = Path('.')
          pages_root = root / 'src' / 'pages'
          assets_root = root / 'src' / 'assets'
          page_map = {p.name: '/' + p.relative_to(root).as_posix() for p in pages_root.rglob('*.html')}
          asset_map = {}
          for p in assets_root.rglob('*'):
              if p.is_file(): asset_map.setdefault(p.name, []).append('/src/assets/' + p.relative_to(assets_root).as_posix())

          def role_of(path):
              parts = Path(path).parts
              try: return parts[parts.index('pages') + 1]
              except Exception: return None

          def resolve_asset(raw, role):
              clean = raw.split('?',1)[0].split('#',1)[0]
              logical = clean.lstrip('/')
              if logical.startswith('src/assets/'): return raw
              candidates = []
              if logical.startswith('js/'):
                  exact = assets_root / logical
                  if exact.is_file(): candidates = ['/src/assets/' + logical]
                  else:
                      name = Path(logical).name
                      if role:
                          for sub in (role, 'shared', 'pwa', 'demo'):
                              q = assets_root / 'js' / sub / name
                              if q.is_file(): candidates.append('/src/assets/' + q.relative_to(assets_root).as_posix())
                      if not candidates: candidates = asset_map.get(name, [])
              elif logical.startswith(('css/','img/','icons/','pwa/')):
                  q = assets_root / logical
                  if q.is_file(): candidates = ['/src/assets/' + logical]
              if not candidates: return raw
              return candidates[0] + raw[len(clean):]

          html_re = re.compile(r'(?<![A-Za-z0-9_.-])/(?!src/pages/)([A-Za-z0-9_-]+\.html)(?=([?#\"\'\s),;]|$))')
          asset_re = re.compile(r'(?<![A-Za-z0-9_.-])/?((?:js|css|img|icons|pwa)/[A-Za-z0-9_./-]+(?:\?[A-Za-z0-9_=&.-]+)?(?:#[A-Za-z0-9_.-]+)?)')
          manifest_re = re.compile(r'(?<![A-Za-z0-9_.-])/(manifest(?:-[A-Za-z0-9_-]+)?\.webmanifest)(?=([?#\"\'\s),;]|$))')
          targets = [p for p in (root/'src').rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.css','.json','.webmanifest'}] + [root/'sw.js']
          changed=[]
          for p in targets:
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError): continue
              role=role_of(p)
              new=html_re.sub(lambda m: page_map.get(m.group(1),m.group(0)), text)
              new=asset_re.sub(lambda m: resolve_asset(m.group(1),role), new)
              new=manifest_re.sub(lambda m: '/src/assets/pwa/'+m.group(1) if (assets_root/'pwa'/m.group(1)).is_file() else m.group(0), new)
              if new!=text:
                  p.write_text(new,encoding='utf-8'); changed.append(str(p))
          print('Changed files:', len(changed))
          for x in changed: print(x)

          legacy_html = re.compile(r'(?<![A-Za-z0-9_.-])/(?:index|menu|waiter|cook|courier|hall|staff-history|staff-table|manager|manager-demo|manager-staff-statistics|integrations|admin|login|register|forgot-password|reset-password|staff-guide)\.html(?:[?#\"\'\s),;]|$)')
          legacy_asset = re.compile(r'(?<![A-Za-z0-9_.-])/(?:js|css|img|icons|pwa)/')
          violations=[]
          for p in targets:
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              if legacy_html.search(text) or legacy_asset.search(text): violations.append(str(p))
          if violations:
              raise SystemExit('Legacy internal paths remain:\n'+'\n'.join(violations))

          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              subprocess.run(['git','checkout','HEAD^','--','.github/workflows/deploy.yml'],check=True)
              subprocess.run(['git','add','-A'],check=True)
              subprocess.run(['git','commit','--amend','--no-edit'],check=True)
              subprocess.run(['git','push','--force','origin','HEAD:main'],check=True)

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: API tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      - name: Vercel build
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_TEAM_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_ID"
          npx vercel@latest build --token="$VERCEL_TOKEN"
