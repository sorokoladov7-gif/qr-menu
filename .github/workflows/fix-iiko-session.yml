name: Fix iiko integration session
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch integrations auth storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('integrations.html')
          s = p.read_text(encoding='utf-8')
          old = "var SUPABASE_URL='https://ulxfsozdryqrnlxzlblt.supabase.co',SUPABASE_KEY=(window.QR_CONFIG&&window.QR_CONFIG.SUPABASE_ANON_KEY)||'sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);"
          new = "var SUPABASE_URL='https://ulxfsozdryqrnlxzlblt.supabase.co',SUPABASE_KEY=(window.QR_CONFIG&&window.QR_CONFIG.SUPABASE_ANON_KEY)||'sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage,storageKey:'qr-menu-auth-account'}});"
          if old not in s:
              raise SystemExit('target auth client line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrations.html
          git commit -m 'fix: use manager auth session in integrations' || true
          git rm .github/workflows/fix-iiko-session.yml
          git commit -m 'chore: remove temporary iiko fix workflow'
          git push
