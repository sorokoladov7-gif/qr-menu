name: repair-manager-ai-runtime

on:
  push:
    branches: [fix/manager-ai-complete-2026-09-06]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Automated manager AI repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/import-ai.js')
          s=p.read_text()
          marker="const AI_FEATURES = {\n  menu_import: 'ИИ-импорт меню: распознавание и структурирование меню.'\n};\n"
          insert=r'''const AI_FEATURES = {
  menu_import: 'ИИ-импорт меню: распознавание и структурирование меню.'
};

const SCHEMA = {
  type: 'object',
  properties: {
    venue_name: { type: 'string' },
    currency: { type: 'string' },
    categories: {
      type: 'array',
      items: {
        type: 'object',
        properties: {
          name: { type: 'string' },
          items: {
            type: 'array',
            items: {
              type: 'object',
              properties: {
                name: { type: 'string' },
                description: { type: 'string' },
                price: { type: ['number', 'null'] },
                unit: { type: 'string' },
                weight: { type: ['number', 'null'] },
                image_url: { type: ['string', 'null'] },
                allergens: { type: 'array', items: { type: 'string' } },
                tags: { type: 'array', items: { type: 'string' } },
                available: { type: 'boolean' }
              },
              required: ['name', 'description', 'price', 'unit', 'weight', 'image_url', 'allergens', 'tags', 'available']
            }
          }
        },
        required: ['name', 'items']
      }
    },
    warnings: { type: 'array', items: { type: 'string' } }
  },
  required: ['venue_name', 'currency', 'categories', 'warnings']
};

async function parseRequestBody(req) {
  if (req && req.body && typeof req.body === 'object' && !Buffer.isBuffer(req.body)) return req.body;
  const chunks=[];
  let size=0;
  for await (const chunk of req) {
    size += Buffer.byteLength(chunk);
    if (size > MAX_REQUEST_BYTES) throw Object.assign(new Error('REQUEST_TOO_LARGE'), { status: 413 });
    chunks.push(Buffer.from(chunk));
  }
  const raw=Buffer.concat(chunks).toString('utf8').trim();
  if (!raw) return {};
  try { return JSON.parse(raw); }
  catch (_) { throw Object.assign(new Error('INVALID_REQUEST_BODY'), { status: 400 }); }
}

async function deleteTempObject(tempPath) {
  if (!tempPath) return;
  // Current importer reads the object directly from its URL. Cleanup is intentionally
  // best-effort and must never turn a successful import into a 500 response.
  try {
    if (!SUPABASE_SERVICE_ROLE_KEY || !/^https?:\\/\\//i.test(tempPath)) return;
    const u=new URL(tempPath);
    const match=u.pathname.match(/\\/storage\\/v1\\/object\\/(?:sign|public|authenticated)\\/([^/]+)\\/(.+)$/i);
    if (!match) return;
    const bucket=decodeURIComponent(match[1]);
    const objectPath=decodeURIComponent(match[2]);
    await fetch(SUPABASE_URL+'/storage/v1/object/'+encodeURIComponent(bucket)+'/'+objectPath,{method:'DELETE',headers:{apikey:SUPABASE_SERVICE_ROLE_KEY,authorization:'Bearer '+SUPABASE_SERVICE_ROLE_KEY}});
  } catch (_) {}
}
'''
          if marker in s and 'async function parseRequestBody' not in s:
              s=s.replace(marker,insert,1)
          p.write_text(s)
          
          # Keep admin AI model current when the legacy file is present.
          for name in ['api/admin-ai-audit.js','js/admin/admin-ai-audit.js']:
              q=Path(name)
              if q.exists():
                  t=q.read_text()
                  t=t.replace('gemini-2.5-flash','gemini-3.6-flash')
                  q.write_text(t)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/import-ai.js api/admin-ai-audit.js js/admin/admin-ai-audit.js 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Automated manager AI repair"
          git push
