name: Final manager personnel repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[final-manager-personnel-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair manager.html and remove conflicting patch workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manager = Path('manager.html')
          text = manager.read_text(encoding='utf-8')

          old_tab = '''<button v-bind:class="{on:tab==='staff'}" v-on:click="tab='staff'">Повара</button>'''
          new_tabs = '''<button v-bind:class="{on:tab==='staff'}" v-on:click="tab='staff';loadStaffAnalytics()">👥 Персонал</button>
          <button v-bind:class="{on:tab==='cooks'}" v-on:click="tab='cooks'">👨‍🍳 Повара</button>'''
          if old_tab in text:
              text = text.replace(old_tab, new_tabs, 1)

          cook_marker = '<div v-if="tab===\'staff\'">'
          cook_pos = text.find(cook_marker)
          if cook_pos == -1:
              cook_marker = '<div v-if="tab===\"staff\">'
              cook_pos = text.find(cook_marker)

          if cook_pos != -1:
              text = text[:cook_pos] + text[cook_pos:].replace(cook_marker, '<div v-if="tab===\'cooks\'">', 1)

              personnel_panel = r'''<div v-if="tab==='staff'">
<div class="glass card" style="margin-bottom:14px">
  <div class="spread" style="margin-bottom:12px">
    <div>
      <h3 style="margin:0">👥 Персонал</h3>
      <div class="muted" style="font-size:12px;margin-top:4px">Производительность и аналитика персонала за выбранный период</div>
    </div>
    <select v-model="staffAnalyticsDays" v-on:change="loadStaffAnalytics" style="width:auto">
      <option value="7">7 дней</option>
      <option value="30">30 дней</option>
      <option value="90">90 дней</option>
    </select>
  </div>
</div>

<div class="analytics-grid">
  <div class="glass stat">
    <div class="num">{{ staffAnalytics.cooks.length }}</div>
    <div class="lbl">Повара</div>
  </div>
  <div class="glass stat">
    <div class="num">{{ staffAnalytics.couriers.length }}</div>
    <div class="lbl">Курьеры</div>
  </div>
  <div class="glass stat">
    <div class="num">{{ staffAnalytics.waiters.length }}</div>
    <div class="lbl">Официанты</div>
  </div>
</div>

<div class="row" style="align-items:stretch;flex-wrap:wrap;gap:14px">
  <div class="glass card" style="flex:1;min-width:280px">
    <h4 style="margin:0 0 10px">👨‍🍳 Повара</h4>
    <table class="tbl">
      <tr><th>Имя</th><th>Заказов</th><th>Ср. время</th><th>Выручка</th></tr>
      <tr v-for="c in staffAnalytics.cooks" v-bind:key="'pc-'+c.name">
        <td>{{ c.name }}</td>
        <td>{{ c.orders_count }}</td>
        <td>{{ c.avg_time_min }} мин</td>
        <td>{{ fmt(c.revenue) }} ₽</td>
      </tr>
      <tr v-if="!staffAnalytics.cooks.length"><td colspan="4" class="muted">Нет данных</td></tr>
    </table>
  </div>

  <div class="glass card" style="flex:1;min-width:280px">
    <h4 style="margin:0 0 10px">🚗 Курьеры</h4>
    <table class="tbl">
      <tr><th>Имя</th><th>Доставок</th><th>Выручка</th></tr>
      <tr v-for="c in staffAnalytics.couriers" v-bind:key="'pr-'+c.name">
        <td>{{ c.name }}</td>
        <td>{{ c.deliveries_count }}</td>
        <td>{{ fmt(c.revenue) }} ₽</td>
      </tr>
      <tr v-if="!staffAnalytics.couriers.length"><td colspan="3" class="muted">Нет данных</td></tr>
    </table>
  </div>

  <div class="glass card" style="flex:1;min-width:280px">
    <h4 style="margin:0 0 10px">🤵 Официанты</h4>
    <table class="tbl">
      <tr><th>Имя</th><th>Выдач</th><th>Выручка</th></tr>
      <tr v-for="w in staffAnalytics.waiters" v-bind:key="'pw-'+w.name">
        <td>{{ w.name }}</td>
        <td>{{ w.served_count }}</td>
        <td>{{ fmt(w.revenue) }} ₽</td>
      </tr>
      <tr v-if="!staffAnalytics.waiters.length"><td colspan="3" class="muted">Нет данных</td></tr>
    </table>
  </div>
</div>
</div>

'''
              text = text[:cook_pos] + personnel_panel + text[cook_pos:]

          manager.write_text(text, encoding='utf-8')

          # Remove old one-off manager staff patch workflows so they cannot undo this fix.
          wf = Path('.github/workflows')
          needles = [
              'manager-staff-refs-fixed',
              'manager-staff-ui-fixed',
              'manager-cook-ui-fixed',
              'manager-staff-refs',
              'manager-cook-ui',
              'manager personnel tab patch workflow',
              'manager staff reference repair workflow',
              'manager cook tab repair workflow',
              'manager cook instruction',
              'manager staff reference',
          ]
          for p in wf.glob('*.yml'):
              if p.name == 'final-manager-personnel-repair.yml':
                  continue
              s = p.read_text(encoding='utf-8', errors='ignore')
              if any(n.lower() in s.lower() for n in needles):
                  p.unlink()
          for p in wf.glob('*.yaml'):
              if p.name == 'final-manager-personnel-repair.yaml':
                  continue
              s = p.read_text(encoding='utf-8', errors='ignore')
              if any(n.lower() in s.lower() for n in needles):
                  p.unlink()
          PY

      - name: Validate required manager tabs
        shell: bash
        run: |
          grep -q "tab==='staff'" manager.html
          grep -q "👥 Персонал" manager.html
          grep -q "tab==='cooks'" manager.html
          grep -q "loadStaffAnalytics" manager.html

      - name: Commit final repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager.html .github/workflows
          git commit -m "Fix manager personnel tab and remove conflicting staff patchers [final-manager-personnel-repair]" || exit 0
          git push

      - name: Remove this one-shot workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/final-manager-personnel-repair.yml
          git add .github/workflows/final-manager-personnel-repair.yml
          git commit -m "Remove one-shot manager personnel repair workflow" || exit 0
          git push
