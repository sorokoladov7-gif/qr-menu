name: patch integrations hub
on:
  push:
    paths:
      - '.github/workflows/patch-integrations-hub.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch integrations UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('integrations.html')
          s=p.read_text(encoding='utf-8')
          old='''<section class="cardx"><div class="icon">🟢</div><h2>Quick Resto</h2><span class="status">Следующий этап</span><p class="muted">Адаптер меню, цен и заказов.</p></section>\n<section class="cardx"><div class="icon">🔵</div><h2>r_keeper</h2><span class="status">Следующий этап</span><p class="muted">Адаптер меню, цен, заказов и статусов.</p></section>\n<section class="cardx"><div class="icon">🟡</div><h2>1С</h2><span class="status">Следующий этап</span><p class="muted">Обмен справочниками и документами.</p></section>'''
          new='''<section class="cardx hub-card" data-provider="quick_resto"><div class="icon">🟢</div><h2>Quick Resto</h2><span class="status">Доступно к настройке</span><p class="muted">Синхронизация меню, категорий, цен и данных продаж через API Quick Resto.</p><button class="btn btn-primary hub-open" type="button">Настроить</button></section>\n<section class="cardx hub-card" data-provider="r_keeper"><div class="icon">🔵</div><h2>r_keeper</h2><span class="status">Доступно к настройке</span><p class="muted">Подключение через API r_keeper / White Server с выбором объекта и меню.</p><button class="btn btn-primary hub-open" type="button">Настроить</button></section>\n<section class="cardx hub-card" data-provider="onec"><div class="icon">🟡</div><h2>1С</h2><span class="status">Доступно к настройке</span><p class="muted">Обмен номенклатурой, ценами и справочниками с 1С через HTTP-обмен.</p><button class="btn btn-primary hub-open" type="button">Настроить</button></section>\n<section class="cardx hub-card" data-provider="poster"><div class="icon">🟠</div><h2>Poster</h2><span class="status">Доступно к настройке</span><p class="muted">POS-интеграция для меню, товаров и цен через Poster API.</p><button class="btn btn-primary hub-open" type="button">Настроить</button></section>\n<section class="cardx hub-card" data-provider="evotor"><div class="icon">🟦</div><h2>Эвотор</h2><span class="status">Доступно к настройке</span><p class="muted">Облачная интеграция номенклатуры, групп, модификаций и изображений.</p><button class="btn btn-primary hub-open" type="button">Настроить</button></section>\n<section class="cardx hub-card" data-provider="tillypad"><div class="icon">🟪</div><h2>Tillypad</h2><span class="status">Подключение через адаптер</span><p class="muted">Подготовлен отдельный адаптер для POS-системы общепита.</p><button class="btn btn-ghost hub-open" type="button">Настроить</button></section>\n<section class="cardx hub-card" data-provider="frontol"><div class="icon">🟥</div><h2>Frontol</h2><span class="status">Подключение через адаптер</span><p class="muted">Подключение локального POS через отдельный шлюз синхронизации.</p><button class="btn btn-ghost hub-open" type="button">Настроить</button></section>'''
          if old not in s:
              raise SystemExit('expected integration cards not found')
          s=s.replace(old,new)
          marker='''<script src="/js/config.js"></script>'''
          s=s.replace(marker, marker+'\n<script src="/js/integrations-hub.js"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI patch
        run: |
          git config user.name 'qr-menu-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add integrations.html
          git diff --cached --quiet || git commit -m 'Expand integrations hub providers'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/patch-integrations-hub.yml
          git add .github/workflows/patch-integrations-hub.yml
          git diff --cached --quiet || git commit -m 'Remove temporary integrations patch workflow'
          git push
