name: canonical path cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining internal staff demo references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
            Path('src/pages/auth/register.html'): [("location.href='demo-staff.html?role='", "location.href='/src/pages/staff/demo-staff.html?role='")],
            Path('src/pages/guest/index.html'): [('href="demo-staff.html"', 'href="/src/pages/staff/demo-staff.html"')],
          }
          for path, pairs in replacements.items():
            text = path.read_text(encoding='utf-8')
            for old, new in pairs:
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/auth/register.html src/pages/guest/index.html
          git commit -m 'fix: canonicalize remaining internal staff demo paths'
          git push
          rm .github/workflows/canonical-path-cleanup.yml
          git add .github/workflows/canonical-path-cleanup.yml
          git commit -m 'chore: remove one-shot cleanup workflow'
          git push
