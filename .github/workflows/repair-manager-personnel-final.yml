name: Repair manager personnel tab final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[manager-personnel-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manager.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('manager.html')
          s = p.read_text(encoding='utf-8')

          # Fix staff phone bindings and cook data loading regardless of their current state.
          s = s.replace("db.from('cooks').select('id,name,venue_id,created_at')", "db.from('cooks').select('id,name,phone,venue_id,created_at')")
          s = s.replace("{{ w.phone||'не указан' }} · PIN защищён в базе", "{{ c.phone||'не указан' }} · PIN защищён в базе")
          # Correct waiter block if a previous patch accidentally changed it.
          waiter_block = re.search(r'<div v-for="w in waiters"[^>]*>.*?</div></div>', s, re.S)
          if waiter_block:
              block = waiter_block.group(0).replace("{{ c.phone||'не указан' }}", "{{ w.phone||'не указан' }}")
              s = s[:waiter_block.start()] + block + s[waiter_block.end():]

          # Ensure cook phone field is visible in the create-staff modal.
          s = s.replace("<div class=\"field\" v-if=\"createStaffType!=='cook'\"><label>Телефон</label>", "<div class=\"field\"><label>Телефон</label>")

          if 'copyCookAccess: function' not in s:
              marker = "    copyCourierAccess: function(c) {"
              method = "    copyCookAccess: function(c) { this.copyText('Вход для повара '+c.name+'\\nСайт: '+location.origin+'/cook.html\\nКод заведения: '+this.venue.slug+'\\n\\nНажмите «🔄 PIN» чтобы сгенерировать новый PIN.'); },\n"
              s = s.replace(marker, method + marker, 1)

          # Navigation: replace the old cooks tab with Personnel + Cooks.
          old_nav = '<button v-bind:class="{on:tab===\'staff\'}" v-on:click="tab=\'staff\'">Повара</button>'
          if old_nav in s and '👥 Персонал' not in s:
              new_nav = '<button v-bind:class="{on:tab===\'staff\'}" v-on:click="tab=\'staff\';loadStaffAnalytics()">👥 Персонал</button>\n<button v-bind:class="{on:tab===\'cooks\'}" v-on:click="tab=\'cooks\'">👨‍🍳 Повара</button>'
              s = s.replace(old_nav, new_nav, 1)

          # If the old staff tab still owns the cook panel, rename that first panel to cooks.
          if '👥 Персонал' in s and '<div v-if="tab===\'cooks\'">' not in s:
              cook_heading = "<div v-if=\"tab==='staff'\">\n<div class=\"glass card\" style=\"margin-bottom:14px\"><div class=\"row\">\n<button class=\"btn btn-green btn-sm\" v-on:click=\"openCreateStaff('cook')\""
              pos = s.find(cook_heading)
              if pos >= 0:
                  s = s[:pos] + s[pos:].replace('<div v-if="tab=\'staff\'">', '<div v-if="tab=\'cooks\'">', 1)

          # Insert the standalone personnel dashboard once, immediately before the cook panel.
          if 'PERSONNEL_TAB_INSERTED_FINAL' not in s:
              marker = '<div v-if="tab=\'cooks\'">'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('Cook tab marker not found after navigation patch')

              panel = r'''<!-- PERSONNEL_TAB_INSERTED_FINAL -->
<div v-if="tab==='staff'" class="personnel-tab">
  <div class="glass card" style="margin-bottom:14px">
    <div class="spread" style="margin-bottom:12px">
      <div>
        <h3 style="margin:0">👥 Персонал</h3>
        <div class="muted" style="font-size:12px;margin-top:4px">Производительность и аналитика персонала</div>
      </div>
      <div class="row">
        <span class="muted" style="font-size:12px">Период:</span>
        <select v-model="staffAnalyticsDays" v-on:change="loadStaffAnalytics" style="width:auto">
          <option value="7">7 дней</option>
          <option value="30">30 дней</option>
          <option value="90">90 дней</option>
        </select>
        <button class="btn btn-ghost btn-sm" v-on:click="loadStaffAnalytics">↻ Обновить</button>
      </div>
    </div>
  </div>

  <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px">
    <div class="glass stat"><div class="num">{{ cooks.length }}</div><div class="lbl">Повара</div></div>
    <div class="glass stat"><div class="num">{{ couriers.length }}</div><div class="lbl">Курьеры</div></div>
    <div class="glass stat"><div class="num">{{ waiters.length }}</div><div class="lbl">Официанты</div></div>
  </div>

  <div class="row" style="align-items:stretch;flex-wrap:wrap;gap:14px">
    <div class="glass card" style="flex:1;min-width:300px">
      <h4 style="margin:0 0 10px">👨‍🍳 Повара</h4>
      <table class="tbl">
        <tr><th>Имя</th><th>Заказов</th><th>Ср. время</th><th>Выручка</th></tr>
        <tr v-for="c in staffAnalytics.cooks" v-bind:key="'person-cook-'+c.name">
          <td>{{ c.name }}</td><td>{{ c.orders_count }}</td><td>{{ c.avg_time_min }} мин</td><td>{{ fmt(c.revenue) }} ₽</td>
        </tr>
        <tr v-if="!staffAnalytics.cooks.length"><td colspan="4" class="muted">Нет данных за выбранный период</td></tr>
      </table>
    </div>

    <div class="glass card" style="flex:1;min-width:300px">
      <h4 style="margin:0 0 10px">🚗 Курьеры</h4>
      <table class="tbl">
        <tr><th>Имя</th><th>Доставок</th><th>Выручка</th></tr>
        <tr v-for="c in staffAnalytics.couriers" v-bind:key="'person-courier-'+c.name">
          <td>{{ c.name }}</td><td>{{ c.deliveries_count }}</td><td>{{ fmt(c.revenue) }} ₽</td>
        </tr>
        <tr v-if="!staffAnalytics.couriers.length"><td colspan="3" class="muted">Нет данных за выбранный период</td></tr>
      </table>
    </div>

    <div class="glass card" style="flex:1;min-width:300px">
      <h4 style="margin:0 0 10px">🤵 Официанты</h4>
      <table class="tbl">
        <tr><th>Имя</th><th>Выдач</th><th>Выручка</th></tr>
        <tr v-for="w in staffAnalytics.waiters" v-bind:key="'person-waiter-'+w.name">
          <td>{{ w.name }}</td><td>{{ w.served_count }}</td><td>{{ fmt(w.revenue) }} ₽</td>
        </tr>
        <tr v-if="!staffAnalytics.waiters.length"><td colspan="3" class="muted">Нет данных за выбранный период</td></tr>
      </table>
    </div>
  </div>
</div>

'''
              s = s[:pos] + panel + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate manager personnel structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('manager.html').read_text(encoding='utf-8')
          assert "👥 Персонал" in s
          assert "tab==='staff'" in s
          assert "tab==='cooks'" in s
          assert "PERSONNEL_TAB_INSERTED_FINAL" in s
          assert "manager_staff_performance" in s
          assert "v-for=\"c in cooks\"" in s
          assert "{{ c.phone||'не указан' }}" in s
          print('FINAL PERSONNEL STRUCTURE OK')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manager.html .github/workflows
          git commit -m 'Fix manager personnel tab permanently [manager-personnel-final]'
          git push
