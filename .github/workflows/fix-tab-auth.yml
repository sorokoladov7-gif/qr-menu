name: Fix tab-local auth isolation

on:
  push:
    branches: [main]

env:
  FILE: js/config.js

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch auth storage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/config.js")
          s = p.read_text(encoding="utf-8")
          old = "const baseDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);"
          new = """const __qrRoleMatch = location.pathname.toLowerCase().match(/\\/(admin|manager|cook|courier|waiter)\\.html$/i);
          const __qrRole = __qrRoleMatch ? __qrRoleMatch[1].toLowerCase() : 'public';
          const __qrAuthStorage = window.sessionStorage;
          const __qrAuthKey = 'qr-menu-auth-' + __qrRole;
          const baseDb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
              storage: __qrAuthStorage,
              storageKey: __qrAuthKey
            }
          });"""
          if old not in s:
              raise SystemExit("auth client line not found")
          s = s.replace(old, new, 1)
          replacements = {
              "localStorage.getItem(roleKey)": "sessionStorage.getItem(roleKey)",
              "localStorage.getItem('staff_token')": "sessionStorage.getItem('staff_token')",
              "localStorage.setItem('staff_token',token)": "sessionStorage.setItem('staff_token',token)",
              "localStorage.setItem(type+'_token',token)": "sessionStorage.setItem(type+'_token',token)",
              "localStorage.setItem(type+'_session',JSON.stringify({venueId:data.venueId,venueName:data.venueName,staffName:data.staffName,token:data.token}))": "sessionStorage.setItem(type+'_session',JSON.stringify({venueId:data.venueId,venueName:data.venueName,staffName:data.staffName,token:data.token}))",
              "localStorage.setItem(staffType+'_login_context',JSON.stringify({slug:slug}))": "sessionStorage.setItem(staffType+'_login_context',JSON.stringify({slug:slug}))",
              "localStorage.getItem(type+'_login_context')": "sessionStorage.getItem(type+'_login_context')",
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- js/config.js; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git commit -m "Isolate cabinet auth sessions per browser tab"
          git push