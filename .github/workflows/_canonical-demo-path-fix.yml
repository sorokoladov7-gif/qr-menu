name: canonical demo path fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-demo-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining internal staff demo references
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'src/pages/auth/register.html': [("location.href='demo-staff.html?role='", "location.href='/src/pages/staff/demo-staff.html?role='")],
              'src/pages/guest/index.html': [('href="demo-staff.html"', 'href="/src/pages/staff/demo-staff.html"')],
          }
          changed = []
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text()
              old = s
              for a, b in pairs:
                  s = s.replace(a, b)
              if s != old:
                  p.write_text(s)
                  changed.append(name)
          if not changed:
              print('No changes needed')
              raise SystemExit(0)
          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add', *changed], check=True)
          subprocess.run(['git','commit','-m','fix: canonicalize internal staff demo paths [canonical-demo-fix]'], check=True)
          subprocess.run(['git','push'], check=True)
          PY
