name: Install Hall Tables tab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch config.js
        shell: python
        run: |
          from pathlib import Path
          p=Path('js/config.js')
          s=p.read_text(encoding='utf-8')
          if 'data-manager-hall-tab' in s:
              print('already installed')
              raise SystemExit(0)
          marker="(function(){\n  'use strict';\n  if(!/\\/manager\\.html$/i.test(location.pathname))return;"
          if marker not in s:
              raise SystemExit('manager hall marker not found')
          code=r'''\n  (function(){\n    function installHallTab(){\n      document.querySelectorAll('.tabs').forEach(function(tabs){\n        if(tabs.querySelector('[data-manager-hall-tab]')) return;\n        var ref=Array.prototype.slice.call(tabs.querySelectorAll('button')).find(function(b){return /Тарифы/.test(b.textContent||'');});\n        var b=document.createElement('button');\n        b.type='button'; b.setAttribute('data-manager-hall-tab','1');\n        b.textContent='🪑 Зал / Столы'; b.title='Управление залом и столами';\n        b.onclick=function(){var x=document.getElementById('manager-hall-btn'); if(x)x.click();};\n        if(ref)tabs.insertBefore(b,ref);else tabs.appendChild(b);\n      });\n    }\n    installHallTab();\n    new MutationObserver(installHallTab).observe(document.body,{childList:true,subtree:true});\n  })();\n'''
          p.write_text(s.replace(marker,marker+code,1),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/config.js
          git diff --cached --quiet || (git commit -m 'Add Hall Tables tab to manager navigation' && git push origin main)
