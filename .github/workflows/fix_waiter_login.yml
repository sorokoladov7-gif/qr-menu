name: Fix waiter login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[waiter-login-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch waiter login and session restore
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('waiter.html')
          s=p.read_text(encoding='utf-8')

          # The page must restore the successful staff session from tab-local storage.
          s=s.replace(
              "const state={token:localStorage.getItem('staff_token')||'',session:null,",
              "const state={token:sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||'',session:(()=>{try{return JSON.parse(sessionStorage.getItem('waiter_session')||'null')}catch(e){return null}})(),"
          )

          s=s.replace(
              "localStorage.setItem('staff_token',r.token);localStorage.setItem('waiter_session',JSON.stringify(state.session));",
              "sessionStorage.setItem('waiter_token',r.token);sessionStorage.setItem('staff_token',r.token);sessionStorage.setItem('waiter_session',JSON.stringify(state.session));"
          )

          s=s.replace(
              "['staff_token','waiter_session','waiter_tab'].forEach(k=>localStorage.removeItem(k));",
              "['staff_token','waiter_token','waiter_session','waiter_tab'].forEach(k=>sessionStorage.removeItem(k));"
          )

          marker='<script data-qr-waiter-direct-login>'
          if marker not in s:
              inject=r'''<script data-qr-waiter-direct-login>
          (() => {
            const SUPA_URL='https://ulxfsozdryqrnlxzlblt.supabase.co';
            const SUPA_KEY='sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq';
            const client=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});
            function install(){
              const btn=document.getElementById('go'), slug=document.getElementById('slug'), pin=document.getElementById('pin');
              if(!btn||!slug||!pin){setTimeout(install,150);return;}
              if(btn.dataset.qrWaiterDirectLogin==='1')return;
              btn.dataset.qrWaiterDirectLogin='1';
              btn.onclick=async(e)=>{
                e&&e.preventDefault();
                btn.disabled=true;btn.textContent='Проверяем...';
                const err=document.querySelector('#app .err, #app [style*="f87171"]');
                const s=String(slug.value||'').trim().toLowerCase();
                const p=String(pin.value||'').replace(/\s+/g,'').trim();
                try{
                  if(!s)throw new Error('Введите код заведения');
                  if(!/^\d{4}$/.test(p))throw new Error('PIN должен состоять из 4 цифр');
                  const r=await client.rpc('staff_login',{p_type:'waiter',p_slug:s,p_pin:p});
                  if(r.error||!r.data||r.data.error){
                    let m=(r.error&&r.error.message)||(r.data&&r.data.error)||'Не удалось войти';
                    m=String(m);
                    if(m.includes('wrong_pin'))m='Неверный PIN';
                    else if(m.includes('venue_not_found'))m='Заведение не найдено или неактивно';
                    else if(m.includes('slug_or_pin_required'))m='Не передан код заведения или PIN';
                    throw new Error(m);
                  }
                  const sess={token:r.data.token,venueId:r.data.venueId,venueName:r.data.venueName,staffName:r.data.staffName};
                  sessionStorage.setItem('waiter_token',r.data.token);
                  sessionStorage.setItem('staff_token',r.data.token);
                  sessionStorage.setItem('waiter_session',JSON.stringify(sess));
                  sessionStorage.setItem('waiter_tab','overview');
                  location.reload();
                }catch(x){
                  if(err)err.textContent=x.message||'Ошибка входа'; else alert(x.message||'Ошибка входа');
                  btn.disabled=false;btn.textContent='Войти';
                }
              };
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
          })();
          </script>'''
              s=s.replace('</body>',inject+'\n</body>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired waiter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add waiter.html .github/workflows/fix_waiter_login.yml
          git commit -m 'Fix waiter login direct RPC [waiter-login-fixed]' || exit 0
          git push
