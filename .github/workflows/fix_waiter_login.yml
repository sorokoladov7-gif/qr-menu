name: Fix waiter login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[waiter-session-restore-v2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch waiter login and session restore
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('waiter.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const state={token:localStorage.getItem('staff_token')||'',session:null,", "const state={token:sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||'',session:(()=>{try{return JSON.parse(sessionStorage.getItem('waiter_session')||'null')}catch(e){return null}})(),")
          s=s.replace("localStorage.setItem('staff_token',r.token);localStorage.setItem('waiter_session',JSON.stringify(state.session));", "sessionStorage.setItem('waiter_token',r.token);sessionStorage.setItem('staff_token',r.token);sessionStorage.setItem('waiter_session',JSON.stringify(state.session));")
          s=s.replace("try{state.session=JSON.parse(localStorage.getItem('waiter_session')||'null')}catch(e){}", "try{state.session=JSON.parse(sessionStorage.getItem('waiter_session')||'null')}catch(e){}")
          s=s.replace("localStorage.setItem('waiter_tab',t)", "sessionStorage.setItem('waiter_tab',t)")
          s=s.replace("localStorage.getItem('waiter_tab')", "sessionStorage.getItem('waiter_tab')")
          s=s.replace("['staff_token','waiter_session','waiter_tab'].forEach(k=>localStorage.removeItem(k));", "['staff_token','waiter_token','waiter_session','waiter_tab'].forEach(k=>sessionStorage.removeItem(k));")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired waiter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add waiter.html .github/workflows/fix_waiter_login.yml
          git commit -m 'Fix waiter session restore [waiter-session-restore-v2]' || exit 0
          git push
