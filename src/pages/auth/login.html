<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в QR-Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shared/common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
<style>
[v-cloak]{display:none}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#060a14;color:#fff;min-height:100vh;overflow-x:hidden}
.page-loader{position:fixed;inset:0;z-index:99999;background:#060a14;display:grid;place-items:center;transition:opacity .8s ease,visibility .8s ease}.page-loader.hide{opacity:0;visibility:hidden;pointer-events:none}.page-loader .loader-logo{font-size:48px;font-weight:800;background:linear-gradient(135deg,#6366f1,#818cf8,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent;animation:loaderLogoPulse 2s ease-in-out infinite}@keyframes loaderLogoPulse{0%,100%{opacity:.4;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}.page-loader .loader-bar{width:180px;height:3px;background:rgba(255,255,255,.06);border-radius:3px;margin:20px auto 0;overflow:hidden}.page-loader .loader-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,#6366f1,#06b6d4);border-radius:3px;animation:loaderSlide 1.2s ease-in-out infinite}@keyframes loaderSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
.orb-container{position:fixed;inset:0;pointer-events:none;z-index:0}.floating-orb{position:absolute;border-radius:50%;filter:blur(80px)}.floating-orb.o1{width:500px;height:500px;background:rgba(99,102,241,.12);top:-15%;right:-10%;animation:orbA 20s ease-in-out infinite}.floating-orb.o2{width:400px;height:400px;background:rgba(6,182,212,.1);bottom:-10%;left:-10%;animation:orbB 22s ease-in-out infinite 2s}.floating-orb.o3{width:300px;height:300px;background:rgba(139,92,246,.08);top:50%;left:50%;animation:orbC 18s ease-in-out infinite 4s}@keyframes orbA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.15)}}@keyframes orbB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.1)}}@keyframes orbC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.2)}}
.grid-pattern{position:fixed;inset:0;pointer-events:none;z-index:1;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;animation:gridShift 30s linear infinite}@keyframes gridShift{0%{transform:translate(0,0)}100%{transform:translate(60px,60px)}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.particles{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}.particle{position:absolute;border-radius:50%;animation:particleFloat linear infinite;opacity:0}@keyframes particleFloat{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) rotate(720deg);opacity:0}}.footer-glow{position:fixed;bottom:0;left:0;right:0;height:1px;z-index:3;background:linear-gradient(90deg,transparent,#6366f1,#06b6d4,transparent);opacity:.4;animation:footerGlow 4s ease-in-out infinite}@keyframes footerGlow{0%,100%{opacity:.2}50%{opacity:.6}}.main-layer{position:relative;z-index:10}.topbar{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;animation:slideDown .6s cubic-bezier(.22,1,.36,1) both}@keyframes slideDown{from{transform:translateY(-40px);opacity:0;filter:blur(4px)}to{transform:translateY(0);opacity:1;filter:blur(0)}}.topbar .brand{display:flex;align-items:center;gap:10px}.topbar .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#818cf8);display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 4px 20px rgba(99,102,241,.3);animation:logoSpin 12s linear infinite}@keyframes logoSpin{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.glass.box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:32px;backdrop-filter:blur(20px);position:relative;opacity:0;transform:translateY(40px) scale(.96);animation:cardReveal .8s cubic-bezier(.22,1,.36,1) .3s forwards;transition:transform .3s,box-shadow .3s,border-color .3s}.glass.box:hover{transform:translateY(-2px);box-shadow:0 20px 60px rgba(0,0,0,.2);border-color:rgba(99,102,241,.2)}.glass.box::before{content:'';position:absolute;inset:-1px;border-radius:20px;z-index:-1;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(6,182,212,.15),rgba(139,92,246,.15));background-size:300% 300%;animation:borderGlow 6s ease-in-out infinite;opacity:0;transition:opacity .4s}.glass.box:hover::before{opacity:1}@keyframes cardReveal{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes borderGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}.glass.box h2{text-align:center;margin-top:0;background:linear-gradient(135deg,#fff,#c7d2fe);-webkit-background-clip:text;background-clip:text;color:transparent;animation:headingIn .6s ease-out .5s both}@keyframes headingIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}.field{margin-bottom:16px;opacity:0;animation:fieldIn .5s ease-out forwards}.field:nth-child(2){animation-delay:.55s}.field:nth-child(3){animation-delay:.65s}@keyframes fieldIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}.field label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;transition:color .25s}.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-size:15px;font-family:inherit;transition:all .3s cubic-bezier(.22,1,.36,1)}.field input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2),0 4px 16px rgba(99,102,241,.1);transform:translateY(-1px)}.field:focus-within label{color:#818cf8}.btn{border:0;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px;transition:all .25s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}.btn:active:not(:disabled){transform:scale(.95)}.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.1)}.btn-ghost:hover{background:rgba(255,255,255,.1)}.btn-primary{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.3)}.btn-primary:hover{box-shadow:0 8px 30px rgba(99,102,241,.45);transform:translateY(-2px)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}#loginButton{width:100%;margin-top:16px;font-size:15px;padding:14px;opacity:0;animation:submitIn .5s ease-out .75s forwards}@keyframes submitIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}#loginButton .shimmer{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 3s ease-in-out infinite}@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}.ani-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.25);transform:scale(0);animation:ripple .7s ease-out forwards;pointer-events:none}@keyframes ripple{to{transform:scale(5);opacity:0}}.msg{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;animation:msgIn .4s cubic-bezier(.34,1.56,.64,1)}@keyframes msgIn{from{opacity:0;transform:translateY(-8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}.msg.error{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}.msg.ok{background:rgba(16,185,129,.12);color:#6ee7b7;border:1px solid rgba(16,185,129,.2)}a.muted{color:#94a3b8;text-decoration:none;transition:color .2s}a.muted:hover{color:#818cf8}.signup-link{text-align:center;margin-top:16px;opacity:0;animation:fadeUp .5s ease-out .85s both}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.glow-dot{position:fixed;width:6px;height:6px;border-radius:50%;background:#6366f1;box-shadow:0 0 12px #6366f1,0 0 30px rgba(99,102,241,.3);pointer-events:none;z-index:5;animation:dotOrbit 8s linear infinite}@keyframes dotOrbit{0%{transform:rotate(0deg) translateX(200px) rotate(0deg)}100%{transform:rotate(360deg) translateX(200px) rotate(-360deg)}}@media(max-width:480px){.glass.box{padding:22px;border-radius:16px;margin:0 8px}}
</style>
</head>
<body>
<div class="page-loader" id="pageLoader"><div style="text-align:center"><div class="loader-logo">QR</div><div class="loader-bar"></div></div></div>
<div class="orb-container"><div class="floating-orb o1"></div><div class="floating-orb o2"></div><div class="floating-orb o3"></div></div><div class="grid-pattern"></div><div class="particles" id="particles"></div><div class="footer-glow"></div><div class="glow-dot" style="top:30%;left:20%"></div><div class="glow-dot" style="bottom:25%;right:15%;animation-delay:-4s;background:#06b6d4;box-shadow:0 0 12px #06b6d4"></div>
<div class="main-layer"><div class="topbar"><div class="brand"><div class="logo">QR</div><span>OS QR-Menu</span></div><div><a href="/register.html" class="btn btn-ghost" style="font-size:12px">Регистрация</a></div></div>
<div id="app" v-cloak style="max-width:400px;margin:40px auto;padding:0 16px"><div class="glass box"><h2>Вход в систему</h2><div v-if="msg" class="msg" :class="msgType" style="margin-bottom:16px">{{ msg }}</div><div class="field"><label>Email</label><input v-model.trim="lform.email" type="email" placeholder="manager@qr-menu.ru" :disabled="busy" autocomplete="username"></div><div class="field"><label>Пароль</label><input v-model.trim="lform.password" type="password" placeholder="••••••••" :disabled="busy" autocomplete="current-password"></div><button id="loginButton" class="btn btn-primary" @click="login" :disabled="busy" style="position:relative"><span class="shimmer"></span>{{ busy ? 'Входим...' : 'Войти' }}</button><div class="signup-link"><a href="/register.html" class="muted">Нет аккаунта? Зарегистрироваться</a></div></div></div></div>
<script>
(function(){var pc=document.getElementById('particles');for(var i=0;i<18;i++){var p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(10+Math.random()*15)+'s';p.style.animationDelay=(Math.random()*10)+'s';var s=2+Math.random()*3;p.style.width=p.style.height=s+'px';var colors=['rgba(99,102,241,.4)','rgba(6,182,212,.4)','rgba(139,92,246,.3)'];p.style.background=colors[Math.floor(Math.random()*3)];pc.appendChild(p)}})();
window.addEventListener('load',function(){setTimeout(function(){var el=document.getElementById('pageLoader');if(el)el.classList.add('hide')},600)});
document.addEventListener('click',function(e){var btn=e.target.closest('.btn');if(!btn)return;var r=document.createElement('span');r.className='ani-ripple';var rect=btn.getBoundingClientRect();var sz=Math.max(rect.width,rect.height);r.style.width=r.style.height=sz+'px';r.style.left=(e.clientX-rect.left-sz/2)+'px';r.style.top=(e.clientY-rect.top-sz/2)+'px';btn.appendChild(r);setTimeout(function(){r.remove()},700)});

Vue.createApp({
  data:function(){return{busy:false,msg:'',msgType:'',redirecting:false,lform:{email:'',password:''}}},
  methods:{
    showError:function(message){this.msg=message||'Неизвестная ошибка входа';this.msgType='error';this.busy=false;this.redirecting=false},
    routeByRole:async function(userId){
      if(!userId)throw new Error('Supabase не вернул ID пользователя');
      var r=await this.withTimeout(window.db.from('profiles').select('id,role').eq('id',userId).maybeSingle(),'Загрузка профиля',10000);
      if(r.error)throw new Error('Ошибка профиля: '+r.error.message);
      if(!r.data)throw new Error('Профиль пользователя не найден');
      var target=r.data.role==='admin'?'/admin.html':'/manager.html';
      this.redirecting=true;
      window.location.replace(target);
    },
    withTimeout:function(promise,stage,ms){return Promise.race([promise,new Promise(function(_,reject){setTimeout(function(){reject(new Error(stage+' превысила допустимое время ожидания'))},ms)})])},
    login:async function(){
      this.msg='';this.msgType='';
      if(!this.lform.email||!this.lform.password){this.msg='Заполните email и пароль';this.msgType='error';return}
      this.busy=true;
      try{
        if(!window.db||!window.db.auth)throw new Error('Клиент авторизации не инициализирован. Обновите страницу.');
        var r=await this.withTimeout(window.db.auth.signInWithPassword({email:this.lform.email,password:this.lform.password}),'Авторизация',15000);
        if(r.error)throw r.error;
        if(!r.data||!r.data.user)throw new Error('Пользователь не был возвращён после авторизации');
        await this.routeByRole(r.data.user.id);
      }catch(e){console.error('[QR-Menu login]',e);this.showError(e&&e.message?e.message:String(e))}
    },
    restoreSession:async function(){
      if(!window.db||!window.db.auth){this.showError('Клиент авторизации не инициализирован.');return}
      try{
        var r=await this.withTimeout(window.db.auth.getSession(),'Проверка сессии',8000);
        if(r.error)throw r.error;
        if(r.data&&r.data.session&&r.data.session.user){this.busy=true;await this.routeByRole(r.data.session.user.id)}
      }catch(e){console.error('[QR-Menu session]',e);this.showError('Ошибка восстановления сессии: '+(e.message||e))}
    }
  },
  mounted:function(){this.restoreSession()}
}).mount('#app');
</script>
</body>
</html>
