<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зал — QR-Menu</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#070b14;--surface:#0d1422;--card:#111a2a;--line:rgba(255,255,255,.1);--muted:#8fa0b8;--blue:#2563eb;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1600px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:14px}.title{font-size:23px;font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:#172236;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800}.btn:hover{filter:brightness(1.12)}.primary{background:var(--blue);border-color:#3b82f6}.danger{background:#7f1d1d}.error{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.35);color:#fecaca;padding:12px 14px;border-radius:12px;margin:10px 0}.hidden{display:none!important}
.board-shell{border:1px solid var(--line);border-radius:20px;background:#0a111e;overflow:auto;box-shadow:0 20px 70px rgba(0,0,0,.3)}.board{position:relative;width:1500px;height:760px;background-color:#0d1728;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:32px 32px;transform-origin:0 0}.board-label{position:absolute;left:25px;top:20px;color:#64748b;font-size:12px;letter-spacing:1.5px;font-weight:800}.table-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;border:2px solid rgba(255,255,255,.35);box-shadow:0 12px 32px rgba(0,0,0,.35);font-weight:800}.table-node:active{cursor:grabbing}.table-node.free{background:rgba(34,197,94,.18);border-color:#22c55e}.table-node.reserved{background:rgba(245,158,11,.2);border-color:#f59e0b}.table-node.occupied{background:rgba(239,68,68,.2);border-color:#ef4444}.table-node.blocked,.table-node.maintenance{background:rgba(100,116,139,.2);border-color:#64748b}.round{width:96px;height:96px;border-radius:50%}.square{width:100px;height:100px;border-radius:15px}.rectangle{width:160px;height:88px;border-radius:15px}.num{font-size:17px}.name{font-size:11px;max-width:135px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#cbd5e1;margin-top:2px}.legend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 2px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.section-head h3{margin:0;font-size:17px}.section-head span{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;cursor:pointer}.card:hover{border-color:rgba(96,165,250,.55);transform:translateY(-1px)}.card-head{display:flex;justify-content:space-between;align-items:center}.card-num{font-weight:900;font-size:17px}.badge{font-size:11px;border-radius:999px;padding:5px 9px}.badge.free{color:#86efac;background:rgba(34,197,94,.12)}.badge.reserved{color:#fcd34d;background:rgba(245,158,11,.12)}.badge.occupied{color:#fca5a5;background:rgba(239,68,68,.12)}.badge.blocked,.badge.maintenance{color:#cbd5e1;background:rgba(100,116,139,.12)}.card-name{color:var(--muted);font-size:12px;margin:5px 0 10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0a111e;border-radius:10px;padding:9px;font-size:11px;color:var(--muted)}.stat b{display:block;color:#fff;font-size:14px;margin-top:2px}.qrrow{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.qr{width:76px;height:76px;background:#fff;border-radius:8px;padding:4px}.qr img,.qr canvas{width:68px!important;height:68px!important}.qrtext{font-size:11px;color:var(--muted);line-height:1.45}.empty{text-align:center;color:var(--muted);padding:70px 20px;grid-column:1/-1}
.panel-back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;display:flex;justify-content:flex-end}.panel{height:100%;width:min(430px,100%);background:#111827;border-left:1px solid var(--line);padding:20px;overflow:auto;box-shadow:-20px 0 70px rgba(0,0,0,.45)}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0a111e;color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions .btn{width:100%}.qr-big{display:flex;justify-content:center;margin:18px 0}.qr-big>div{background:#fff;padding:12px;border-radius:10px}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(430px,100%);background:#111827;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.6)}.modal h2{margin-top:0}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions .btn{flex:1}.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:#182235;border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:0 15px 50px rgba(0,0,0,.4)}
@media(max-width:700px){.wrap{padding:10px}.top{display:block}.toolbar{margin-top:12px}.board{width:1200px;height:680px}.cards{grid-template-columns:1fr}.panel{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title" id="title">План зала</div><div class="sub">Перетаскивайте столы. Нажмите на стол для редактирования.</div></div><div class="toolbar"><button class="btn primary" id="addBtn">＋ Добавить стол</button><button class="btn" id="refreshBtn">↻ Обновить</button><button class="btn" id="zoomOut">−</button><span id="zoomLabel" class="sub">100%</span><button class="btn" id="zoomIn">＋</button></div></div>
  <div id="error" class="error hidden"></div>
  <div class="board-shell"><div id="board" class="board"><div class="board-label">ПЛАН ЗАЛА</div></div></div>
  <div class="legend"><span><i class="dot" style="background:#22c55e"></i>Свободен</span><span><i class="dot" style="background:#f59e0b"></i>Резерв</span><span><i class="dot" style="background:#ef4444"></i>Занят</span><span><i class="dot" style="background:#64748b"></i>Недоступен</span></div>
  <div class="section-head"><h3>Столы и QR-коды</h3><span id="countLabel"></span></div>
  <div id="cards" class="cards"></div>
</div>
<div id="panelBack" class="panel-back hidden"><div id="panel" class="panel"></div></div>
<div id="addBack" class="modal-back hidden"><div class="modal"><h2>Добавить стол</h2><div class="field"><label>Номер</label><input id="newNumber" type="number" min="1"></div><div class="field"><label>Название</label><input id="newName" placeholder="Стол 1"></div><div class="field"><label>Форма</label><select id="newShape"><option value="round">Круг</option><option value="square">Квадрат</option><option value="rectangle">Прямоугольник</option></select></div><div class="field"><label>Мест</label><input id="newSeats" type="number" min="1" value="4"></div><div id="addError" class="error hidden"></div><div class="modal-actions"><button class="btn" id="cancelAdd">Отмена</button><button class="btn primary" id="createBtn">Создать стол</button></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
const db=window.db;
const $=id=>document.getElementById(id);
let venueId='';let tables=[];let selected=null;let zoom=1;
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function errText(e){const s=String(e&&e.message||e||'');if(s.includes('not_allowed')||s.includes('not_authorized'))return'Нет прав для управления выбранным заведением. Откройте раздел «Зал» из кабинета управляющего заново.';if(s.includes('table_number_exists')||s.includes('duplicate'))return'Стол с таким номером уже существует.';if(s.includes('invalid_shape'))return'Недопустимая форма стола.';if(s.includes('invalid_table'))return'Проверьте номер и количество мест.';return s||'Неизвестная ошибка.';}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=> $('toast').classList.add('hidden'),2600);}
function showError(msg){$('error').textContent=msg;$('error').classList.toggle('hidden',!msg);}
function getVenue(){try{const q=new URLSearchParams(location.search).get('venue');if(q)return q;}catch(e){}return localStorage.getItem('manager_venue_id')||localStorage.getItem('selectedVenueId')||'';}
function normalize(t){return Object.assign({},t,{shape:['round','square','rectangle'].includes(t.shape)?t.shape:'square',status:t.occupancy_status||t.status||'free',seats:Number(t.seats||4),x:Number(t.pos_x??t.x??40),y:Number(t.pos_y??t.y??40),guest_count:Number(t.guest_count||t.session_guest_count||0),order_count:Number(t.order_count||0),total_amount:Number(t.total_amount||0)});}
async function load(){showError('');venueId=getVenue();if(!venueId){$('title').textContent='Заведение не выбрано';$('cards').innerHTML='<div class="empty">Откройте «Зал» из кабинета управляющего.</div>';return;}localStorage.setItem('manager_venue_id',venueId);const r=await db.rpc('manager_table_board',{p_venue_id:venueId});if(r.error){showError(errText(r.error));return;}let data=r.data;tables=(Array.isArray(data)?data:(data&&data.tables)||[]).map(normalize);$('countLabel').textContent=tables.length+' '+plural(tables.length,['стол','стола','столов']);render();}
function plural(n,a){const x=n%100;if(x>=11&&x<=14)return a[2];const y=n%10;return y===1?a[0]:y>=2&&y<=4?a[1]:a[2];}
function statusName(s){return s==='occupied'?'Занят':s==='reserved'?'Резерв':(s==='blocked'||s==='maintenance')?'Недоступен':'Свободен';}
function render(){renderBoard();renderCards();}
function renderBoard(){const b=$('board');b.querySelectorAll('.table-node').forEach(x=>x.remove());tables.forEach(t=>{const n=document.createElement('div');n.className='table-node '+t.shape+' '+t.status;n.style.left=t.x+'px';n.style.top=t.y+'px';n.dataset.id=t.id;n.innerHTML='<div class="num">№'+esc(t.table_number)+'</div><div class="name">'+esc(t.name||'')+'</div><div class="meta">'+t.guest_count+'/'+t.seats+' мест</div>';n.addEventListener('pointerdown',e=>startDrag(e,n,t));b.appendChild(n);});b.style.transform='scale('+zoom+')';}
function renderCards(){const c=$('cards');c.innerHTML='';if(!tables.length){c.innerHTML='<div class="empty">Столов пока нет. Нажмите «＋ Добавить стол».</div>';return;}tables.forEach(t=>{const el=document.createElement('div');el.className='card';el.innerHTML='<div class="card-head"><div class="card-num">Стол №'+esc(t.table_number)+'</div><span class="badge '+t.status+'">'+statusName(t.status)+'</span></div><div class="card-name">'+esc(t.name||'Без названия')+'</div><div class="stats"><div class="stat">Места<b>'+t.seats+'</b></div><div class="stat">Гостей<b>'+t.guest_count+'</b></div><div class="stat">Заказов<b>'+t.order_count+'</b></div><div class="stat">Сумма<b>'+t.total_amount.toLocaleString('ru-RU')+' ₽</b></div></div><div class="qrrow"><div class="qr" id="qr-'+t.id+'"></div><div class="qrtext">'+(t.qr_token?'QR закреплён':'QR не создан')+'<br>Нажмите карточку для управления</div></div>';el.onclick=()=>openPanel(t);c.appendChild(el);if(t.qr_token)new QRCode(document.getElementById('qr-'+t.id),{text:location.origin+'/menu-v2.html?table='+encodeURIComponent(t.qr_token),width:68,height:68,colorDark:'#111827',colorLight:'#fff'});});}
function startDrag(e,node,t){if(e.button!==undefined&&e.button!==0)return;const sx=e.clientX,sy=e.clientY,ox=t.x,oy=t.y;let moved=false;node.setPointerCapture(e.pointerId);const move=ev=>{const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;node.style.left=Math.max(0,Math.round((ox+dx)/16)*16)+'px';node.style.top=Math.max(0,Math.round((oy+dy)/16)*16)+'px';};const up=async()=>{node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',up);if(!moved){openPanel(t);return;}const x=parseInt(node.style.left,10),y=parseInt(node.style.top,10);const r=await db.rpc('manager_move_table',{p_venue_id:venueId,p_table_id:t.id,p_x:x,p_y:y});if(r.error){showError(errText(r.error));render();return;}t.x=x;t.y=y;toast('Положение стола сохранено');renderCards();};node.addEventListener('pointermove',move);node.addEventListener('pointerup',up);}
function openPanel(t){selected=t;$('panelBack').classList.remove('hidden');$('panel').innerHTML='<div class="panel-head"><h2>Стол №'+esc(t.table_number)+'</h2><button class="btn" id="closePanel">✕</button></div><div class="sub">'+statusName(t.status)+' · '+t.seats+' мест</div><div class="field"><label>Номер</label><input id="editNumber" type="number" min="1" value="'+esc(t.table_number)+'"></div><div class="field"><label>Название</label><input id="editName" value="'+esc(t.name||'')+'"></div><div class="field"><label>Форма</label><select id="editShape"><option value="round" '+(t.shape==='round'?'selected':'')+'>Круг</option><option value="square" '+(t.shape==='square'?'selected':'')+'>Квадрат</option><option value="rectangle" '+(t.shape==='rectangle'?'selected':'')+'>Прямоугольник</option></select></div><div class="field"><label>Мест</label><input id="editSeats" type="number" min="1" value="'+esc(t.seats)+'"></div><div class="actions"><button class="btn primary" id="saveTable">Сохранить</button><button class="btn" id="regenQr">Обновить QR</button><button class="btn" id="reserve">Резервировать</button><button class="btn" id="seat">Посадить</button><button class="btn" id="release">Освободить</button><button class="btn danger" id="deleteTable">Удалить</button></div><div class="qr-big"><div id="panelQr"></div></div>'+(t.qr_token?'<div class="sub" style="word-break:break-all">QR: '+esc(location.origin+'/menu-v2.html?table='+t.qr_token)+'</div>':'<div class="sub">QR будет создан автоматически после создания/обновления стола.</div>');$('closePanel').onclick=closePanel;$('saveTable').onclick=saveTable;$('regenQr').onclick=regenQr;$('reserve').onclick=()=>setStatus('reserved');$('seat').onclick=()=>setStatus('occupied');$('release').onclick=releaseTable;$('deleteTable').onclick=deleteTable;if(t.qr_token)new QRCode($('panelQr'),{text:location.origin+'/menu-v2.html?table='+encodeURIComponent(t.qr_token),width:190,height:190,colorDark:'#111827',colorLight:'#fff'});}
function closePanel(){$('panelBack').classList.add('hidden');selected=null;}
async function saveTable(){if(!selected)return;const n=Number($('editNumber').value),s=Number($('editSeats').value);const r=await db.rpc('manager_update_table',{p_venue_id:venueId,p_table_id:selected.id,p_number:n,p_name:$('editName').value.trim(),p_shape:$('editShape').value,p_seats:s,p_active:true});if(r.error){showError(errText(r.error));return;}closePanel();toast('Стол сохранён');await load();}
async function regenQr(){if(!selected)return;const r=await db.rpc('manager_regenerate_table_qr',{p_venue_id:venueId,p_table_id:selected.id});if(r.error){showError(errText(r.error));return;}toast('QR-код обновлён');await load();}
async function setStatus(status){if(!selected)return;const r=await db.rpc('manager_set_table_status',{p_venue_id:venueId,p_table_id:selected.id,p_status:status,p_reserved_until:null,p_note:null});if(r.error){showError(errText(r.error));return;}toast(status==='reserved'?'Стол зарезервирован': 'Гость посажен');closePanel();await load();}
async function releaseTable(){if(!selected)return;if(selected.status==='occupied'&&selected.order_count>0){if(!confirm('На столе есть заказы. Освободить стол и закрыть текущую сессию?'))return;}const r=await db.rpc('manager_close_table_session',{p_venue_id:venueId,p_table_id:selected.id});if(r.error){showError(errText(r.error));return;}toast('Стол освобождён');closePanel();await load();}
async function deleteTable(){if(!selected)return;if(selected.status==='occupied'){alert('Нельзя удалить занятый стол. Сначала освободите его.');return;}if(!confirm('Удалить стол №'+selected.table_number+'?'))return;const r=await db.rpc('manager_delete_table',{p_venue_id:venueId,p_table_id:selected.id});if(r.error){showError(errText(r.error));return;}toast('Стол удалён');closePanel();await load();}
function openAdd(){showError('');$('addError').classList.add('hidden');$('newNumber').value=tables.reduce((m,t)=>Math.max(m,Number(t.table_number)||0),0)+1;$('newName').value='';$('newSeats').value=4;$('newShape').value='round';$('addBack').classList.remove('hidden');setTimeout(()=>$('newNumber').focus(),50);}
function closeAdd(){$('addBack').classList.add('hidden');}
async function createTable(){const number=Number($('newNumber').value),seats=Number($('newSeats').value),name=$('newName').value.trim(),shape=$('newShape').value;if(!venueId){$('addError').textContent='Не выбрано заведение. Откройте раздел «Зал» из кабинета управляющего.';$('addError').classList.remove('hidden');return;}if(!number||number<1||!seats||seats<1){$('addError').textContent='Укажите корректный номер и количество мест.';$('addError').classList.remove('hidden');return;}$('createBtn').disabled=true;$('createBtn').textContent='Создание…';const pos=nextPosition();const r=await db.rpc('manager_create_table',{p_venue_id:venueId,p_number:number,p_name:name,p_shape:shape,p_seats:seats,p_x:pos.x,p_y:pos.y});$('createBtn').disabled=false;$('createBtn').textContent='Создать стол';if(r.error){$('addError').textContent=errText(r.error);$('addError').classList.remove('hidden');return;}closeAdd();toast('Стол №'+number+' создан');await load();}
function nextPosition(){const step=150;const idx=tables.length;const col=idx%8,row=Math.floor(idx/8);return{x:50+col*step,y:80+row*125};}
$('addBtn').onclick=openAdd;$('cancelAdd').onclick=closeAdd;$('createBtn').onclick=createTable;$('refreshBtn').onclick=load;$('zoomOut').onclick=()=>{zoom=Math.max(.7,+(zoom-.1).toFixed(1));$('zoomLabel').textContent=Math.round(zoom*100)+'%';renderBoard();};$('zoomIn').onclick=()=>{zoom=Math.min(1.5,+(zoom+.1).toFixed(1));$('zoomLabel').textContent=Math.round(zoom*100)+'%';renderBoard();};$('panelBack').addEventListener('click',e=>{if(e.target===$('panelBack'))closePanel();});$('addBack').addEventListener('click',e=>{if(e.target===$('addBack'))closeAdd();});
load();
})();
</script>
</body>
</html>
