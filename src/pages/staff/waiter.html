<!doctype html>

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="manifest" href="/src/assets/pwa/manifest-waiter.webmanifest">
<link rel="icon" type="image/svg+xml" href="/src/assets/icons/waiter-favicon.svg">
<title>Официант — OS QR-Меню</title>
<script src="https://cdn.jsdelivr.net/npm/@Supabase/supabase-js@2"></script>
<script src="/src/assets/js/shared/config.js"></script>
<script src="/src/assets/js/pwa/pwa-install.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#fff;font:14px system-ui,-apple-system,sans-serif;overflow-x:hidden}

/* ── LOADER ── */
.app-loader{position:fixed;inset:0;z-index:99999;background:#0b1120;display:grid;place-items:center;transition:opacity .5s ease,visibility .5s ease}
.app-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.app-loader .spinner{width:48px;height:48px;border-radius:50%;border:3px solid rgba(99,102,241,.15);border-top-color:#6366f1;animation:loaderSpin .8s linear infinite}
@keyframes loaderSpin{to{transform:rotate(360deg)}}
.app-loader p{margin-top:14px;color:#94a3b8;font-size:13px;font-weight:600;animation:loaderPulse 1.4s ease-in-out infinite}
@keyframes loaderPulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ── BG ORBS ── */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-orbs .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1}
.bg-orbs .orb-1{width:380px;height:380px;background:#6366f1;bottom:-100px;left:-100px;animation:orbA 16s ease-in-out infinite}
.bg-orbs .orb-2{width:300px;height:300px;background:#f59e0b;top:-80px;right:-80px;animation:orbB 14s ease-in-out infinite}
@keyframes orbA{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-40px)}}
@keyframes orbB{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,30px)}}

/* ── NOISE ── */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}

/* ── TOP ── */
.top{position:sticky;top:0;z-index:30;padding:12px 16px;background:#0b1120ee;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center;animation:slideDown .4s ease-out}
@keyframes slideDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}
.wrap{max-width:1200px;margin:auto;padding:16px;position:relative;z-index:2}
.brand{font-weight:800}
.muted{color:#94a3b8;font-size:12px}

/* ── TABS ── */
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 0 16px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid #ffffff12;border-radius:11px;padding:10px 14px;background:#111827;color:#cbd5e1;cursor:pointer;white-space:nowrap;font-weight:700;transition:all .25s ease;position:relative;overflow:hidden}
.tab:hover
.tab:active{transform:scale(.96)}
.tab.on{background:#6366f1;color:#fff;border-color:#818cf8}

/* ── PANELS ── */
.panel{display:none}
.panel.on{display:block;animation:panelIn .4s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{padding:14px;border-radius:14px;background:#111827;border:1px solid #ffffff12;opacity:0;transform:translateY(16px);animation:statReveal .5s ease-out forwards;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stat:nth-child(1){animation-delay:.05s}
.stat:nth-child(2){animation-delay:.12s}
.stat:nth-child(3){animation-delay:.19s}
.stat:nth-child(4){animation-delay:.26s}
@keyframes statReveal{to{opacity:1;transform:translateY(0)}}
.stat b{font-size:22px;display:block}

/* ── GRID & CARDS ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:#111827;border:1px solid #ffffff12;border-radius:16px;padding:14px;cursor:pointer;transition:transform .25s ease,border-color .25s,box-shadow .3s ease;opacity:0;animation:cardIn .4s ease-out forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:#6366f1;box-shadow:0 4px 16px rgba(99,102,241,.12);transform:translateY(-2px)}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;color:#fff;background:#ffffff12;cursor:pointer;transition:transform .2s,box-shadow .25s,background .2s;position:relative;overflow:hidden}
.btn:hover
.btn:active{transform:scale(.95)}
.primary{background:#6366f1}
.primary:hover{box-shadow:0 6px 20px rgba(99,102,241,.35)}
.green{background:#047857}
.green:hover{box-shadow:0 6px 20px rgba(4,120,87,.35)}
.red{background:#991b1b}
.yellow{background:#a16207}
.input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff18;background:#0b1220;color:#fff;margin:5px 0 12px;transition:border-color .25s,box-shadow .25s}
.input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.login{max-width:380px;margin:70px auto;padding:24px;animation:fadeUp .6s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;background:#ffffff10}
.empty{text-align:center;color:#64748b;padding:30px;animation:fadeIn .5s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;flex-wrap:wrap;gap:8px}

/* ── RIPPLE ── */
.btn-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}

/* ── HISTORY CARD ── */
.history-card{padding:12px;border:1px solid #ffffff12;border-radius:12px;background:#0f172a;margin-bottom:10px;transition:transform .25s,border-color .25s,box-shadow .3s;opacity:0;animation:cardIn .4s ease-out forwards;cursor:pointer}
.history-card:hover{border-color:#6366f1;transform:translateY(-2px);box-shadow:0 4px 16px rgba(99,102,241,.1)}
.history-card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.history-card .items{font-size:12px;color:#cbd5e1;margin:6px 0;line-height:1.6}
.history-card .item-line{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #ffffff08}
.history-card .item-line:last-child
.history-card .meta{font-size:11px;color:#94a3b8;display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.history-card .meta span{display:inline-flex;align-items:center;gap:4px}
.order-item-line{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #ffffff06}
.order-item-line:last-child
.refresh-btn{background:#2d3748;color:#fff;border:1px solid #4a5568;transition:transform .2s,background .2s}
.refresh-btn:hover

/* ── MODAL ── */
.modal{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:modalBgIn .3s ease}
@keyframes modalBgIn{from{opacity:0}to{opacity:1}}
.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#111827;border-radius:22px 22px 0 0;padding:18px;animation:sheetUp .35s cubic-bezier(.22,1,.36,1)}
@keyframes sheetUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.product{padding:10px;border:1px solid #ffffff12;border-radius:12px;transition:transform .25s,border-color .25s,box-shadow .25s}
.product:hover{border-color:#6366f1;transform:translateY(-2px);box-shadow:0 4px 12px rgba(99,102,241,.1)}
.detail-modal .sheet{max-width:600px}
.detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}.detail-row:last-child
.detail-total{margin-top:10px;font-weight:700;font-size:16px;color:#a5b4fc}
.detail-meta{font-size:13px;color:#94a3b8;margin-top:8px;line-height:1.6}.detail-meta strong{color:#e2e8f0}

/* ── CALLS ── */
.call-card{padding:12px;border-radius:12px;background:#111827;border:1px solid #ffffff12;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;transition:transform .25s,border-color .25s,box-shadow .3s;opacity:0;animation:cardIn .4s ease-out forwards}
.call-card:hover{border-color:#f59e0b;transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,158,11,.1)}
.call-card .call-info{display:flex;align-items:center;gap:10px}
.call-card .call-table{font-weight:800;color:#fbbf24;font-size:18px}
.call-card .call-time{color:#94a3b8;font-size:12px}
.call-card .call-actions{display:flex;gap:6px}
.call-badge{background:#ef4444;color:#fff;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:5px;animation:badgePop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes badgePop{from{transform:scale(0)}to{transform:scale(1)}}
.call-new{animation:callCardIn .5s cubic-bezier(.22,1,.36,1) both,callPulse 1s ease-in-out 3 .5s}
@keyframes callCardIn{from{opacity:0;transform:translateY(-16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes callPulse{50%{box-shadow:0 0 0 3px rgba(239,68,68,.35)}}

/* ── TABLE BADGE ── */
.table-free{border-color:rgba(52,211,153,.2)}
.table-occupied{border-color:rgba(251,191,36,.25)}
.table-reserved{border-color:rgba(99,102,241,.25)}

/* ── STATUS DOT ── */
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;animation:dotBlink 1.4s ease-in-out infinite}
.status-dot.cooking{background:#f59e0b}
.status-dot.ready{background:#34d399}
@keyframes dotBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}

@media(max-width:720px){.wrap{padding:12px}.top{padding:10px 12px}.tabs{margin-bottom:12px}.tab{padding:9px 12px}.grid{grid-template-columns:1fr}.top .muted{display:none}} </style>

</head>
<body>
<!-- LOADER -->
<div class="app-loader" id="appLoader"><div style="text-align:center"><div class="spinner"></div><p>Загрузка официанта...</p></div></div>

<!-- BG ORBS -->

<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

<div id="app" style="position:relative;z-index:2"></div>
<script>
const db=window.db;
const state={token:sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||'',session:(()=>{try{return JSON.parse(sessionStorage.getItem('waiter_session')||'null')}catch(e){return null}})(),orders:[],history:[],tables:[],products:[],busy:false,tab:sessionStorage.getItem('waiter_tab')||'overview',calls:[],prevCallIds:new Set(),callsInitialized:false};
const app=document.getElementById('app');
let callsPollTimer=null,callsPollBusy=false,audioCtx=null,audioUnlocked=false;
const money=n=>Number(n||0).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(r){state.token=r.token;state.session={venueId:r.venueId,venueName:r.venueName,staffName:r.staffName};sessionStorage.setItem('waiter_token',r.token);sessionStorage.setItem('staff_token',r.token);sessionStorage.setItem('waiter_session',JSON.stringify(state.session));}
function logout(){stopCallsPolling();['staff_token','waiter_token','waiter_session','waiter_tab'].forEach(k=>sessionStorage.removeItem(k));location.reload();}
function setTab(t){state.tab=t;sessionStorage.setItem('waiter_tab',t);render();}
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();audioUnlocked=true}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function playCallSound(){try{if(!audioUnlocked)return;audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;[0,0.14,0.28].forEach((offset,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=i===1?1046:880;g.gain.setValueAtTime(0,now+offset);g.gain.linearRampToValueAtTime(.12,now+offset+.02);g.gain.exponentialRampToValueAtTime(.001,now+offset+.11);o.connect(g);g.connect(audioCtx.destination);o.start(now+offset);o.stop(now+offset+.12)});}catch(e){}}
async function login(){state.busy=true;renderLogin();const r=await db.rpc('staff_login',{p_type:'waiter',p_slug:document.getElementById('slug').value.trim(),p_pin:document.getElementById('pin').value.trim()});state.busy=false;if(r.error||!r.data||r.data.error){renderLogin(r.error?.message||r.data?.error||'Неверные данные');return}save(r.data);state.tab='overview';await load();startCallsPolling();}
async function load(){if(!state.token)return;const [o,h,t,p,c]=await Promise.all([db.rpc('staff_orders_json',{p_token:state.token}),db.rpc('staff_history_json',{p_token:state.token}),db.rpc('staff_table_board',{p_token:state.token}),db.from('products').select('id,name,price,category,is_available').eq('venue_id',state.session.venueId).eq('is_available',true).neq('category','addon'),db.rpc('get_waiter_calls',{p_venue_id:state.session.venueId,p_token:state.token})]);if(o.error){logout();return}state.orders=Array.isArray(o.data)?o.data:[];state.history=Array.isArray(h.data)?h.data:[];state.tables=Array.isArray(t.data?.tables)?t.data.tables:[];state.products=p.data||[];syncCalls(Array.isArray(c.data)?c.data:[],true);render();startCallsPolling();}
function renderCallsOnly(newCall=false){const badge=document.getElementById('call-badge');if(badge)badge.textContent=String(state.calls.length);const callsList=document.getElementById('calls-list');if(callsList){callsList.innerHTML='';if(state.calls.length){state.calls.forEach((c,i)=>{const card=callCard(c,newCall);card.style.animationDelay=(i*0.08)+'s';callsList.appendChild(card)});}else callsList.innerHTML='<div class="empty">Нет вызовов</div>';}}
function syncCalls(nextCalls,initial=false){const next=Array.isArray(nextCalls)?nextCalls:[];const nextIds=new Set(next.map(c=>String(c.id)));let added=[];if(state.callsInitialized){for(const c of next){if(!state.prevCallIds.has(String(c.id)))added.push(c);}}state.calls=next;state.prevCallIds=nextIds;state.callsInitialized=true;if(!initial&&added.length){playCallSound();document.title='('+state.calls.length+') Новый вызов — Официант';setTimeout(()=>{document.title='Официант — OS QR-Меню'},5000);renderCallsOnly(true);if(state.tab!=='calls'){const tab=document.querySelector('[data-tab="calls"]');if(tab){tab.classList.add('call-new');setTimeout(()=>tab.classList.remove('call-new'),3000);}}}else renderCallsOnly(false);}
async function refreshCalls(){if(!state.token||callsPollBusy)return;callsPollBusy=true;try{const r=await db.rpc('get_waiter_calls',{p_venue_id:state.session.venueId,p_token:state.token});if(!r.error)syncCalls(Array.isArray(r.data)?r.data:[],false);}finally{callsPollBusy=false;}}
function startCallsPolling(){stopCallsPolling();if(!state.token)return;callsPollTimer=setInterval(refreshCalls,3000);}
function stopCallsPolling(){if(callsPollTimer){clearInterval(callsPollTimer);callsPollTimer=null;}}
function status(s){return({new:'Новый',cooking:'Готовится',ready:'Готов',delivery:'У курьера',arrived:'Прибыл',done:'Выдан',cancelled:'Отменён'})[s]||s;}
async function orderStatus(id,s){const r=await db.rpc('staff_update_order',{p_token:state.token,p_order_id:id,p_status:s});if(r.error)alert(r.error.message);else load();}
async function tableAction(id,a){let r;if(a==='seat')r=await db.rpc('staff_seat_table',{p_token:state.token,p_table_id:id,p_guest_count:1,p_guest_name:null,p_guest_phone:null});if(a==='reserve')r=await db.rpc('staff_reserve_table',{p_token:state.token,p_table_id:id,p_reserved_until:new Date(Date.now()+7200000).toISOString(),p_note:null,p_guest_name:null,p_guest_phone:null});if(a==='release')r=await db.rpc('staff_release_table',{p_token:state.token,p_table_id:id});if(r?.error)alert(r.error.message);else load();}
function openOrder(tableId){const table=state.tables.find(t=>t.id===tableId);const cart={};if(!table)return;const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between"><h3>Заказ · '+esc(table.name||('Стол '+table.table_number))+'</h3><button class="btn" id="x">✕</button></div><div class="products" id="ps"></div><div id="cart"></div><button class="btn primary" id="send" style="width:100%;margin-top:12px">Отправить заказ</button></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};const ps=m.querySelector('#ps');state.products.forEach(p=>{const d=document.createElement('div');d.className='product';d.innerHTML='<b>'+esc(p.name)+'</b><div class="muted">'+money(p.price)+' ₽</div><button class="btn" style="margin-top:7px">Добавить</button>';d.querySelector('button').onclick=()=>{cart[p.id]=(cart[p.id]||0)+1;draw()};ps.appendChild(d);});function draw(){m.querySelector('#cart').innerHTML=Object.entries(cart).map(([id,q])=>{const p=state.products.find(x=>x.id===id);return '<div style="padding:8px 0;border-bottom:1px solid #ffffff0d">'+esc(p.name)+' × '+q+' — '+money(p.price*q)+' ₽</div>';}).join('')||'<div class="empty">Корзина пуста</div>';}
m.querySelector('#send').onclick=async()=>{const items=Object.entries(cart).map(([product_id,qty])=>({product_id,qty}));if(!items.length)return alert('Добавьте товары');const key=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const r=await db.rpc('staff_create_session_order',{p_token:state.token,p_table_id:tableId,p_customer_name:null,p_comment:null,p_payment_method:'cash',p_items:items,p_addons:[],p_operation_key:key});if(r.error)alert(r.error.message);else{m.remove();load();}};draw();}
function renderLogin(err=''){app.innerHTML='<div class="login card"><h2>🤵 Официант</h2><div class="muted">Код заведения + 4-значный PIN</div><input id="slug" class="input" placeholder="Код заведения"><input id="pin" class="input" placeholder="PIN" maxlength="4" inputmode="numeric" type="password"><div style="color:#f87171;min-height:20px">'+esc(err)+'</div><button class="btn primary" id="go" style="width:100%">'+(state.busy?'Проверяем…':'Войти')+'</button></div>';document.getElementById('go').onclick=login;}
function openOrderDetail(o){const m=document.createElement('div');m.className='modal detail-modal';m.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between"><h2>📋 Заказ №'+esc(o.order_number)+'</h2><button class="btn" id="x">✕</button></div><div style="margin-bottom:10px"><span class="badge">'+status(o.status)+'</span><span style="margin-left:12px;color:#94a3b8;font-size:12px">'+new Date(o.created_at).toLocaleString()+'</span></div>'+(Array.isArray(o.items)?o.items.map(i=>'<div class="detail-row"><span>'+esc(i.qty||1)+'× '+esc(i.name||i.product_name||'Товар')+'</span><span>'+money((i.price||0)*(i.qty||1))+' ₽</span></div>').join(''):'')+'<div class="detail-total">Итого: '+money(o.total_price)+' ₽</div><div class="detail-meta"><div><strong>Тип:</strong> '+esc(o.order_type||'—')+'</div>'+(o.table_number?'<div><strong>Стол:</strong> '+esc(o.table_name||('Стол '+o.table_number))+'</div>':'')+'<div><strong>Клиент:</strong> '+esc(o.customer_name||'—')+' ('+esc(o.customer_phone||'—')+')</div>'+(o.delivery_address?'<div><strong>Адрес:</strong> '+esc(o.delivery_address)+'</div>':'')+'<div><strong>Оплата:</strong> '+(o.payment_method==='cash'?'💵 Наличные':'💳 Карта')+'</div>'+(o.comment?'<div><strong>Комментарий:</strong> '+esc(o.comment)+'</div>':'')+'</div><div style="margin-top:16px;text-align:right"><button class="btn" id="close-detail">Закрыть</button></div></div>';document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();m.querySelector('#close-detail').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove();};}
function tableCard(t){const busy=t.occupancy_status==='occupied',res=t.occupancy_status==='reserved',cls=busy?'table-occupied':res?'table-reserved':'table-free';const d=document.createElement('div');d.className='card '+cls;d.innerHTML='<div style="display:flex;justify-content:space-between"><b>🪑 '+esc(t.name||('Стол '+t.table_number))+'</b><span class="badge">'+(busy?'Занят':res?'Резерв':'Свободен')+'</span></div><div class="muted" style="margin-top:6px">'+(t.session?'Заказов: '+(t.session.order_count||0)+' · '+money(t.session.total_price||0)+' ₽':'Нет активной сессии')+'</div><div class="actions">'+(busy?'<button class="btn red" data-a="release">Освободить</button><button class="btn primary" data-a="order">+ Заказ</button>':'<button class="btn green" data-a="seat">Посадить</button><button class="btn yellow" data-a="reserve">Резерв</button>')+'</div>';d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>b.dataset.a==='order'?openOrder(t.id):tableAction(t.id,b.dataset.a));return d;}
function orderCard(o){const d=document.createElement('div');d.className='card';const itemsHtml=(Array.isArray(o.items)?o.items.map(i=>'<div class="order-item-line"><span>'+esc(i.qty||1)+'× '+esc(i.name||i.product_name||'Товар')+'</span><span>'+money((i.price||0)*(i.qty||1))+' ₽</span></div>'):'');const dotClass=o.status==='cooking'?'cooking':o.status==='ready'?'ready':'';const dotHtml=dotClass?'<span class="status-dot '+dotClass+'"></span>':'';d.innerHTML='<div style="display:flex;justify-content:space-between"><b>№'+esc(o.order_number)+'</b><span class="badge">'+dotHtml+status(o.status)+'</span></div><div style="margin-top:8px">'+itemsHtml+'</div><b>'+money(o.total_price)+' ₽</b><div class="actions">'+(o.status==='new'?'<button class="btn primary" data-s="cooking">В работу</button>':'')+(o.status==='cooking'?'<button class="btn green" data-s="ready">Готово</button>':'')+(o.status==='ready'&&o.order_type==='delivery'?'<button class="btn primary" data-s="delivery">Курьеру</button>':'')+((o.status==='ready'||o.status==='arrived')?'<button class="btn green" data-s="done">Выдан</button>':'')+'</div>';d.querySelectorAll('[data-s]').forEach(b=>b.onclick=e=>{e.stopPropagation();orderStatus(o.id,b.dataset.s)});d.onclick=()=>openOrderDetail(o);return d;}
function historyCard(o){const d=document.createElement('div');d.className='history-card';const itemsHtml=(Array.isArray(o.items)?o.items.map(i=>'<div class="item-line"><span>'+esc(i.qty||1)+'× '+esc(i.name||i.product_name||'Товар')+'</span><span>'+money((i.price||0)*(i.qty||1))+' ₽</span></div>').join(''):'');const payment=o.payment_method==='cash'?'💵 Наличные':'💳 Карта';const tableInfo=o.table_name||(o.table_number?'🪑 Стол '+o.table_number:'');d.innerHTML='<div class="head"><b>№'+esc(o.order_number)+'</b><span style="color:#34d399;font-size:12px">✅ Выдан</span></div><div class="items">'+itemsHtml+'</div><div style="font-weight:700;font-size:15px;margin:4px 0">Итого: '+money(o.total_price)+' ₽</div><div class="meta"><span>🕐 '+new Date(o.created_at).toLocaleString()+'</span>'+ (o.ready_at?'<span>⏱ '+new Date(o.ready_at).toLocaleString()+'</span>':'') +(tableInfo?'<span>'+tableInfo+'</span>':'') +'<span>'+payment+'</span></div>';d.onclick=()=>openOrderDetail(o);return d;}
function callCard(c,newCall=false){const d=document.createElement('div');d.className='call-card'+(newCall?' call-new':'');const time=new Date(c.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});d.innerHTML='<div class="call-info"><span class="call-table">🛎️ Стол '+esc(c.table_number)+'</span><span class="call-time">⏱ '+time+'</span></div><div class="call-actions"><button class="btn green" data-id="'+esc(c.id)+'">✅ Принять</button></div>';d.querySelector('[data-id]').onclick=e=>{e.stopPropagation();resolveWaiterCall(c.id)};return d;}

function render(){if(!state.token){renderLogin();return}const active=state.orders.filter(o=>!['done','cancelled'].includes(o.status));const occupied=state.tables.filter(t=>t.occupancy_status==='occupied').length;app.innerHTML='<div class="top"><div><div class="brand">🤵 '+esc(state.session?.venueName||'Официант')+'</div><div class="muted">'+esc(state.session?.staffName||'')+'</div></div><button class="btn" id="logout">Выйти</button></div><div class="wrap"><nav class="tabs"><button class="tab '+(state.tab==='overview'?'on':'')+'" data-tab="overview">Обзор</button><button class="tab '+(state.tab==='tables'?'on':'')+'" data-tab="tables">🪑 Столы</button><button class="tab '+(state.tab==='orders'?'on':'')+'" data-tab="orders">📋 Заказы</button><button class="tab '+(state.tab==='history'?'on':'')+'" data-tab="history">🕘 История</button><button class="tab '+(state.tab==='calls'?'on':'')+'" data-tab="calls">🛎️ Вызовы<span class="call-badge" id="call-badge">'+state.calls.length+'</span></button></nav><section class="panel '+(state.tab==='overview'?'on':'')+'"><div class="stats"><div class="stat"><b>'+state.tables.length+'</b><span class="muted">Столов</span></div><div class="stat"><b>'+occupied+'</b><span class="muted">Занято</span></div><div class="stat"><b>'+active.length+'</b><span class="muted">В работе</span></div><div class="stat"><b>'+money(active.reduce((s,o)=>s+Number(o.total_price||0),0))+' ₽</b><span class="muted">Оборот активных</span></div></div><div class="grid"><div class="card"><div class="section-head"><h3>🪑 Быстрый доступ к залу</h3></div><div class="muted">Управление посадкой, резервом и заказами по столам.</div><div class="actions"><button class="btn primary" data-goto="tables">Открыть столы</button></div></div><div class="card"><div class="section-head"><h3>📋 Текущие заказы</h3></div><div class="muted">Новые и активные заказы персонала.</div><div class="actions"><button class="btn primary" data-goto="orders">Открыть заказы</button></div></div></div></section><section class="panel '+(state.tab==='tables'?'on':'')+'"><div class="section-head"><div><h2 style="margin:0">🪑 Столы</h2><div class="muted">Посадка, резерв, освобождение и добавление заказа в текущую сессию.</div></div></div><div class="grid" id="tables"></div></section><section class="panel '+(state.tab==='orders'?'on':'')+'"><div class="section-head"><div><h2 style="margin:0">📋 Заказы</h2><div class="muted">Все активные заказы заведения.</div></div><button class="btn refresh-btn" id="refresh-orders">🔄 Обновить</button></div><div class="grid" id="orders"></div></section><section class="panel '+(state.tab==='history'?'on':'')+'"><div class="section-head"><div><h2 style="margin:0">🕘 История заказов</h2><div class="muted">Выполненные заказы</div></div></div><div class="grid" id="history-orders"></div></section><section class="panel '+(state.tab==='calls'?'on':'')+'"><div class="section-head"><div><h2 style="margin:0">🛎️ Вызовы официанта</h2><div class="muted">Активные вызовы от гостей за столами</div></div><button class="btn refresh-btn" id="refresh-calls">🔄 Обновить</button></div><div id="calls-list"></div></section></div>';
document.getElementById('logout').onclick=logout;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setTab(b.dataset.goto));const refreshOrdersBtn=document.getElementById('refresh-orders');if(refreshOrdersBtn)refreshOrdersBtn.onclick=()=>load();const refreshCallsBtn=document.getElementById('refresh-calls');if(refreshCallsBtn)refreshCallsBtn.onclick=()=>refreshCalls();const tg=document.getElementById('tables');state.tables.forEach((t,i)=>{const c=tableCard(t);c.style.animationDelay=(i*0.06)+'s';tg.appendChild(c)});if(!tg.children.length)tg.innerHTML='<div class="empty">Столы не настроены</div>';const og=document.getElementById('orders');state.orders.filter(o=>!['done','cancelled'].includes(o.status)).forEach((o,i)=>{const c=orderCard(o);c.style.animationDelay=(i*0.06)+'s';og.appendChild(c)});if(!og.children.length)og.innerHTML='<div class="empty">Нет активных заказов</div>';const hg=document.getElementById('history-orders');state.history.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach((o,i)=>{const c=historyCard(o);c.style.animationDelay=(i*0.06)+'s';hg.appendChild(c)});if(!hg.children.length)hg.innerHTML='<div class="empty">История заказов пуста</div>';renderCallsOnly(false);}

document.addEventListener('click',function(e){
const btn=e.target.closest('.btn');
if(!btn)return;
const r=document.createElement('span');r.className='btn-ripple';
const rect=btn.getBoundingClientRect();
r.style.left=(e.clientX-rect.left)+'px';r.style.top=(e.clientY-rect.top)+'px';
r.style.width=r.style.height=Math.max(rect.width,rect.height)+'px';
