<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История заказов — OS QR-Меню</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>
body{background:#0b1120;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.muted{opacity:.7;font-size:12px}.order{padding:11px 13px;border:1px solid #ffffff12;border-radius:13px;margin:8px 0;background:#111827}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.number{font-size:16px;font-weight:800}.meta{font-size:12px;color:#94a3b8}.sum{margin-left:auto;font-weight:800}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff10;font-size:11px}.done{background:#065f46}.cancelled{background:#7f1d1d}.items{margin-top:8px;padding-top:8px;border-top:1px solid #ffffff10}.item{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:12px}.extra{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:#94a3b8}.empty{text-align:center;padding:40px;color:#64748b}.error{padding:12px;border-radius:12px;background:#7f1d1d;color:#fecaca;margin:12px 0}.toolbar{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;color:#fff;background:#ffffff12;cursor:pointer}.primary{background:#6366f1}.loading{text-align:center;padding:30px;color:#94a3b8}
</style></head><body><div class="wrap"><div class="head"><div><h2 style="margin:0">🕘 История заказов</h2><div class="muted" id="subtitle">Завершённые и отменённые заказы</div></div><div class="toolbar"><button class="btn primary" id="refresh">↻ Обновить</button></div></div><div id="state" class="loading">Загрузка истории…</div><div id="list"></div></div><script>
const $=id=>document.getElementById(id);const db=window.db;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU');
const status=s=>({new:'Новый',cooking:'Готовится',ready:'Готов',delivery:'У курьера',arrived:'Прибыл',done:'Выдан',cancelled:'Отменён'})[s]||s||'—';
function getToken(){return sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||localStorage.getItem('staff_token')||localStorage.getItem('waiter_token')||'';}
function shortDate(v){if(!v)return '—';const d=new Date(v);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
async function load(){const token=getToken();$('list').innerHTML='';if(!token){$('state').innerHTML='<div class="error">Сессия официанта не найдена. Войдите в кабинет заново.</div>';return}$('state').textContent='Загрузка истории…';try{const r=await db.rpc('staff_history_json',{p_token:token});if(r.error)throw new Error(r.error.message);const rows=Array.isArray(r.data)?r.data:(r.data?.orders||[]);$('state').textContent=rows.length?`Найдено заказов: ${rows.length}`:'История пуста.';$('list').innerHTML=rows.map(o=>{const cls=o.status==='done'?'done':o.status==='cancelled'?'cancelled':'';const table=o.table_name?`🪑 ${esc(o.table_name)}`:(o.order_type==='table'?'🪑 Стол':'📦 '+esc(o.order_type||'Заказ'));const items=Array.isArray(o.items)?o.items.map(i=>`<div class="item"><span>${esc(i.qty||1)}× ${esc(i.name||i.product_name||'Товар')}</span><b>${money((i.qty||1)*Number(i.price||i.unit_price||0))} ₽</b></div>`).join(''):'';return `<div class="order"><div class="row"><span class="number">№${esc(o.order_number||o.id)}</span><span class="meta">${table}</span><span class="meta">${shortDate(o.created_at)}</span><span class="sum">${money(o.total_price)} ₽</span><span class="badge ${cls}">${esc(status(o.status))}</span></div>${items?`<div class="items">${items}</div>`:''}<div class="extra">${o.waiter_name?`<span>Официант: <b>${esc(o.waiter_name)}</b></span>`:''}${o.cook_name?`<span>Повар: <b>${esc(o.cook_name)}</b></span>`:''}${o.courier_name?`<span>Курьер: <b>${esc(o.courier_name)}</b></span>`:''}${o.customer_name?`<span>Клиент: <b>${esc(o.customer_name)}</b></span>`:''}${o.payment_method?`<span>Оплата: <b>${esc(o.payment_method)}</b></span>`:''}</div>${o.comment?`<div class="meta" style="margin-top:6px">Комментарий: ${esc(o.comment)}</div>`:''}${o.delivery_address?`<div class="meta" style="margin-top:4px">Адрес: ${esc(o.delivery_address)}</div>`:''}</div>`}).join('')||'<div class="empty">История пуста.</div>';}catch(e){$('state').innerHTML='<div class="error">Ошибка загрузки: '+esc(e.message)+'</div>';}}
$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
