<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Права управляющих</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>.wrap{max-width:900px;margin:auto;padding:20px}.rowx{display:grid;grid-template-columns:1fr 1fr;gap:12px}.perm{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #ffffff10}</style></head><body><div class="wrap"><h1>Права управляющего</h1><div class="rowx"><div><label>Manager UUID</label><input id="manager" style="width:100%;box-sizing:border-box;padding:10px" placeholder="UUID пользователя"></div><div><label>Venue UUID</label><input id="venue" style="width:100%;box-sizing:border-box;padding:10px" placeholder="UUID заведения"></div></div><div id="form" class="glass card" style="margin-top:14px"></div></div><script>const names=[['can_edit_menu','Редактировать меню'],['can_edit_prices','Редактировать цены'],['can_edit_delivery','Редактировать доставку и тариф'],['can_edit_design','Редактировать дизайн'],['can_edit_branding','Редактировать логотип и бренд'],['can_edit_venue','Редактировать название и данные заведения']];const f=document.getElementById('form');f.innerHTML=names.map(x=>`<div class="perm"><span>${x[1]}</span><input type="checkbox" id="${x[0]}" checked></div>`).join('')+'<button class="btn btn-primary" style="margin-top:14px" id="save">Сохранить права</button><p id="msg"></p>';
document.getElementById('save').onclick=async()=>{const manager=document.getElementById('manager').value.trim(),venue=document.getElementById('venue').value.trim();if(!manager||!venue)return document.getElementById('msg').textContent='Заполните UUID';const payload={manager_id:manager,venue_id:venue};names.forEach(x=>payload[x[0]]=document.getElementById(x[0]).checked);const r=await db.from('manager_venue_permissions').upsert(payload,{onConflict:'manager_id,venue_id'});document.getElementById('msg').textContent=r.error?r.error.message:'Права сохранены'};</script></body></html>
