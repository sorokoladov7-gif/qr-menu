<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аналитика — QR-Menu</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>.wrap{max-width:1250px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{padding:16px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.04)}.kpi b{display:block;font-size:25px;margin-top:7px}.table{width:100%;border-collapse:collapse;margin-top:18px}.table td,.table th{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}</style></head><body><div class="wrap"><div class="spread"><h1>Глобальная аналитика</h1><select id="days"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="365">365 дней</option></select></div><div id="cards" class="cards"></div><div class="glass card"><h3>Заведения</h3><table class="table"><thead><tr><th>Заведение</th><th>Заказы</th><th>Выручка</th></tr></thead><tbody id="venues"></tbody></table></div></div><script>const $=id=>document.getElementById(id);async function load(){const r=await db.rpc('admin_global_analytics',{p_days:+$('days').value});if(r.error){$('cards').innerHTML='<p>'+r.error.message+'</p>';return}const x=r.data||{};const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';const data=[['Заведений',x.venues_total],['Активных',x.venues_active],['Менеджеров',x.managers_total],['Заказов',x.orders_total],['Выполнено',x.orders_done],['Выручка',money(x.revenue)],['Средний чек',money(x.avg_check)],['Доставка',x.delivery_orders],['В зале',x.table_orders],['Самовывоз',x.pickup_orders],['Активные столы',x.active_tables],['QR-заказы',x.qr_orders]];$('cards').innerHTML=data.map(a=>`<div class="kpi"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');$('venues').innerHTML=(x.by_venue||[]).map(v=>`<tr><td>${v.name}</td><td>${v.orders}</td><td>${money(v.revenue)}</td></tr>`).join('')}$('days').onchange=load;load()</script></body></html>
