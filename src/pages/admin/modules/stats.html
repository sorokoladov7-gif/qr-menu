<div v-if="tab==='stats'" style="animation:cardFadeUp .4s ease-out">
<div class="spread" style="margin-bottom:14px"><h3 style="margin:0">🏆 Рейтинг заведений</h3>
<select v-model="statsPeriod" v-on:change="loadGlobalStats" style="width:auto">
<option value="7">За 7 дней</option><option value="30">За 30 дней</option><option value="all">За всё время</option></select></div>
<div class="glass card tblwrap">
<table class="tbl"><tr><th>Заведение</th><th>Выручка</th><th>Заказов</th><th>Клиентов</th><th>Ср.чек</th><th>Ср.время</th></tr>
<tr v-for="v in globalStats.venueStats" v-bind:key="v.id"><td><b>{{ v.name }}</b></td>
<td style="color:#34d399"><b>{{ fmt(v.revenue) }} ₽</b></td><td>{{ v.orders }}</td><td>{{ v.clients }}</td>
<td>{{ fmt(v.avgCheck) }} ₽</td><td>{{ v.avgCookTime }} мин</td></tr>
<tr v-if="!globalStats.venueStats.length"><td colspan="6" class="muted" style="text-align:center;padding:20px">Нет данных</td></tr></table></div>
</div>
