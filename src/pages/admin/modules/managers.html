<div v-if="tab==='managers'" style="animation:cardFadeUp .4s ease-out">
<div class="spread" style="margin-bottom:14px"><h3 style="margin:0">Управляющие</h3>
<button class="btn btn-primary btn-sm" v-on:click="addMgrModal.show=true">+ Добавить управляющего</button></div>
<div class="glass card tblwrap"><table class="tbl">
<tr><th>Имя</th><th>Email</th><th>Роль</th><th>Доступы к заведениям</th><th>Подписки заведений</th><th>Действия</th></tr>
<tr v-for="m in managers" v-bind:key="m.id">
<td><b>{{ m.display_name }}</b></td>
<td class="muted">{{ m.email }}</td>
<td><span class="badge" v-bind:class="m.role==='admin'?'b-on':'b-trial'">{{ m.role }}</span></td>
<td>
  <div class="checkbox-group">
    <template v-if="managerVenuesMap[m.id] && managerVenuesMap[m.id].length">
      <span v-for="v in managerVenuesMap[m.id]" v-bind:key="v.id" class="checkbox-label" style="cursor:default;">
        🏢 {{ v.name }}
      </span>
    </template>
    <span v-else class="muted">Нет назначенных заведений</span>
  </div>
</td>
<td>
  <div v-for="v in managerVenuesMap[m.id]" v-bind:key="v.id" style="margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.05);">
    <div><b>{{ v.name }}</b></div>
    <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
      <select v-bind:value="v.plan" v-on:change="changePlan(v,$event.target.value)" style="width:auto;padding:4px;font-size:12px;">
        <option v-for="p in plans" v-bind:key="p.id" v-bind:value="p.id">{{ p.name }}</option>
      </select>
      <select v-model.number="managerPeriods[m.id]" style="width:auto;min-width:105px;padding:5px 7px;font-size:11px;border-radius:7px">
  <option :value="15">+15 дней</option><option :value="20">+20 дней</option><option :value="30">+30 дней</option>
  <option :value="45">+45 дней</option><option :value="60">+60 дней</option><option :value="90">+90 дней</option>
  <option :value="120">+120 дней</option><option :value="180">+180 дней</option><option :value="365">+1 год</option>
</select>
      <span class="badge" v-bind:class="subClass(v)">{{ subLabel(v) }}</span>
      <span style="font-size:12px;">{{ fmtDate(v.subscription_end) }}</span>
      <button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:11px" v-on:click="extendManagerSub(m, managerPeriods[m.id] || 30)">Продлить</button>
  </div>
  <span v-if="!managerVenuesMap[m.id] || !managerVenuesMap[m.id].length" class="muted">Нет заведений</span>
</td>
<td style="white-space:nowrap">
<button class="btn btn-ghost btn-sm" v-on:click="openMgrEdit(m)">✏️</button>
<button class="btn btn-danger btn-sm" v-on:click="delManager(m)" v-bind:disabled="m.id===profile.id">🗑</button></td></tr>
</table>
<p v-if="!managers.length" class="muted" style="padding:14px">Нет управляющих.</p></div>
</div>
