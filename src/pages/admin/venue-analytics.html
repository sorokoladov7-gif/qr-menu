<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аналитика заведения</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>.wrap{max-width:1250px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{padding:16px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff05}.kpi b{display:block;font-size:24px;margin-top:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.cols{grid-template-columns:1fr}}li{padding:8px 0;border-bottom:1px solid #ffffff0d}</style></head><body><div class="wrap"><div class="spread"><h1>Аналитика заведения</h1><div><input id="venue" placeholder="Venue UUID"><select id="days"><option>7</option><option selected>30</option><option>90</option><option>365</option></select><button class="btn btn-primary" id="load">Загрузить</button></div></div><div id="cards" class="cards"></div><div class="cols"><div class="glass card"><h3>Пиковые часы</h3><ul id="hours"></ul></div><div class="glass card"><h3>Топ товаров</h3><ul id="products"></ul></div></div><div class="glass card"><h3>Столы</h3><div id="tables"></div></div></div><script>const $=id=>document.getElementById(id);$('venue').value=localStorage.getItem('manager_venue_id')||new URLSearchParams(location.search).get('venue')||'';async function load(){const r=await db.rpc('manager_venue_analytics_v2',{p_venue_id:$('venue').value.trim(),p_days:+$('days').value});if(r.error){alert(r.error.message);return}const x=r.data||{},money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';$('cards').innerHTML=[['Выручка',money(x.revenue)],['Заказов',x.orders],['Выполнено',x.done_orders],['Отменено',x.cancelled_orders],['Средний чек',money(x.avg_check)],['Посадок',x.table_sessions],['Доставка',x.delivery_orders],['QR',x.qr_orders]].map(a=>`<div class="kpi">${a[0]}<b>${a[1]}</b></div>`).join('');$('hours').innerHTML=(x.hourly||[]).sort((a,b)=>b.orders-a.orders).map(a=>`<li>${a.hr}:00 — ${a.orders} заказов · ${money(a.revenue)}</li>`).join('');$('products').innerHTML=(x.top_products||[]).map(a=>`<li>${a.name} — ${a.qty} шт. · ${money(a.revenue)}</li>`).join('');$('tables').innerHTML=(x.tables||[]).map(a=>`<div style="padding:10px;border-bottom:1px solid #ffffff0d"><b>№${a.table_number} ${a.name||''}</b> · ${a.sessions} сессий · ${money(a.revenue)}</div>`).join('')||'Нет данных';} $('load').onclick=load;if($('venue').value)load()</script></body></html>
