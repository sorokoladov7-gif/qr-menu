<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интеграции — OS QR-Menu</title>
<link rel="icon" href="/src/assets/icons/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{min-height:100vh}.wrap{max-width:1200px;margin:0 auto;padding:28px 18px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.cardx{border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;background:rgba(255,255,255,.035)}.icon{font-size:34px}.muted{color:#94a3b8;font-size:12px;line-height:1.5}.status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;margin:8px 0;background:rgba(148,163,184,.1);color:#cbd5e1}.status.ready{background:rgba(52,211,153,.12);color:#6ee7b7}.field{margin:10px 0}.field span{display:block;font-size:11px;color:#94a3b8;margin-bottom:5px}.field input,.field select{width:100%;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{margin:14px 0;padding:12px;border-radius:12px;background:rgba(99,102,241,.08);border:1px solid rgba(129,140,248,.2);font-size:12px;color:#cbd5e1}.result{max-height:220px;overflow:auto;margin-top:12px;padding:12px;border-radius:12px;background:rgba(0,0,0,.18);font:11px/1.45 monospace;white-space:pre-wrap}.hub-diagnostics{margin-top:8px;font-size:11px}.hidden{display:none!important}.danger{border-color:rgba(248,113,113,.35)!important;color:#fca5a5!important}.syncing{opacity:.72}.syncing .hub-sync{position:relative}.syncing .hub-sync:before{content:'⟳ ';display:inline-block;animation:hubspin .9s linear infinite}@keyframes hubspin{to{transform:rotate(360deg)}}@media(max-width:600px){.head{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px}.actions button{width:100%}}
</style>
</head>
<body>
<div class="topbar"><div class="brand"><div class="logo">QR</div><span>OS QR-Menu</span></div><div class="row"><a class="btn btn-ghost btn-sm" href="manager.html">В кабинет</a></div></div>
<main class="wrap">
<div class="head"><div><h1 style="margin:0 0 5px">Интеграции</h1><div class="muted">Подключение POS-систем к выбранному заведению.</div></div></div>
<div id="message" class="notice hidden"></div>
<div class="cardx" style="margin-bottom:14px"><div class="field"><span>Заведение</span><select id="venue"><option value="">Загрузка заведений...</option></select></div></div>
<div id="integrationsGrid" class="grid"></div>
<div class="notice"><b>Безопасность:</b> секреты интеграций не возвращаются в браузер после сохранения. Проверка и импорт выполняются на сервере.</div>
</main>
<script src="/js/config.js"></script>
<script>
(function(){'use strict';
var SUPABASE_URL='https://ulxfsozdryqrnlxzlblt.supabase.co',SUPABASE_KEY=(window.QR_CONFIG&&window.QR_CONFIG.SUPABASE_ANON_KEY)||'sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq';
window.db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage,storageKey:'qr-menu-auth-account'}});
async function loadVenues(){var select=document.getElementById('venue');if(!select)return;try{var r=await window.db.auth.getSession(),s=r&&r.data&&r.data.session;if(!s)throw Error('Сессия не найдена. Войдите в кабинет управляющего.');var q=await window.db.from('manager_venues').select('venue_id,venues(id,name)').eq('manager_id',s.user.id);if(q.error)throw q.error;var rows=(q.data||[]).map(function(x){return x.venues||{id:x.venue_id,name:'Заведение'}}).filter(function(x){return x&&x.id});select.innerHTML='';if(!rows.length){select.innerHTML='<option value="">Нет доступных заведений</option>';return}var saved=new URLSearchParams(location.search).get('venue_id')||localStorage.getItem('manager_venue_id')||localStorage.getItem('selectedVenueId')||'';rows.forEach(function(v){var o=document.createElement('option');o.value=v.id;o.textContent=v.name||v.id;select.appendChild(o)});select.value=rows.some(function(v){return String(v.id)===String(saved)})?saved:rows[0].id;localStorage.setItem('manager_venue_id',select.value);localStorage.setItem('selectedVenueId',select.value);select.disabled=rows.length<2;select.dispatchEvent(new Event('change'));}catch(e){select.innerHTML='<option value="">Не удалось загрузить заведения</option>';console.error('[Integrations] loadVenues:',e)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadVenues,{once:true});else loadVenues();
})();
</script>
<script src="/src/assets/js/manager/integrations-hub.js?v=20260907-6"></script>
<script>
(function(){'use strict';
  var originalFetch=window.fetch;
  var adapterPath=/\/api\/integrations\/(iiko|pos|saby-presto|poster|syrve|evotor|frontpad)(?:\?|$)/;
  function card(provider){return document.querySelector('.hub-card[data-provider="'+CSS.escape(provider)+'"]');}
  function setBusy(c,busy){if(!c)return; c.classList.toggle('syncing',busy); var s=c.querySelector('.hub-status'),sync=c.querySelector('.hub-sync'); if(busy){if(s){s.textContent='Синхронизация…';s.className='status hub-status';} if(sync){sync.dataset.syncLabel=sync.textContent;sync.textContent='Синхронизация…';} c.querySelectorAll('.actions button').forEach(function(x){x.disabled=true;});}else{if(sync){sync.textContent=sync.dataset.syncLabel||'Синхронизировать сейчас';delete sync.dataset.syncLabel;}}}
  window.fetch=function(input,init){
    var url=typeof input==='string'?input:(input&&input.url)||'';
    var opts=init||((typeof input==='object'&&input)?input:{})||{};
    var method=String(opts.method||'GET').toUpperCase();
    if(method!=='POST'||!adapterPath.test(String(url))) return originalFetch.apply(this,arguments);
    var body={};try{body=typeof opts.body==='string'?JSON.parse(opts.body):opts.body||{};}catch(_){body={};}
    if(body.action!=='import_menu') return originalFetch.apply(this,arguments);
    var p=String(body.provider||''),c=card(p);
    setBusy(c,true);
    return originalFetch.apply(this,arguments).then(function(response){
      if(response.status===409){
        setTimeout(function(){
          if(!c)return;
          var s=c.querySelector('.hub-status'),r=c.querySelector('.hub-result');
          c.classList.remove('syncing');
          if(s){s.textContent='Синхронизация уже выполняется';s.className='status hub-status';}
          if(r)r.textContent='Это заведение и POS уже синхронизируются. Повторный запуск заблокирован сервером.';
          var sync=c.querySelector('.hub-sync');if(sync){sync.textContent='Синхронизировать сейчас';sync.disabled=false;}
          c.querySelectorAll('.hub-connect,.hub-test,.hub-import,.hub-disconnect').forEach(function(x){x.disabled=false;});
        },0);
      }
      return response;
    },function(err){setTimeout(function(){setBusy(c,false);},0);throw err;});
  };
})();
</script>
</body>
</html>
