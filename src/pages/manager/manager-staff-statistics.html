<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статистика персонала — QR-SETKA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#fff;font:14px system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel{background:#111827;border:1px solid #ffffff12;border-radius:16px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select{border:1px solid #ffffff18;border-radius:10px;padding:9px 12px;background:#ffffff08;color:#fff;font-weight:700}.btn{cursor:pointer}.primary{background:#6366f1}.muted{color:#94a3b8}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:#ffffff05;border:1px solid #ffffff0d;border-radius:12px;padding:12px}.num{font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.day{cursor:pointer}.staff{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #ffffff0d}.err{color:#f87171}.loading{text-align:center;padding:40px;color:#94a3b8}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin:0">Статистика персонала</h1><div class="muted">Данные доступны только управляющему</div></div><a class="btn" href="manager.html">← Кабинет</a></div><div class="panel"><div class="row"><label>Заведение <select id="venue"></select></label><label>Период <select id="period"><option value="7">7 дней</option><option value="30">30 дней</option><option value="90">90 дней</option></select></label><button class="btn primary" id="load">Обновить</button></div></div><div id="app"><div class="loading">Загрузка…</div></div></div><script>(async()=>{const db=window.db||window.baseDb;const venueEl=document.getElementById('venue'),periodEl=document.getElementById('period'),app=document.getElementById('app');const fmt=n=>Number(n||0).toLocaleString('ru-RU');function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))};async function init(){const {data:{user}}=await db.auth.getUser();if(!user){app.innerHTML='<div class="panel err">Необходимо войти в кабинет управляющего.</div>';return}const {data:venues,error}=await db.from('manager_venues').select('venue_id,name,slug').eq('manager_id',user.id);if(error){app.innerHTML='<div class="panel err">'+esc(error.message)+'</div>';return}if(!venues?.length){app.innerHTML='<div class="panel">Заведения не найдены.</div>';return}venueEl.innerHTML=venues.map(v=>'<option value="'+esc(v.venue_id)+'">'+esc(v.name||v.slug||v.venue_id)+'</option>').join('');await load()}async function load(){app.innerHTML='<div class="loading">Загрузка статистики…</div>';const days=Number(periodEl.value),to=new Date(),from=new Date(Date.now()-(days-1)*86400000);const ymd=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};const {data,error}=await db.rpc('manager_staff_statistics',{p_venue_id:venueEl.value,p_from:ymd(from),p_to:ymd(to)});if(error){app.innerHTML='<div class="panel err">'+esc(error.message)+'</div>';return}const rows=Array.isArray(data)?data:[];const totalOrders=rows.reduce((s,d)=>s+Number(d.total_orders||0),0),totalRevenue=rows.reduce((s,d)=>s+Number(d.total_revenue||0),0),completed=rows.reduce((s,d)=>s+Number(d.completed_orders||0),0);let h='<div class="stats"><div class="card"><div class="num">'+totalOrders+'</div><div class="muted">Заказов</div></div><div class="card"><div class="num">'+fmt(totalRevenue)+' ₽</div><div class="muted">Выручка</div></div><div class="card"><div class="num">'+completed+'</div><div class="muted">Выдано</div></div></div><div class="grid" style="margin-top:14px">';rows.slice().reverse().forEach(d=>{h+='<div class="panel day"><div style="display:flex;justify-content:space-between"><b>'+esc(new Date(d.business_date).toLocaleDateString('ru-RU'))+'</b><span class="muted">'+(d.closed_at?'День закрыт':'Открыт')+'</span></div><div class="muted" style="margin-top:6px">Заказы: '+d.total_orders+' · Выручка: '+fmt(d.total_revenue)+' ₽ · Готово: '+d.completed_orders+'</div><div style="margin-top:10px">';(d.staff||[]).forEach(s=>{h+='<div class="staff"><span>'+esc(s.staff_name||'Без имени')+' <span class="muted">('+esc(s.staff_type)+')</span></span><span>'+s.orders_count+' · '+fmt(s.revenue)+' ₽</span></div>'});h+='</div></div>'});h+='</div>';app.innerHTML=h}document.getElementById('load').onclick=load;periodEl.onchange=load;await init()})()</script></body></html>
