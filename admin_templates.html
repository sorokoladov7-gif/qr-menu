<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Menu Pro — Шаблоны</title><script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><style>body{margin:0;background:#0b0d12;color:#eef2f7;font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.grid{display:grid;grid-template-columns:300px 1fr;gap:18px}.card,.box{background:#141821;border:1px solid #29303d;border-radius:18px;padding:18px}.list{display:grid;gap:10px}.tpl{padding:14px;border:1px solid #29303d;border-radius:14px;cursor:pointer}.tpl.active{border-color:#6ea8fe;background:#182234}.muted{color:#8993a4}.row{display:flex;gap:10px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#9ba5b5;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;background:#0e1219;color:#fff;border:1px solid #303746;border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#202735;color:#fff}.primary{background:#356fe8}.danger{background:#7d2630}.product{display:grid;grid-template-columns:1fr 120px 140px 40px;gap:8px;align-items:end;margin:8px 0}.product input,.product select{background:#0e1219;color:#fff;border:1px solid #303746;border-radius:9px;padding:9px;width:100%;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.product{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}</style></head><body><div id="app"><div class="wrap"><div class="top"><div><h1 style="margin:0">Шаблоны заведений</h1><div class="muted">Администрирование меню для быстрого создания заведений</div></div><div class="actions"><button class="btn" @click="newTemplate">+ Новый шаблон</button><button class="btn" @click="logout">Выйти</button></div></div><div v-if="error" class="card" style="border-color:#8d3038;margin-bottom:15px">{{error}}</div><div class="grid"><div class="card"><div class="list"><div v-for="t in templates" :key="t.id" class="tpl" :class="{active:selected&&selected.id===t.id}" @click="select(t)"><div style="font-size:22px">{{t.emoji||'🍽️'}} <b>{{t.name}}</b></div><div class="muted">{{t.slug}} · {{(t.products||[]).length}} позиций</div></div></div></div><div class="box" v-if="selected"><div class="row"><div class="field" style="flex:1"><label>Название</label><input v-model.trim="form.name"></div><div class="field" style="width:120px"><label>Emoji</label><input v-model="form.emoji"></div><div class="field" style="width:150px"><label>Slug</label><input v-model.trim="form.slug"></div></div><div class="field"><label>Описание</label><input v-model="form.description"></div><div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" v-model="form.is_active"> Активен</label><div style="flex:1"></div><div class="field" style="width:120px"><label>Порядок</label><input v-model.number="form.sort_order" type="number"></div></div><hr style="border-color:#29303d"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Товары <span class="muted" style="font-size:14px">{{form.products.length}}</span></h2><button class="btn" @click="addProduct">+ Добавить</button></div><div v-for="(p,i) in form.products" :key="i" class="product"><div><label class="muted" style="font-size:11px">Название</label><input v-model="p.name"></div><div><label class="muted" style="font-size:11px">Цена ₽</label><input v-model.number="p.price" type="number" min="0"></div><div><label class="muted" style="font-size:11px">Категория</label><select v-model="p.category"><option value="main">Блюдо</option><option value="drink">Напиток</option><option value="addon">Доп</option><option value="dessert">Десерт</option><option value="snack">Закуска</option><option value="soup">Суп</option><option value="salad">Салат</option><option value="hot">Горячее</option><option value="bbq">Гриль</option></select></div><button class="btn danger" @click="removeProduct(i)">×</button><div style="grid-column:1/-1"><input v-model="p.description" placeholder="Описание товара"></div></div><div class="actions" style="margin-top:18px"><button class="btn primary" @click="save" :disabled="busy">{{busy?'Сохранение…':'Сохранить шаблон'}}</button><button class="btn danger" @click="removeTemplate">Удалить шаблон</button></div></div></div></div><script>Vue.createApp({data(){return{templates:[],selected:null,form:{},busy:false,error:''}},methods:{async init(){try{const p=await requireAuth(['admin']);if(!p)return;await this.load()}catch(e){this.error=e.message||String(e)}},async load(){const r=await db.from('menu_templates').select('*').order('sort_order').order('name');if(r.error)throw r.error;this.templates=r.data||[];if(this.selected){const x=this.templates.find(t=>t.id===this.selected.id);if(x)this.select(x)}else if(this.templates[0])this.select(this.templates[0])},select(t){this.selected=t;this.form=JSON.parse(JSON.stringify(t));this.form.products=Array.isArray(this.form.products)?this.form.products:[]},newTemplate(){const id='template-'+Date.now();const t={id,name:'Новый шаблон',slug:id,emoji:'🍽️',description:'',is_active:true,sort_order:100,products:[]};this.templates.push(t);this.select(t)},addProduct(){this.form.products.push({name:'Новая позиция',description:'',price:0,category:'main',applies_to:'all',image_url:null})},removeProduct(i){this.form.products.splice(i,1)},async save(){this.error='';if(!this.form.name||!this.form.slug){this.error='Заполните название и slug';return}this.busy=true;const row={id:this.form.id,name:this.form.name,slug:this.form.slug,emoji:this.form.emoji||'🍽️',description:this.form.description||null,is_active:!!this.form.is_active,sort_order:Number(this.form.sort_order)||100,products:this.form.products};const r=await db.from('menu_templates').upsert(row,{onConflict:'id'});this.busy=false;if(r.error){this.error=r.error.message;return}await this.load()},async removeTemplate(){if(!this.selected||!confirm('Удалить шаблон «'+this.selected.name+'»?'))return;const r=await db.from('menu_templates').delete().eq('id',this.selected.id);if(r.error){this.error=r.error.message;return}this.selected=null;await this.load()},logout(){try{db.auth.signOut()}catch(e){}location.href='/index.html'}},mounted(){this.init()}}).mount('#app')</script></body></html>
