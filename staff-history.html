<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История заказов — OS QR-Меню</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>
body{background:#0b1120;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.muted{opacity:.7;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;color:#fff;background:#ffffff12;cursor:pointer}.primary{background:#6366f1}.loading{text-align:center;padding:30px;color:#94a3b8}.empty{text-align:center;padding:40px;color:#64748b}.error{padding:12px;border-radius:12px;background:#7f1d1d;color:#fecaca;margin:12px 0}.history{display:grid;gap:8px}.order{background:#111827;border:1px solid #ffffff10;border-radius:13px;padding:11px 13px}.main{display:grid;grid-template-columns:minmax(105px,1fr) auto auto auto;align-items:center;gap:12px}.number{font-weight:800;font-size:16px}.meta{font-size:12px;color:#94a3b8}.sum{font-weight:800;white-space:nowrap}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:#ffffff10}.done{background:#065f46;color:#a7f3d0}.cancelled{background:#7f1d1d;color:#fecaca}.details{margin-top:9px;padding-top:9px;border-top:1px solid #ffffff08;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;font-size:12px;color:#cbd5e1}.items{grid-column:1/-1;color:#fff}.item{display:flex;justify-content:space-between;gap:12px;padding:5px 0}.comment{grid-column:1/-1;color:#94a3b8}@media(max-width:700px){.wrap{padding:12px}.main{grid-template-columns:1fr auto auto;gap:7px}.date{grid-column:1}.sum{grid-column:2}.badge{grid-column:3;grid-row:1}.details{grid-template-columns:1fr 1fr}}@media(max-width:430px){.main{grid-template-columns:1fr auto}.badge{grid-column:2;grid-row:1}.sum{grid-column:2;grid-row:2}.date{grid-column:1;grid-row:2}}
</style></head><body><div class="wrap"><div class="head"><div><h2 style="margin:0">🕘 История заказов</h2><div class="muted" id="subtitle">Завершённые и отменённые заказы</div></div><div class="toolbar"><button class="btn primary" id="refresh">↻ Обновить</button></div></div><div id="state" class="loading">Загрузка истории…</div><div id="list" class="history"></div></div><script>
const $=id=>document.getElementById(id);const db=window.db;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU');
const status=s=>({new:'Новый',cooking:'Готовится',ready:'Готов',delivery:'У курьера',arrived:'Прибыл',done:'Выдан',cancelled:'Отменён'})[s]||s||'—';
function getToken(){return sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||localStorage.getItem('staff_token')||localStorage.getItem('waiter_token')||'';}
function shortDate(v){if(!v)return '—';const d=new Date(v);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function orderDetails(o){const items=Array.isArray(o.items)?o.items.map(i=>`<div class="item"><span>${esc(i.qty||1)}× ${esc(i.name||i.product_name||'Товар')}</span><b>${money((i.qty||1)*Number(i.price||i.unit_price||0))} ₽</b></div>`).join(''):'';const extra=[];if(o.waiter_name)extra.push(`<div>Официант: <b>${esc(o.waiter_name)}</b></div>`);if(o.cook_name)extra.push(`<div>Повар: <b>${esc(o.cook_name)}</b></div>`);if(o.courier_name)extra.push(`<div>Курьер: <b>${esc(o.courier_name)}</b></div>`);if(o.customer_name)extra.push(`<div>Клиент: <b>${esc(o.customer_name)}</b></div>`);if(o.payment_method)extra.push(`<div>Оплата: <b>${esc(o.payment_method)}</b></div>`);if(o.comment)extra.push(`<div class="comment">Комментарий: ${esc(o.comment)}</div>`);if(o.delivery_address)extra.push(`<div class="comment">Адрес: ${esc(o.delivery_address)}</div>`);if(items)extra.unshift(`<div class="items">${items}</div>`);return extra.length?`<div class="details">${extra.join('')}</div>`:'';}
async function load(){const token=getToken();$('list').innerHTML='';if(!token){$('state').innerHTML='<div class="error">Сессия официанта не найдена. Войдите в кабинет заново.</div>';return}$('state').textContent='Загрузка истории…';try{const r=await db.rpc('staff_history_json',{p_token:token});if(r.error)throw new Error(r.error.message);const rows=Array.isArray(r.data)?r.data:(r.data?.orders||[]);$('state').textContent=rows.length?`Найдено заказов: ${rows.length}`:'История пуста.';if(!rows.length){$('list').innerHTML='<div class="empty">История пуста.</div>';return}$('list').innerHTML=rows.map(o=>{const cls=o.status==='done'?'done':o.status==='cancelled'?'cancelled':'';const table=o.table_name?`🪑 ${esc(o.table_name)}`:(o.order_type==='table'?'🪑 Стол':'📦 '+esc(o.order_type||'Заказ'));return `<article class="order"><div class="main"><div><div class="number">№${esc(o.order_number||o.id)}</div><div class="meta">${table}</div></div><div class="meta date">${shortDate(o.created_at)}</div><div class="sum">${money(o.total_price)} ₽</div><span class="badge ${cls}">${esc(status(o.status))}</span></div><div id="details-placeholder"></div><div class="details">${orderDetails(o).replace('<div class="details">','').replace(/<\/div>$/,'')}</div></article>`}).join('');}catch(e){$('state').innerHTML='<div class="error">Ошибка загрузки: '+esc(e.message)+'</div>';}}
$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
