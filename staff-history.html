<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История заказов — OS QR-Меню</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>
body{background:#0b1120;color:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.muted{opacity:.7;font-size:12px}.order{padding:16px;border:1px solid #ffffff12;border-radius:16px;margin:10px 0;background:#111827}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ffffff10;font-size:11px}.items{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff10}.item{display:flex;justify-content:space-between;gap:12px;padding:7px 0}.empty{text-align:center;padding:40px;color:#64748b}.error{padding:12px;border-radius:12px;background:#7f1d1d;color:#fecaca;margin:12px 0}.toolbar{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;color:#fff;background:#ffffff12;cursor:pointer}.primary{background:#6366f1}.loading{text-align:center;padding:30px;color:#94a3b8}
</style></head><body><div class="wrap"><div class="head"><div><h2 style="margin:0">🕘 История заказов</h2><div class="muted" id="subtitle">Завершённые и отменённые заказы</div></div><div class="toolbar"><button class="btn primary" id="refresh">↻ Обновить</button></div></div><div id="state" class="loading">Загрузка истории…</div><div id="list"></div></div><script>
const $=id=>document.getElementById(id);const db=window.db;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU');
const status=s=>({new:'Новый',cooking:'Готовится',ready:'Готов',delivery:'У курьера',arrived:'Прибыл',done:'Выдан',cancelled:'Отменён'})[s]||s||'—';
function getToken(){return sessionStorage.getItem('waiter_token')||sessionStorage.getItem('staff_token')||localStorage.getItem('staff_token')||localStorage.getItem('waiter_token')||'';}
async function load(){const token=getToken();$('list').innerHTML='';if(!token){$('state').innerHTML='<div class="error">Сессия официанта не найдена. Войдите в кабинет заново.</div>';return}$('state').textContent='Загрузка истории…';try{const r=await db.rpc('staff_history_json',{p_token:token});if(r.error)throw new Error(r.error.message);const rows=Array.isArray(r.data)?r.data:(r.data?.orders||[]);$('state').textContent=rows.length?`Найдено заказов: ${rows.length}`:'История пуста.';$('list').innerHTML=rows.map(o=>{const items=Array.isArray(o.items)?o.items.map(i=>`<div class="item"><span>${esc(i.qty||1)}× ${esc(i.name||i.product_name||'Товар')}</span><b>${money((i.qty||1)*Number(i.price||i.unit_price||0))} ₽</b></div>`).join(''):'';return `<div class="order"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:18px">№${esc(o.order_number||o.id)}</b><span class="badge">${esc(status(o.status))}</span></div><div class="grid" style="margin-top:12px"><div>Дата: ${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):'—'}</div><div>Стол: ${esc(o.table_name||o.table_id||'—')}</div><div>Тип: ${esc(o.order_type||'—')}</div><div>Сумма: <b>${money(o.total_price)} ₽</b></div><div>Официант: ${esc(o.waiter_name||'—')}</div><div>Повар: ${esc(o.cook_name||'—')}</div><div>Курьер: ${esc(o.courier_name||'—')}</div></div>${items?`<div class="items">${items}</div>`:''}<details style="margin-top:12px"><summary>Подробности</summary><pre style="white-space:pre-wrap;font-size:11px;color:#94a3b8">${esc(JSON.stringify(o,null,2))}</pre></details></div>`}).join('')||'<div class="empty">История пуста.</div>';}catch(e){$('state').innerHTML='<div class="error">Ошибка загрузки: '+esc(e.message)+'</div>';}}
$('refresh').onclick=load;load();setInterval(load,30000);
</script></body></html>
