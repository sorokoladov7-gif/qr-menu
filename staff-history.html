<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>История заказов</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>.wrap{max-width:1100px;margin:auto;padding:18px}.order{padding:15px;border:1px solid #ffffff12;border-radius:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.muted{opacity:.7;font-size:12px}</style></head><body><div class="wrap"><h2>История заказов</h2><div class="row"><input id="token" placeholder="Токен персонала" style="flex:1;padding:10px"><button class="btn btn-primary" id="load">Загрузить</button></div><div id="list"></div></div><script>const $=id=>document.getElementById(id);$('token').value=localStorage.getItem('staff_token')||'';$('load').onclick=async()=>{const token=$('token').value.trim();localStorage.setItem('staff_token',token);const r=await db.rpc('staff_history_json',{p_token:token});if(r.error){$('list').innerHTML='<p>'+r.error.message+'</p>';return}const rows=Array.isArray(r.data)?r.data:(r.data?.orders||[]);$('list').innerHTML=rows.map(o=>`<div class="order"><div class="spread"><b>№${o.order_number||o.id}</b><span>${o.status||''}</span></div><div class="grid"><div>Дата: ${o.created_at?new Date(o.created_at).toLocaleString('ru-RU'):''}</div><div>Стол: ${o.table_name||o.table_id||'—'}</div><div>Тип: ${o.order_type||'—'}</div><div>Сумма: ${Number(o.total_price||0).toLocaleString('ru-RU')} ₽</div><div>Официант: ${o.waiter_name||'—'}</div><div>Повар: ${o.cook_name||'—'}</div><div>Курьер: ${o.courier_name||'—'}</div></div><details style="margin-top:8px"><summary>Подробности</summary><pre style="white-space:pre-wrap;font-size:11px">${escapeHtml(JSON.stringify(o,null,2))}</pre></details></div>`).join('')||'<p class="muted">История пуста.</p>'};function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script></body></html>
