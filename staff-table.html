<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Персонал — столы</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><style>body{margin:0}.wrap2{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.t{padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.12);cursor:pointer}.free{border-color:#22c55e}.reserved{border-color:#f59e0b}.occupied{border-color:#ef4444}.blocked,.maintenance{opacity:.55}.muted{opacity:.7;font-size:12px}.panel{position:fixed;inset:auto 16px 16px auto;width:min(380px,calc(100% - 32px));background:#111827;border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,.15);box-shadow:0 25px 80px #0008;z-index:20}.row{display:flex;gap:8px}.row>*{flex:1}.field{margin:9px 0}.field input{width:100%;box-sizing:border-box;padding:10px;background:#0b1220;color:#fff;border:1px solid #ffffff22;border-radius:10px}</style></head><body><div class="wrap2"><h2>Зал</h2><div class="row"><input id="token" placeholder="Токен персонала" style="padding:10px;flex:1"><button class="btn btn-primary" id="go">Загрузить</button></div><p id="info" class="muted"></p><div id="grid" class="grid"></div></div><div id="panel" class="panel" hidden></div><script>
const db=window.db;let token=localStorage.getItem('staff_token')||'';let board=null;let current=null;const $=id=>document.getElementById(id);$('token').value=token;
async function load(){token=$('token').value.trim();if(!token)return;$('info').textContent='Загрузка…';const r=await db.rpc('staff_table_board',{p_token:token});if(r.error){$('info').textContent=r.error.message;return}localStorage.setItem('staff_token',token);board=r.data;$('info').textContent=`${board.staff_type}: ${board.can_control?'управление разрешено':'только просмотр'}`;render()}
function render(){const g=$('grid');g.innerHTML='';(board.tables||[]).forEach(t=>{const d=document.createElement('div');d.className='t '+t.occupancy_status;d.innerHTML=`<b>№${t.table_number} ${t.name||''}</b><br><span class="muted">${t.occupancy_status} · ${t.session_guest_count||t.guest_count||0}/${t.seats} мест</span><br><span class="muted">Заказов: ${t.order_count||0} · ${Number(t.total_amount||0).toLocaleString('ru-RU')} ₽</span>`;d.onclick=()=>open(t);g.appendChild(d)})}
function open(t){current=t;const p=$('panel');p.hidden=false;p.innerHTML=`<button class="btn btn-ghost" onclick="pclose()">✕</button><h3>Стол №${t.table_number}</h3><p>Статус: <b>${t.occupancy_status}</b></p><p>Открытых заказов: ${t.open_order_count||0}</p>${board.can_control?`<div class="field"><input id="guests" type="number" min="1" value="${t.session_guest_count||2}" placeholder="Гостей"></div><div class="field"><input id="gname" placeholder="Имя гостя"></div><div class="field"><input id="gphone" placeholder="Телефон"></div><div class="row"><button class="btn btn-green" onclick="seat()">Посадить</button><button class="btn btn-ghost" onclick="reserve()">Резерв</button></div><div class="row" style="margin-top:8px"><button class="btn btn-ghost" onclick="release()">Освободить</button><button class="btn btn-primary" onclick="newOrder()">+ Заказ</button></div>`:`<p class="muted">У повара при наличии официантов управление отключено.</p>`}`}
function pclose(){$('panel').hidden=true}async function action(fn,args){const r=await db.rpc(fn,args);if(r.error){alert(r.error.message);return}pclose();load()}
function seat(){action('staff_seat_table',{p_token:token,p_table_id:current.id,p_guest_count:+$('guests').value,p_guest_name:$('gname').value,p_guest_phone:$('gphone').value})}
function reserve(){action('staff_reserve_table',{p_token:token,p_table_id:current.id,p_reserved_until:new Date(Date.now()+7200000).toISOString(),p_note:null,p_guest_name:$('gname').value,p_guest_phone:$('gphone').value})}
function release(){action('staff_release_table',{p_token:token,p_table_id:current.id})}
function newOrder(){location.href='waiter.html?table='+encodeURIComponent(current.id)}
$('go').onclick=load;if(token)load();</script></body></html>
