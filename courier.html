<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Курьер</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Курьер">
<link rel="manifest" href="/manifest-courier.webmanifest">
<link rel="apple-touch-icon" href="/icon-courier-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
[v-cloak]{display:none}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}.wcard{padding:12px;margin-bottom:10px}.b-ready{background:rgba(52,211,153,.15);color:#6ee7b7}.b-delivery{background:rgba(167,139,250,.15);color:#c4b5fd}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}.stat-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;text-align:center}.stat-box .num{font-size:22px;font-weight:800}.stat-box .lbl{font-size:11px;color:#9ca3af;margin-top:4px}.login-info{text-align:center;margin-top:12px;font-size:12px;color:#9ca3af}
</style>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(245,158,11,.12);top:-100px;left:-100px"></div>
<div id="app" v-cloak>
<div class="topbar"><div class="brand"><div class="logo">🚗</div><span>Курьер<span v-if="session"> · {{session.venueName}}</span></span></div><div class="row"><button v-if="session" class="btn btn-ghost btn-sm" v-on:click="logout">Выйти</button></div></div>
<div class="wrap">
<div v-if="!session" class="glass card" style="max-width:400px;margin:40px auto"><h3 style="margin-top:0">Вход для курьера</h3><div class="field"><label>Код заведения</label><input v-model.trim="loginForm.slug" placeholder="demo" autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="field"><label>PIN</label><input v-model.trim="loginForm.pin" type="password" inputmode="numeric" autocomplete="current-password" v-on:keyup.enter="login"></div><button class="btn btn-primary" style="width:100%" v-on:click="login" v-bind:disabled="busy">{{busy?'Проверяем...':'Войти'}}</button><div v-if="err" class="msg error" style="margin-top:10px">{{err}}</div><div class="login-info">Код заведения: <b>demo</b></div></div>
<template v-else>
<div class="muted" style="font-size:12px;margin-bottom:12px">🚗 {{session.courierName}} · заказы обновляются автоматически</div>
<div class="stats-grid"><div class="stat-box" style="border-color:#34d399"><div class="num">{{courierStats.done}}</div><div class="lbl">Доставлено</div></div><div class="stat-box" style="border-color:#fbbf24"><div class="num">{{courierStats.inProgress}}</div><div class="lbl">Сейчас в пути</div></div><div class="stat-box" style="border-color:#60a5fa"><div class="num">{{courierStats.total}}</div><div class="lbl">Всего взято</div></div><div class="stat-box" style="border-color:#a78bfa"><div class="num">{{fmt(courierStats.revenue)}} ₽</div><div class="lbl">Выручка заказов</div></div></div>
<div class="cols">
<div class="col"><h4>📦 Ждут выезда ({{colReady.length}})</h4><div v-for="o in colReady" v-bind:key="o.id" class="glass wcard"><div class="spread"><b>№{{o.order_number}}</b><span class="badge b-ready">готов к выезду</span></div><div class="muted" style="font-size:12px;margin-top:6px">📍 {{o.delivery_address||'Адрес не указан'}}</div><div class="muted" style="font-size:12px;margin-top:4px">📞 {{o.customer_phone||'Телефон не указан'}}<span v-if="o.customer_name"> · {{o.customer_name}}</span></div><div style="font-size:13px;margin-top:6px"><div v-for="it in (o.items||[])" v-bind:key="it.id">{{it.qty}}x {{it.name}}</div></div><div class="muted" style="font-size:12px;margin-top:6px">{{o.payment_method==='cash'?'💵 Собрать '+fmt(o.total_price)+' ₽':'💳 Оплачено картой'}}</div><button class="btn btn-primary btn-sm" style="width:100%;margin-top:10px" v-on:click="take(o.id)">🚗 Взять на доставку</button></div><p v-if="!colReady.length" class="muted">Пусто — ждите готовые заказы</p></div>
<div class="col"><h4>🚗 В доставке ({{colDelivery.length}})</h4><div v-for="o in colDelivery" v-bind:key="o.id" class="glass wcard"><div class="spread"><b>№{{o.order_number}}</b><span class="badge b-delivery">в пути</span></div><div class="muted" style="font-size:12px;margin-top:6px">📍 {{o.delivery_address||'Адрес не указан'}}</div><div class="muted" style="font-size:12px;margin-top:4px">📞 {{o.customer_phone||'Телефон не указан'}}</div><div class="muted" style="font-size:12px;margin-top:6px">{{o.payment_method==='cash'?'💵 Собрать '+fmt(o.total_price)+' ₽':'💳 Оплачено'}}</div><button class="btn btn-green btn-sm" style="width:100%;margin-top:10px" v-on:click="done(o.id)">✅ Доставлено</button></div><p v-if="!colDelivery.length" class="muted">Пусто</p></div>
</div>
<div class="glass card" style="margin-top:18px"><h4 style="margin:0 0 12px">📜 Моя история (последние доставки)</h4><div v-for="o in history" v-bind:key="o.id" class="row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)"><div style="flex:1;font-size:13px"><b>№{{o.order_number}}</b> — {{o.customer_name||'Клиент'}} <span class="muted" style="font-size:11px">📍 {{o.delivery_address||'—'}}</span></div><div class="muted" style="font-size:12px">{{fmtDate(o.created_at)}}</div><div style="color:#34d399;font-weight:700">{{fmt(o.total_price)}} ₽</div></div><p v-if="!history.length" class="muted">У вас пока нет завершённых доставок.</p></div>
</template>
</div></div>
<script>
const SUPABASE_URL='https://ulxfsozdryqrnlxzlblt.supabase.co';
const SUPABASE_KEY='sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq';
async function callRpc(name,args){
 const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(args||{})});
 let data=null;try{data=await r.json()}catch(e){}
 if(!r.ok) throw new Error((data&&data.message)||('HTTP '+r.status));
 return data;
}
function arr(v){if(v==null)return[];if(Array.isArray(v))return v;if(typeof v==='string'){try{return arr(JSON.parse(v))}catch(e){return[]}}if(typeof v==='object'){if(Array.isArray(v.orders))return v.orders;if(Array.isArray(v.data))return v.data;if(Array.isArray(v.items))return v.items;return [v]}return[]}
function normalizeLogin(v){if(Array.isArray(v))v=v[0];if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){}}if(v&&v.staff_login)v=v.staff_login;return v||null}
function normalizeOrders(v){if(v&&typeof v==='object'&&!Array.isArray(v)){if(Array.isArray(v.orders))v=v.orders;else if(Array.isArray(v.data))v=v.data;else if(Array.isArray(v.result))v=v.result}return arr(v)}
Vue.createApp({
 data(){return{session:null,busy:false,err:'',loginForm:{slug:'',pin:''},orders:[],history:[],timer:null,statsTimer:null}},
 computed:{
  colReady(){return this.orders.filter(o=>o.status==='ready')},
  colDelivery(){return this.orders.filter(o=>o.status==='delivery')},
  courierStats(){let done=0,inProgress=0,revenue=0;this.history.forEach(o=>{if(o.status==='done'){done++;revenue+=Number(o.total_price||0)}if(o.status==='delivery')inProgress++});return{done,inProgress,total:done+inProgress,revenue}}
 },
 methods:{
  fmt(v){return Number(v||0).toLocaleString('ru-RU')},
  fmtDate(v){return v?new Date(v).toLocaleDateString('ru-RU'):'-'},
  async login(){this.err='';this.busy=true;const slug=(this.loginForm.slug||'').replace(/\s+/g,'').toLowerCase(),pin=(this.loginForm.pin||'').replace(/\s+/g,'');if(!slug||!pin){this.err='Заполните оба поля';this.busy=false;return}try{const row=normalizeLogin(await callRpc('staff_login',{p_type:'courier',p_slug:slug,p_pin:pin}));if(!row||!row.token)throw new Error('Неверный PIN или код заведения');this.session={token:row.token,venueId:row.venueId||row.venue_id,venueName:row.venueName||row.venue_name,courierId:row.staffId||row.staff_id||row.courierId||row.courier_id||null,courierName:row.staffName||row.staff_name||row.courierName||row.courier_name||'Курьер'};localStorage.setItem('courier_session',JSON.stringify(this.session));this.load();this.loadHistory();this.startTimers()}catch(e){console.error(e);this.err=e.message||'Ошибка входа'}finally{this.busy=false}},
  logout(){if(this.session&&this.session.token)callRpc('staff_logout',{p_token:this.session.token}).catch(()=>{});localStorage.removeItem('courier_session');if(this.timer)clearInterval(this.timer);if(this.statsTimer)clearInterval(this.statsTimer);this.session=null;this.orders=[];this.history=[]},
  async load(){if(!this.session?.token)return;try{this.orders=normalizeOrders(await callRpc('staff_orders_json',{p_token:this.session.token}))}catch(e){console.warn('staff_orders_json',e)}},
  async loadHistory(){if(!this.session?.token)return;try{this.history=normalizeOrders(await callRpc('staff_history_json',{p_token:this.session.token}))}catch(e){console.warn('staff_history_json',e)}},
  startTimers(){if(this.timer)clearInterval(this.timer);if(this.statsTimer)clearInterval(this.statsTimer);this.timer=setInterval(()=>this.load(),3000);this.statsTimer=setInterval(()=>this.loadHistory(),10000)},
  async take(id){if(!this.session?.token)return;try{await callRpc('staff_update_order',{p_token:this.session.token,p_order_id:id,p_status:'delivery'});await this.load();await this.loadHistory()}catch(e){this.err=e.message||'Не удалось взять заказ'}},
  async done(id){if(!this.session?.token)return;try{await callRpc('staff_update_order',{p_token:this.session.token,p_order_id:id,p_status:'done'});await this.load();await this.loadHistory()}catch(e){this.err=e.message||'Не удалось завершить доставку'}}
 },
 mounted(){const s=localStorage.getItem('courier_session');if(s){try{this.session=JSON.parse(s);this.load();this.loadHistory();this.startTimers()}catch(e){localStorage.removeItem('courier_session')}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&this.session){this.load();this.loadHistory()}})},
 beforeUnmount(){if(this.timer)clearInterval(this.timer);if(this.statsTimer)clearInterval(this.statsTimer)}
}).mount('#app');
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('PWA',e)));
</script>
</body>
</html>
