<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Курьер — QR Menu</title><link rel="stylesheet" href="css/style.css"><style>body{font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.login{max-width:420px;margin:10vh auto;padding:28px;background:rgba(255,255,255,.05);border-radius:18px}.login input,.login button,header button,article button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#111827;color:#fff}.login button,article button{cursor:pointer;background:#4f46e5}.err{color:#f87171}.muted{opacity:.7;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}article{padding:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px}.top{display:flex;justify-content:space-between;margin-bottom:10px}.items{margin:12px 0;line-height:1.6}.stats{display:flex;gap:12px;margin:15px 0}.stats div{padding:14px 22px;background:rgba(255,255,255,.05);border-radius:12px}.stats b,.stats small{display:block}header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(0,0,0,.2)}header button{width:auto;margin:0}</style></head><body><div class="wrap" id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/staff-api.js"></script><script>window.STAFF_TYPE='courier';</script><script src="js/staff-app.js"></script></body></html>
