<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Курьер</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Курьер">
<link rel="manifest" href="/manifest-courier.webmanifest">
<link rel="apple-touch-icon" href="/icon-courier-192.png">
<link rel="stylesheet" href="css/style.css">
<style>
[v-cloak]{display:none}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start}.wcard{padding:12px;margin-bottom:10px}.b-ready{background:rgba(52,211,153,.15);color:#6ee7b7}.b-delivery{background:rgba(167,139,250,.15);color:#c4b5fd}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}.stat-box{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;text-align:center}.stat-box .num{font-size:22px;font-weight:800}.stat-box .lbl{font-size:11px;color:#9ca3af;margin-top:4px}.login-info{text-align:center;margin-top:12px;font-size:12px;color:#9ca3af}.hidden{display:none!important}
</style>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(245,158,11,.12);top:-100px;left:-100px"></div>
<div id="app">
<div class="topbar"><div class="brand"><div class="logo">🚗</div><span>Курьер<span id="venueTitle"></span></span></div><div class="row"><button id="logoutBtn" class="btn btn-ghost btn-sm hidden">Выйти</button></div></div>
<div class="wrap">
<div id="loginView" class="glass card" style="max-width:400px;margin:40px auto"><h3 style="margin-top:0">Вход для курьера</h3><div class="field"><label>Код заведения</label><input id="slug" value="demo" placeholder="demo" autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div><button id="loginBtn" class="btn btn-primary" style="width:100%">Войти</button><div id="loginErr" class="msg error hidden" style="margin-top:10px"></div><div class="login-info">Код заведения: <b>demo</b></div></div>
<div id="mainView" class="hidden">
<div id="userLine" class="muted" style="font-size:12px;margin-bottom:12px"></div>
<div class="stats-grid"><div class="stat-box" style="border-color:#34d399"><div id="statDone" class="num">0</div><div class="lbl">Доставлено</div></div><div class="stat-box" style="border-color:#fbbf24"><div id="statProgress" class="num">0</div><div class="lbl">Сейчас в пути</div></div><div class="stat-box" style="border-color:#60a5fa"><div id="statTotal" class="num">0</div><div class="lbl">Всего взято</div></div><div class="stat-box" style="border-color:#a78bfa"><div id="statRevenue" class="num">0 ₽</div><div class="lbl">Выручка заказов</div></div></div>
<div class="cols"><div class="col"><h4>📦 Ждут выезда (<span id="readyCount">0</span>)</h4><div id="readyList"></div></div><div class="col"><h4>🚗 В доставке (<span id="deliveryCount">0</span>)</h4><div id="deliveryList"></div></div></div>
<div class="glass card" style="margin-top:18px"><h4 style="margin:0 0 12px">📜 Моя история (последние доставки)</h4><div id="historyList"></div></div>
</div></div></div>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://ulxfsozdryqrnlxzlblt.supabase.co';
const SUPABASE_KEY='sb_publishable_9hmWZwV5WnfQHDK1ir36Pg_JIdHdwPq';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=v=>Number(v||0).toLocaleString('ru-RU');
const date=v=>v?new Date(v).toLocaleDateString('ru-RU'):'-';
let session=null,orders=[],history=[],timer=null,statsTimer=null;
function rpc(name,args){return fetch(SUPABASE_URL+'/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(args||{})}).then(async r=>{let d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error((d&&d.message)||('HTTP '+r.status));return d;});}
function arr(v){if(v==null)return[];if(Array.isArray(v))return v;if(typeof v==='string'){try{return arr(JSON.parse(v))}catch(e){return[]}}if(typeof v==='object'){if(Array.isArray(v.orders))return v.orders;if(Array.isArray(v.data))return v.data;if(Array.isArray(v.result))return v.result;if(Array.isArray(v.items))return v.items;return [v]}return[];}
function loginPayload(v){if(Array.isArray(v))v=v[0];if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){}}if(v&&v.staff_login)v=v.staff_login;return v||null;}
function render(){
 $('venueTitle').textContent=session?' · '+(session.venueName||''):'';
 $('userLine').textContent='🚗 '+(session.courierName||'Курьер')+' · заказы обновляются автоматически';
 const ready=orders.filter(o=>o.status==='ready'), delivery=orders.filter(o=>o.status==='delivery');
 $('readyCount').textContent=ready.length;$('deliveryCount').textContent=delivery.length;
 $('readyList').innerHTML=ready.length?ready.map(cardReady).join(''):'<p class="muted">Пусто — ждите готовые заказы</p>';
 $('deliveryList').innerHTML=delivery.length?delivery.map(cardDelivery).join(''):'<p class="muted">Пусто</p>';
 const done=history.filter(o=>o.status==='done').length, progress=history.filter(o=>o.status==='delivery').length;
 $('statDone').textContent=done;$('statProgress').textContent=progress;$('statTotal').textContent=done+progress;$('statRevenue').textContent=money(history.filter(o=>o.status==='done').reduce((s,o)=>s+Number(o.total_price||0),0))+' ₽';
 $('historyList').innerHTML=history.length?history.slice(0,20).map(o=>'<div class="row" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)"><div style="flex:1;font-size:13px"><b>№'+esc(o.order_number)+'</b> — '+esc(o.customer_name||'Клиент')+' <span class="muted" style="font-size:11px">📍 '+esc(o.delivery_address||'—')+'</span></div><div class="muted" style="font-size:12px">'+date(o.created_at)+'</div><div style="color:#34d399;font-weight:700">'+money(o.total_price)+' ₽</div></div>').join(''):'<p class="muted">У вас пока нет завершённых доставок.</p>';
}
function items(o){return (o.items||[]).map(i=>'<div>'+esc(i.qty)+'x '+esc(i.name)+'</div>').join('');}
function cardReady(o){return '<div class="glass wcard"><div class="spread"><b>№'+esc(o.order_number)+'</b><span class="badge b-ready">готов к выезду</span></div><div class="muted" style="font-size:12px;margin-top:6px">📍 '+esc(o.delivery_address||'Адрес не указан')+'</div><div class="muted" style="font-size:12px;margin-top:4px">📞 '+esc(o.customer_phone||'Телефон не указан')+(o.customer_name?' · '+esc(o.customer_name):'')+'</div><div style="font-size:13px;margin-top:6px">'+items(o)+'</div><div class="muted" style="font-size:12px;margin-top:6px">'+(o.payment_method==='cash'?'💵 Собрать '+money(o.total_price)+' ₽':'💳 Оплачено картой')+'</div><button class="btn btn-primary btn-sm takeBtn" data-id="'+esc(o.id)+'" style="width:100%;margin-top:10px">🚗 Взять на доставку</button></div>';}
function cardDelivery(o){return '<div class="glass wcard"><div class="spread"><b>№'+esc(o.order_number)+'</b><span class="badge b-delivery">в пути</span></div><div class="muted" style="font-size:12px;margin-top:6px">📍 '+esc(o.delivery_address||'Адрес не указан')+'</div><div class="muted" style="font-size:12px;margin-top:4px">📞 '+esc(o.customer_phone||'Телефон не указан')+'</div><div class="muted" style="font-size:12px;margin-top:6px">'+(o.payment_method==='cash'?'💵 Собрать '+money(o.total_price)+' ₽':'💳 Оплачено')+'</div><button class="btn btn-green btn-sm doneBtn" data-id="'+esc(o.id)+'" style="width:100%;margin-top:10px">✅ Доставлено</button></div>';}
async function load(){if(!session||!session.token)return;try{orders=arr(await rpc('staff_orders_json',{p_token:session.token}));render()}catch(e){console.warn('staff_orders_json',e)}}
async function loadHistory(){if(!session||!session.token)return;try{history=arr(await rpc('staff_history_json',{p_token:session.token}));render()}catch(e){console.warn('staff_history_json',e)}}
function startTimers(){clearInterval(timer);clearInterval(statsTimer);timer=setInterval(load,3000);statsTimer=setInterval(loadHistory,10000)}
function showMain(){ $('loginView').classList.add('hidden');$('mainView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');render();load();loadHistory();startTimers(); }
function showLogin(){ $('mainView').classList.add('hidden');$('loginView').classList.remove('hidden');$('logoutBtn').classList.add('hidden'); }
async function login(){const err=$('loginErr');err.classList.add('hidden');const slug=$('slug').value.replace(/\s+/g,'').toLowerCase(),pin=$('pin').value.replace(/\s+/g,'');if(!slug||!pin){err.textContent='Заполните оба поля';err.classList.remove('hidden');return}const btn=$('loginBtn');btn.disabled=true;btn.textContent='Проверяем...';try{const row=loginPayload(await rpc('staff_login',{p_type:'courier',p_slug:slug,p_pin:pin}));if(!row||!row.token)throw new Error('Неверный PIN или код заведения');session={token:row.token,venueId:row.venueId||row.venue_id,venueName:row.venueName||row.venue_name,courierId:row.staffId||row.staff_id||row.courierId||row.courier_id||null,courierName:row.staffName||row.staff_name||row.courierName||row.courier_name||'Курьер'};localStorage.setItem('courier_session',JSON.stringify(session));showMain()}catch(e){console.error('courier login:',e);err.textContent=e.message||'Ошибка входа';err.classList.remove('hidden')}finally{btn.disabled=false;btn.textContent='Войти'}}
async function logout(){if(session&&session.token)rpc('staff_logout',{p_token:session.token}).catch(()=>{});clearInterval(timer);clearInterval(statsTimer);localStorage.removeItem('courier_session');session=null;orders=[];history=[];$('pin').value='';showLogin()}
$('loginBtn').addEventListener('click',login);$('pin').addEventListener('keyup',e=>{if(e.key==='Enter')login()});$('logoutBtn').addEventListener('click',logout);
document.addEventListener('click',async e=>{const take=e.target.closest('.takeBtn'),done=e.target.closest('.doneBtn');if(take){try{await rpc('staff_update_order',{p_token:session.token,p_order_id:take.dataset.id,p_status:'delivery'});await load();await loadHistory()}catch(x){alert(x.message||'Не удалось взять заказ')}}if(done){try{await rpc('staff_update_order',{p_token:session.token,p_order_id:done.dataset.id,p_status:'done'});await load();await loadHistory()}catch(x){alert(x.message||'Не удалось завершить доставку')}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session){load();loadHistory()}});
try{const saved=localStorage.getItem('courier_session');if(saved){session=JSON.parse(saved);showMain()}}catch(e){localStorage.removeItem('courier_session')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('PWA',e)));
})();
</script>
</body>
</html>
