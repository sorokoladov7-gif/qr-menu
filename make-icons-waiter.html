<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Иконки «Официант»</title>
<style>body{font-family:sans-serif;background:#0b1020;color:#fff;display:flex;flex-direction:column;align-items:center;padding:40px;gap:16px}button{padding:12px 24px;border:none;border-radius:10px;background:#06b6d4;color:#fff;font-size:15px;font-weight:700;cursor:pointer}canvas{border-radius:24px;box-shadow:0 10px 40px rgba(6,182,212,.4)}</style>
</head>
<body>
<h2>🤵 Иконки для приложения «Официант»</h2>
<canvas id="c" width="512" height="512" style="width:200px;height:200px"></canvas>
<button onclick="dl(512,'icon-waiter-512.png')">⬇️ Скачать icon-waiter-512.png</button>
<button onclick="dl(192,'icon-waiter-192.png')">⬇️ Скачать icon-waiter-192.png</button>
<button onclick="dl(180,'apple-touch-icon-waiter.png')">⬇️ Скачать apple-touch-icon-waiter.png (iPhone)</button>
<script>
function draw(size) {
  var c = document.createElement('canvas'); c.width = size; c.height = size;
  var x = c.getContext('2d');
  var g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#06b6d4'); g.addColorStop(1, '#3b82f6');
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = Math.round(size * 0.55) + 'px serif';
  x.fillText('🤵', size / 2, size / 2 + size * 0.04);
  return c;
}
(function() { document.getElementById('c').getContext('2d').drawImage(draw(512), 0, 0); })();
function dl(size, name) {
  draw(size).toBlob(function(b) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    a.click();
  }, 'image/png');
}
</script>
</body>
</html>
