<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  [v-cloak]{display:none}
  .tblwrap{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
  .tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:middle}
  .tbl th{color:#9ca3af;font-weight:600;font-size:12px}
  .b-on{background:rgba(52,211,153,.15);color:#6ee7b7}
  .b-off{background:rgba(248,113,113,.15);color:#fca5a5}
  .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(99,102,241,.12);top:-100px;left:-100px"></div>
<div id="app" v-cloak>
  <div class="topbar">
    <div class="brand"><div class="logo">⚙️</div><span>Админ-панель</span></div>
    <div class="row">
      <span class="muted" style="font-size:13px">{{ profile ? profile.email : '' }}</span>
      <button class="btn btn-ghost btn-sm" @click="logout">Выйти</button>
    </div>
  </div>

  <div class="wrap">
    <div v-if="!ready" class="muted" style="text-align:center;padding:60px">Загрузка…</div>

    <template v-else>
      <div class="stats" style="margin-bottom:18px">
        <div class="glass stat"><div class="num">{{ venues.length }}</div><div class="lbl">Заведений</div></div>
        <div class="glass stat" style="border-color:#34d399"><div class="num">{{ fmt(mrr) }} ₽</div><div class="lbl">MRR / мес</div></div>
        <div class="glass stat" style="border-color:#fbbf24"><div class="num">{{ pausedCount }}</div><div class="lbl">На паузе</div></div>
        <div class="glass stat" style="border-color:#60a5fa"><div class="num">{{ managers.length }}</div><div class="lbl">Управляющих</div></div>
        <div class="glass stat" style="border-color:#a78bfa"><div class="num">{{ cooksCount }}</div><div class="lbl">Поваров</div></div>
      </div>

      <div class="tabs" style="margin-bottom:18px">
        <button :class="{on:tab==='stats'}" @click="tab='stats'; loadGlobalStats()">📊 Статистика</button>
        <button :class="{on:tab==='venues'}" @click="tab='venues'">🏢 Заведения</button>
        <button :class="{on:tab==='managers'}" @click="tab='managers'">👤 Управляющие</button>
      </div>

      <!-- СТАТИСТИКА (НОВОЕ) -->
      <div v-if="tab==='stats'">
        <div class="spread" style="margin-bottom:14px">
          <h3 style="margin:0">Общая статистика сети</h3>
          <select v-model="statsPeriod" @change="loadGlobalStats" style="width:auto;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff">
            <option value="7">За 7 дней</option>
            <option value="30">За 30 дней</option>
            <option value="all">За всё время</option>
          </select>
        </div>

        <div class="analytics-grid">
          <div class="glass stat"><div class="num" style="color:#34d399">{{ fmt(globalStats.revenue) }} ₽</div><div class="lbl">Общая выручка</div></div>
          <div class="glass stat"><div class="num" style="color:#60a5fa">{{ globalStats.orders }}</div><div class="lbl">Всего заказов</div></div>
          <div class="glass stat"><div class="num" style="color:#fbbf24">{{ globalStats.clients }}</div><div class="lbl">Уникальных клиентов</div></div>
        </div>

        <div class="glass card tblwrap">
          <h4 style="margin-top:0;margin-bottom:14px">🏆 Рейтинг заведений по выручке</h4>
          <table class="tbl">
            <tr><th>Заведение</th><th>Выручка</th><th>Заказов</th><th>Клиентов</th><th>Ср. чек</th><th>Ср. время</th></tr>
            <tr v-for="v in globalStats.venueStats" :key="v.id">
              <td><b>{{ v.name }}</b></td>
              <td style="color:#34d399"><b>{{ fmt(v.revenue) }} ₽</b></td>
              <td>{{ v.orders }}</td>
              <td>{{ v.clients }}</td>
              <td>{{ fmt(v.avgCheck) }} ₽</td>
              <td>{{ v.avgCookTime }} мин</td>
            </tr>
            <tr v-if="!globalStats.venueStats.length"><td colspan="6" class="muted" style="text-align:center;padding:20px">Нет данных за выбранный период</td></tr>
          </table>
        </div>
      </div>

      <!-- ЗАВЕДЕНИЯ -->
      <div v-if="tab==='venues'">
        <div class="spread" style="margin-bottom:14px">
          <h3 style="margin:0">Заведения</h3>
          <button class="btn btn-primary btn-sm" @click="showModal=true">+ Создать заведение</button>
        </div>
        <div class="glass card tblwrap">
          <table class="tbl">
            <tr><th>Заведение</th><th>Тариф</th><th>Статус</th><th>Повара</th><th></th></tr>
            <tr v-for="v in venues" :key="v.id">
              <td><b>{{ v.name }}</b><div class="muted" style="font-size:12px">/{{ v.slug }}</div></td>
              <td>
                <select :value="v.plan" @change="setPlan(v,$event.target.value)" style="width:auto;padding:6px 8px">
                  <option v-for="(p,key) in PLANS" :key="key" :value="key">{{ p.label }} · {{ p.price }} ₽</option>
                </select>
              </td>
              <td><span class="badge" :class="v.status==='active'?'b-on':'b-off'">{{ v.status==='active'?'Активен':'Пауза' }}</span></td>
              <td>{{ cooksByVenue(v.id) }}</td>
              <td style="white-space:nowrap">
                <a class="btn btn-ghost btn-sm" :href="'menu.html?venue='+v.slug" target="_blank">🔗</a>
                <button class="btn btn-ghost btn-sm" @click="toggleStatus(v)">{{ v.status==='active'?'⏸':'▶️' }}</button>
                <button class="btn btn-danger btn-sm" @click="delVenue(v)">🗑</button>
              </td>
            </tr>
          </table>
          <p v-if="!venues.length" class="muted" style="padding:14px">Заведений нет — создайте первое.</p>
        </div>
      </div>

      <!-- УПРАВЛЯЮЩИЕ -->
      <div v-if="tab==='managers'">
        <div class="glass card tblwrap">
          <table class="tbl">
            <tr><th>Имя</th><th>Email</th><th>Заведение</th></tr>
            <tr v-for="m in managers" :key="m.id">
              <td>{{ m.display_name }}</td>
              <td class="muted">{{ m.email }}</td>
              <td>
                <select :value="m.venue_id||''" @change="assign(m,$event.target.value)" style="max-width:220px">
                  <option value="">— не назначен —</option>
                  <option v-for="v in venues" :key="v.id" :value="v.id">{{ v.name }}</option>
                </select>
              </td>
            </tr>
          </table>
          <p v-if="!managers.length" class="muted" style="padding:14px">Нет зарегистрированных управляющих.</p>
        </div>
        <p class="muted" style="font-size:12px;margin-top:12px">Порядок: вы создаёте заведение → управляющий регистрируется на index.html → вы назначаете его сюда → он добавляет блюда и поваров.</p>
      </div>
    </template>
  </div>

  <!-- НОВОЕ ЗАВЕДЕНИЕ -->
  <div v-if="showModal" class="modal" @click.self="showModal=false">
    <div class="glass box">
      <h3 style="margin-top:0">Новое заведение</h3>
      <div class="field"><label>Название</label><input v-model.trim="nform.name"></div>
      <div class="field"><label>Код (slug)</label><input v-model.trim="nform.slug" placeholder="my-cafe"></div>
      <div class="field"><label>Тариф</label>
        <select v-model="nform.plan"><option v-for="(p,key) in PLANS" :key="key" :value="key">{{ p.label }} · {{ p.price }} ₽/мес</option></select>
      </div>
      <div class="field"><label>Описание</label><textarea v-model="nform.description" rows="2"></textarea></div>
      <div class="row">
        <button class="btn btn-primary" style="flex:1" @click="createVenue" :disabled="busy">Создать</button>
        <button class="btn btn-ghost" @click="showModal=false">Отмена</button>
      </div>
      <div v-if="msg" class="msg error" style="margin-top:10px">{{ msg }}</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const PLANS={ start:{label:'Старт',price:990}, pro:{label:'Про',price:1990}, vip:{label:'VIP',price:3990} };

Vue.createApp({
  data(){return{
    ready:false, busy:false, profile:null, tab:'stats',
    venues:[], managers:[], cooksAll:[],
    showModal:false, nform:{name:'',slug:'',plan:'start',description:''}, msg:'',
    statsPeriod: '7',
    globalStats: { revenue: 0, orders: 0, clients: 0, venueStats: [] }
  }},
  computed:{
    mrr(){ return this.venues.filter(v=>v.status==='active').reduce((s,v)=>s+(PLANS[v.plan]?PLANS[v.plan].price:0),0); },
    pausedCount(){ return this.venues.filter(v=>v.status!=='active').length; },
    cooksCount(){ return this.cooksAll.length; }
  },
  methods:{
    fmt(v){ return typeof window.fmt==='function' ? window.fmt(v) : Number(v||0).toLocaleString('ru-RU'); },
    cooksByVenue(id){ return this.cooksAll.filter(c=>c.venue_id===id).length; },

    async init(){
      this.profile=await requireAuth(['admin']);
      if(!this.profile){ this.ready=true; return; }
      await this.loadAll();
      await this.loadGlobalStats();
      this.ready=true;
    },
    async loadAll(){
      const [v,m,c]=await Promise.all([
        db.from('venues').select('*').order('created_at'),
        db.from('profiles').select('*').eq('role','manager').order('email'),
        db.from('cooks').select('venue_id')
      ]);
      this.venues=v.data||[]; this.managers=m.data||[]; this.cooksAll=c.data||[];
    },

    async loadGlobalStats() {
      let query = db.from('orders').select('venue_id, total_price, customer_phone, cooking_started_at, ready_at, venues(name)').eq('status', 'done');
      if (this.statsPeriod !== 'all') {
        const d = new Date(); d.setDate(d.getDate() - parseInt(this.statsPeriod));
        query = query.gte('created_at', d.toISOString());
      }
      const { data } = await query;
      const orders = data || [];

      let rev = 0; const phones = new Set(); const vMap = {};
      
      orders.forEach(o => {
        rev += Number(o.total_price || 0);
        if (o.customer_phone) phones.add(o.customer_phone.replace(/\D/g, ''));
        
        const vid = o.venue_id;
        if (!vMap[vid]) {
          vMap[vid] = { id: vid, name: o.venues ? o.venues.name : 'Неизвестно', revenue: 0, orders: 0, clients: new Set(), cookTimes: [] };
        }
        vMap[vid].revenue += Number(o.total_price || 0);
        vMap[vid].orders += 1;
        if (o.customer_phone) vMap[vid].clients.add(o.customer_phone.replace(/\D/g, ''));
        if (o.cooking_started_at && o.ready_at) {
          vMap[vid].cookTimes.push((new Date(o.ready_at) - new Date(o.cooking_started_at)) / 60000);
        }
      });

      const venueStats = Object.values(vMap).map(v => ({
        id: v.id, name: v.name, revenue: v.revenue, orders: v.orders, clients: v.clients.size,
        avgCheck: v.orders ? Math.round(v.revenue / v.orders) : 0,
        avgCookTime: v.cookTimes.length ? Math.round(v.cookTimes.reduce((a,b)=>a+b,0)/v.cookTimes.length) : 0
      })).sort((a, b) => b.revenue - a.revenue);

      this.globalStats = { revenue: rev, orders: orders.length, clients: phones.size, venueStats };
    },

    async createVenue(){
      this.msg=''; if(!this.nform.name||!this.nform.slug){ this.msg='Заполните название и slug'; return; }
      this.busy=true;
      const {error}=await db.from('venues').insert({ name:this.nform.name, slug:this.nform.slug.toLowerCase(), plan:this.nform.plan, description:this.nform.description||null });
      this.busy=false;
      if(error){ this.msg='Ошибка: '+error.message; return; }
      this.showModal=false; this.nform={name:'',slug:'',plan:'start',description:''}; await this.loadAll();
    },
    async setPlan(v,plan){ await db.from('venues').update({plan}).eq('id',v.id); await this.loadAll(); },
    async toggleStatus(v){ await db.from('venues').update({status:v.status==='active'?'paused':'active'}).eq('id',v.id); await this.loadAll(); },
    async delVenue(v){
      if(!confirm('Удалить заведение "'+v.name+'"?')) return;
      await db.from('profiles').update({venue_id:null}).eq('venue_id',v.id);
      const {error}=await db.from('venues').delete().eq('id',v.id);
      if(error) alert('Ошибка: '+error.message); await this.loadAll();
    },
    async assign(m,venueId){ await db.from('profiles').update({venue_id:venueId||null}).eq('id',m.id); await this.loadAll(); },
    async logout(){ try{ if(typeof window.logout==='function') await window.logout(); }catch(e){} window.location.href='/index.html'; }
  },
  mounted(){ this.init(); }
}).mount('#app');
</script>
</body>
</html>
