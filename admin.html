<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
[v-cloak]{display:none}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:middle}
.tbl th{color:#9ca3af;font-weight:600;font-size:12px}
.b-on{background:rgba(52,211,153,.15);color:#6ee7b7}.b-off{background:rgba(248,113,113,.15);color:#fca5a5}
.b-trial{background:rgba(96,165,250,.15);color:#93c5fd}.b-pend{background:rgba(251,191,36,.15);color:#fcd34d}
.analytics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.checkbox-label{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer}
.num-in{width:80px!important}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin:4px 0}
.bar-fill{height:8px;border-radius:4px;background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{padding:14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
.kpi .n{font-size:22px;font-weight:800}.kpi .l{font-size:12px;color:#9ca3af;margin-top:4px}
.thumb-sm{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.15);position:relative;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.05)}
.design-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:10px 0}
.design-field label{font-size:12px;color:#9ca3af;display:block;margin-bottom:4px}
.design-field input[type="color"], .design-field input[type="text"], .design-field input[type="number"], .design-field select{width:100%;padding:6px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;font-size:13px}
.design-field input[type="color"]{height:44px;padding:4px}
.design-field input[type="number"]{width:100%}
.design-group{margin-top:16px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px}
.design-group h4{font-size:14px;color:#cbd5e1;margin:0 0 10px}
</style>
</head>
<body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(99,102,241,.12);top:-100px;left:-100px"></div>
<div id="app" v-cloak>
<div class="topbar">
<div class="brand" @click="brandClicks++" style="cursor:pointer">
  <div class="logo">⚙️</div><span>Админ-панель</span>
</div>
<div class="row"><span class="muted" style="font-size:13px">{{ profile?profile.email:'' }}</span>
<button class="btn btn-ghost btn-sm" v-on:click="logout">Выйти</button></div>
</div>
<div class="wrap">
<div v-if="!ready" class="muted" style="text-align:center;padding:60px">Загрузка…</div>
<template v-else>
<div class="stats" style="margin-bottom:18px">
<div class="glass stat"><div class="num">{{ venues.length }}</div><div class="lbl">Заведений</div></div>
<div class="glass stat" style="border-color:#34d399"><div class="num">{{ fmt(mrr) }} ₽</div><div class="lbl">MRR / мес</div></div>
<div class="glass stat" style="border-color:#fbbf24"><div class="num">{{ pendingPayments.length }}</div><div class="lbl">Ждут оплаты</div></div>
<div class="glass stat" style="border-color:#60a5fa"><div class="num">{{ managers.length }}</div><div class="lbl">Управляющих</div></div>
<div class="glass stat" style="border-color:#a78bfa"><div class="num">{{ cooksAll.length }}</div><div class="lbl">Поваров</div></div>
<div class="glass stat" style="border-color:#c4b5fd"><div class="num">{{ couriersAll.length }}</div><div class="lbl">Курьеров</div></div>
<div class="glass stat" style="border-color:#67e8f9"><div class="num">{{ waitersAll.length }}</div><div class="lbl">Официантов</div></div>
</div>
<div class="tabs" style="margin-bottom:18px">
<button v-bind:class="{on:tab==='stats'}" v-on:click="tab='stats';loadGlobalStats()">📊 Статистика</button>
<button v-bind:class="{on:tab==='subs'}" v-on:click="tab='subs'">📈 Подписки</button>
<button v-bind:class="{on:tab==='analytics'}" v-on:click="tab='analytics';loadAdminAnalytics()">📈 Аналитика</button>
<button v-bind:class="{on:tab==='venues'}" v-on:click="tab='venues'">🏢 Заведения</button>
<button v-bind:class="{on:tab==='activity'}" v-on:click="tab='activity'">👥 Активность</button>
<button v-bind:class="{on:tab==='managers'}" v-on:click="tab='managers'">👤 Управляющие</button>
<button v-bind:class="{on:tab==='cooks'}" v-on:click="tab='cooks'">👨‍ Повара</button>
<button v-bind:class="{on:tab==='couriers'}" v-on:click="tab='couriers'">🚗 Курьеры</button>
<button v-bind:class="{on:tab==='waiters'}" v-on:click="tab='waiters'">🤵 Официанты</button>
<button v-bind:class="{on:tab==='plans'}" v-on:click="tab='plans'">💳 Тарифы и оплаты</button>
</div>

<!-- Все вкладки (статистика, подписки, аналитика, заведения, активность, управляющие, повара, курьеры, официанты, тарифы) остаются без изменений, их код слишком большой, я его опускаю для краткости, но в реальном файле он есть. -->

<!-- ===== РАСШИРЕННАЯ СЕКРЕТНАЯ ПАНЕЛЬ ДИЗАЙНА ===== -->
<div v-if="secretDesignPanel" class="modal" v-on:click.self="secretDesignPanel=false">
  <div class="glass box" style="max-width:1100px;max-height:90vh;overflow-y:auto">
    <h3 style="margin-top:0">🎨 Расширенная панель управления дизайном</h3>
    <p class="muted" style="font-size:12px;margin-bottom:14px">Настройте единый стиль и примените ко всем заведениям.</p>

    <div class="glass card" style="margin-bottom:14px;border-color:#6366f1">
      <h4>Шаблон дизайна (применить ко всем)</h4>

      <!-- Группа: Основные цвета -->
      <div class="design-group">
        <h4>🎨 Основные цвета</h4>
        <div class="design-grid">
          <div class="design-field"><label>Брендовый цвет</label><input v-model="adminDesignTemplate.brand_color" type="color"></div>
          <div class="design-field"><label>Цвет кнопок</label><input v-model="adminDesignTemplate.button_color" type="color"></div>
          <div class="design-field"><label>Цвет заголовков</label><input v-model="adminDesignTemplate.header_color" type="color"></div>
          <div class="design-field"><label>Цвет фона страницы</label><input v-model="adminDesignTemplate.background_color" type="color"></div>
          <div class="design-field"><label>Цвет фона карточек</label><input v-model="adminDesignTemplate.card_background" type="color"></div>
          <div class="design-field"><label>Цвет текста</label><input v-model="adminDesignTemplate.text_color" type="color"></div>
          <div class="design-field"><label>Цвет акцентов</label><input v-model="adminDesignTemplate.accent_color" type="color"></div>
          <div class="design-field"><label>Цвет границ</label><input v-model="adminDesignTemplate.border_color" type="color"></div>
        </div>
      </div>

      <!-- Группа: Фон -->
      <div class="design-group">
        <h4>🖼️ Фон</h4>
        <div class="design-grid">
          <div class="design-field"><label>Градиент (цвет 1)</label><input v-model="adminDesignTemplate.gradient_start" type="color"></div>
          <div class="design-field"><label>Градиент (цвет 2)</label><input v-model="adminDesignTemplate.gradient_end" type="color"></div>
          <div class="design-field"><label>Направление градиента</label>
            <select v-model="adminDesignTemplate.gradient_direction">
              <option value="to right">→ вправо</option>
              <option value="to left">← влево</option>
              <option value="to bottom">↓ вниз</option>
              <option value="to top">↑ вверх</option>
              <option value="135deg">↘ диагональ</option>
              <option value="45deg">↗ диагональ</option>
            </select>
          </div>
          <div class="design-field"><label>Фоновое изображение (URL)</label>
            <input v-model="adminDesignTemplate.background_image" placeholder="https://example.com/bg.jpg">
            <label class="btn btn-ghost btn-sm" style="cursor:pointer;display:inline-flex;margin-top:4px">
              <span>📤 Загрузить</span>
              <input type="file" accept="image/*" v-on:change="uploadBgImage" style="display:none">
            </label>
          </div>
        </div>
      </div>

      <!-- Группа: Типографика -->
      <div class="design-group">
        <h4>🔤 Типографика</h4>
        <div class="design-grid">
          <div class="design-field"><label>Шрифт</label>
            <select v-model="adminDesignTemplate.font_family">
              <option value="Plus+Jakarta+Sans">Plus Jakarta Sans</option>
              <option value="Inter">Inter</option>
              <option value="Roboto">Roboto</option>
              <option value="Montserrat">Montserrat</option>
              <option value="Oswald">Oswald</option>
            </select>
          </div>
          <div class="design-field"><label>Размер шрифта (px)</label><input v-model.number="adminDesignTemplate.font_size" type="number" min="12" max="24"></div>
          <div class="design-field"><label>Жирность заголовков</label>
            <select v-model="adminDesignTemplate.heading_weight">
              <option value="400">400</option>
              <option value="600">600</option>
              <option value="700">700</option>
              <option value="800">800</option>
            </select>
          </div>
          <div class="design-field"><label>Жирность текста</label>
            <select v-model="adminDesignTemplate.body_weight">
              <option value="300">300</option>
              <option value="400">400</option>
              <option value="500">500</option>
              <option value="600">600</option>
            </select>
          </div>
          <div class="design-field"><label>Межстрочный интервал</label>
            <select v-model="adminDesignTemplate.line_height">
              <option value="1.4">1.4</option>
              <option value="1.6">1.6</option>
              <option value="1.8">1.8</option>
              <option value="2.0">2.0</option>
            </select>
          </div>
          <div class="design-field"><label>Межбуквенный интервал (px)</label><input v-model.number="adminDesignTemplate.letter_spacing" type="number" min="0" max="4" step="0.5"></div>
        </div>
      </div>

      <!-- Группа: Карточки товаров -->
      <div class="design-group">
        <h4>🃏 Карточки товаров</h4>
        <div class="design-grid">
          <div class="design-field"><label>Внутренний отступ (px)</label><input v-model.number="adminDesignTemplate.card_padding" type="number" min="4" max="24"></div>
          <div class="design-field"><label>Высота изображения (px)</label><input v-model.number="adminDesignTemplate.card_image_height" type="number" min="80" max="250"></div>
          <div class="design-field"><label>Выравнивание текста</label>
            <select v-model="adminDesignTemplate.card_text_align">
              <option value="left">Слева</option>
              <option value="center">По центру</option>
            </select>
          </div>
          <div class="design-field" style="display:flex;gap:12px;align-items:center">
            <label><input type="checkbox" v-model="adminDesignTemplate.show_description"> Показывать описание</label>
            <label><input type="checkbox" v-model="adminDesignTemplate.show_price"> Показывать цену</label>
          </div>
        </div>
      </div>

      <!-- Группа: Кнопки -->
      <div class="design-group">
        <h4>🔘 Кнопки</h4>
        <div class="design-grid">
          <div class="design-field"><label>Цвет текста кнопок</label><input v-model="adminDesignTemplate.button_text_color" type="color"></div>
          <div class="design-field"><label>Жирность текста</label>
            <select v-model="adminDesignTemplate.button_weight">
              <option value="400">400</option>
              <option value="600">600</option>
              <option value="700">700</option>
            </select>
          </div>
          <div class="design-field"><label>Эффект при наведении</label>
            <select v-model="adminDesignTemplate.button_hover">
              <option value="scale">Увеличение</option>
              <option value="shadow">Тень</option>
              <option value="none">Без эффекта</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Группа: Дополнительно -->
      <div class="design-group">
        <h4>⚙️ Дополнительно</h4>
        <div class="design-grid">
          <div class="design-field"><label>Толщина границ (px)</label><input v-model.number="adminDesignTemplate.border_width" type="number" min="0" max="4"></div>
          <div class="design-field"><label>Скругление карточек (px)</label><input v-model.number="adminDesignTemplate.border_radius" type="number" min="0" max="30"></div>
          <div class="design-field"><label>Скругление кнопок (px)</label><input v-model.number="adminDesignTemplate.button_radius" type="number" min="0" max="30"></div>
          <div class="design-field"><label>Тень (px)</label><input v-model.number="adminDesignTemplate.shadow" type="number" min="0" max="20"></div>
          <div class="design-field"><label>Скорость анимации (s)</label>
            <select v-model="adminDesignTemplate.transition_speed">
              <option value="0.1">0.1</option>
              <option value="0.2">0.2</option>
              <option value="0.3">0.3</option>
              <option value="0.5">0.5</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row" style="margin-top:16px">
        <button class="btn btn-primary btn-sm" v-on:click="applyDesignToAll">✅ Применить ко всем заведениям</button>
        <button class="btn btn-ghost btn-sm" v-on:click="resetAdminTemplate">↺ Сбросить шаблон</button>
      </div>
    </div>

    <h4>Текущие настройки заведений</h4>
    <div class="tblwrap">
      <table class="tbl">
        <tr><th>Заведение</th><th>Цвет градиента</th><th>Цвет кнопок</th><th>Шрифт</th><th>Действие</th></tr>
        <tr v-for="v in venues" v-bind:key="v.id">
          <td><b>{{ v.name }}</b></td>
          <td><span v-bind:style="{display:'inline-block',width:'30px',height:'30px',borderRadius:'6px',background:v.design_settings?.brand_color||'#6366f1'}"></span></td>
          <td><span v-bind:style="{display:'inline-block',width:'30px',height:'30px',borderRadius:'6px',background:v.design_settings?.button_color||'#8b5cf6'}"></span></td>
          <td>{{ v.design_settings?.font_family||'По умолчанию' }}</td>
          <td><button class="btn btn-primary btn-sm" v-on:click="applyAdminDesign(v)">📥 Применить шаблон</button></td>
        </tr>
      </table>
    </div>
    <button class="btn btn-ghost" style="margin-top:14px" v-on:click="secretDesignPanel=false">Закрыть</button>
  </div>
</div>
<!-- ============================================== -->

</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
Vue.createApp({
data:function(){return{
ready:false,busy:false,profile:null,tab:'stats',
venues:[],managers:[],cooksAll:[],couriersAll:[],waitersAll:[],links:[],plans:[],payments:[],ordersAll:[],subscriptions:[],
showModal:false,nform:{name:'',slug:'',plan:'start'},msg:'',statsPeriod:'7',
globalStats:{revenue:0,orders:0,clients:0,venueStats:[]},
adminAnalyticsPeriod:'30',
adminAnalytics:{revenue:0,orders:0,clients:0,repeatClients:0,newClients:0,avgCheck:0,avgCookTime:0,
pickup:0,delivery:0,cash:0,card:0,topItems:[],topAddons:[],topHours:[],daily:[],
mrr:0,churnRate:0,arpu:0,trialConversion:0,planDist:[],
venueActivity:[],managerActivity:[],cookActivity:[],courierActivity:[],waiterActivity:[]},
cookForm:{venue_id:'',name:'',phone:''},courierForm:{venue_id:'',name:'',phone:''},waiterForm:{venue_id:'',name:'',phone:''},
venueEditModal:{show:false,id:null,name:'',description:'',brand_color:'#6366f1',logo_url:'',perms:{addons:true,products:true,prices:true}},
prodModal:{show:false,venueId:null,venueName:'',list:[],form:{name:'',price:0,category:'main'}},
addMgrModal:{show:false,name:'',email:'',password:'',role:'manager',err:''},
mgrEditModal:{show:false,id:null,name:'',role:'manager', allow_manage_delivery: false, allow_manage_design: false},
staffEditModal:{show:false,table:'',id:null,venue_id:null,name:'',phone:'',pin:''},
secretDesignPanel:false,
brandClicks:0,
adminDesignTemplate:{
  brand_color:'#6366f1',
  button_color:'#8b5cf6',
  header_color:'#ffffff',
  font_family:'Plus+Jakarta+Sans',
  background_color:'#0b1120',
  card_background:'#141821',
  text_color:'#eef2f7',
  accent_color:'#a78bfa',
  border_color:'#29303d',
  border_radius:18,
  button_radius:12,
  shadow:8,
  font_size:16,
  heading_weight:700,
  body_weight:400,
  line_height:1.6,
  letter_spacing:0,
  gradient_start:'#0b1120',
  gradient_end:'#0b1120',
  gradient_direction:'to right',
  background_image:'',
  card_padding:12,
  card_image_height:130,
  card_text_align:'left',
  show_description:true,
  show_price:true,
  button_text_color:'#ffffff',
  button_weight:700,
  button_hover:'scale',
  border_width:1,
  transition_speed:0.2
}
}},
computed:{
mrr:function(){var self=this;return this.venues.filter(function(v){return v.status==='active'}).reduce(function(s,v){var p=self.plans.find(function(x){return x.id===v.plan});return s+(p?Number(p.price):0)},0)},
subStats:function(){var self=this;var now=new Date();var soon=new Date();soon.setDate(soon.getDate()+7);
var act=0,trial=0,expired=0,expiring=0;
this.venues.forEach(function(v){
if(!v.subscription_end){expired++;return}
var e=new Date(v.subscription_end);
if(e<now)expired++;
else{act++;if(e<soon)expiring++;
var sub=self.subscriptions.find(function(s){return s.venue_id===v.id});
if(sub&&sub.status==='trialing')trial++;}
});
return{active:act,trial:trial,expired:expired,expiringSoon:expiring}},
adminMaxDaily:function(){var mx=1;this.adminAnalytics.daily.forEach(function(d){if(d.count>mx)mx=d.count});return mx},
pendingPayments:function(){return this.payments.filter(function(p){return p.status==='pending'})},
subStats:function(){var self=this;var now=new Date();
var total=this.venues.length,active=0,trial=0,expired=0;
this.venues.forEach(function(v){
if(!v.subscription_end){expired++;return}
var e=new Date(v.subscription_end);
if(e<now){expired++}
else{active++;
var sub=self.subscriptions.find(function(s){return s.venue_id===v.id});
if(sub&&sub.status==='trialing')trial++;}
});
return{total:total,active:active,trial:trial,expired:expired}},
planStats:function(){var self=this;
return this.plans.map(function(p){
var vs=self.venues.filter(function(v){return v.plan===p.id});
var now=new Date();
var act=vs.filter(function(v){return v.subscription_end&&new Date(v.subscription_end)>now&&v.status==='active'}).length;
return{id:p.id,name:p.name,price:Number(p.price)||0,count:vs.length,active:act,mrr:act*(Number(p.price)||0)};
})},
venueSubs:function(){var self=this;
return this.venues.map(function(v){
var pl=self.plans.find(function(p){return p.id===v.plan});
var ords=self.ordersAll.filter(function(o){return o.venue_id===v.id&&o.status==='done'});
var rev=ords.reduce(function(s,o){return s+Number(o.total_price||0)},0);
return{id:v.id,name:v.name,slug:v.slug,plan:pl?pl.name:'—',subscription_end:v.subscription_end,status:v.status,
totalOrders:ords.length,totalRevenue:rev,plan_id:v.plan};
})},
venueActivity:function(){var self=this;var now=new Date();var from=null;
if(this.statsPeriod!=='all'){from=new Date();from.setDate(from.getDate()-parseInt(this.statsPeriod))}
return this.venues.map(function(v){
var ords=self.ordersAll.filter(function(o){
if(o.venue_id!==v.id)return false;
if(from&&o.created_at&&new Date(o.created_at)<from)return false;
return true});
var done=ords.filter(function(o){return o.status==='done'});
var rev=done.reduce(function(s,o){return s+Number(o.total_price||0)},0);
var last=null;
ords.forEach(function(o){if(o.created_at){var d=new Date(o.created_at);if(!last||d>last)last=d}});
return{id:v.id,name:v.name,orders:ords.length,revenue:rev,
lastOrder:last?last.toLocaleDateString('ru-RU')+' '+last.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'—',
cooks:self.cooksAll.filter(function(c){return c.venue_id===v.id}).length,

db.from('cooks').insert({venue_id:self.cookForm.venue_id,name:self.cookForm.name,phone:self.cookForm.phone||null,pin:pin}).then(function(){
alert('Повар добавлен! PIN: '+pin);
self.cookForm={venue_id:'',name:'',phone:''};self.loadAll()})},

db.from('couriers').delete().eq('id',c.id).then(function(){self.loadAll()})},
addWaiterAdmin:function(){var self=this;var pin=this.genPin(self.waitersAll);

alert('Официант добавлен! PIN: '+pin);

this.staffEditModal={show:true,table:table,id:obj.id,venue_id:obj.venue_id,name:obj.name,phone:obj.phone||'',pin:obj.pin}},
saveStaffEdit:function(){var self=this;var m=this.staffEditModal;
db.from(m.table).update({venue_id:m.venue_id,name:m.name,phone:m.phone||null,pin:m.pin}).eq('id',m.id).then(function(){
self.staffEditModal.show=false;self.loadAll()})},

createPlan:function(){var self=this;
db.from('plans').insert({id:'custom_'+Date.now(),name:'Персональный тариф',price:0,max_venues:1,max_cooks:5,max_couriers:10,max_waiters:10,max_products:50}).then(function(){self.loadAll()})},
delPlan:function(p){var self=this;
var used=self.venues.some(function(v){return v.plan===p.id});
if(used){alert('Тариф назначен заведениям — сначала переведите их на другой.');return}
if(!confirm('Удалить тариф «'+p.name+'»?'))return;
db.from('plans').delete().eq('id',p.id).then(function(){self.loadAll()})},
savePlan:function(p){
db.from('plans').update({name:p.name,price:Number(p.price)||0,max_venues:+p.max_venues,max_cooks:+p.max_cooks,max_couriers:+p.max_couriers||0,max_waiters:+p.max_waiters||0,max_products:+p.max_products}).eq('id',p.id).then(function(){
alert('Тариф «'+p.name+'» сохранён')})},
confirmPayment:function(pay){var self=this;
var end=new Date();end.setMonth(end.getMonth()+1);
db.from('venues').update({plan:pay.plan_id,subscription_end:end.toISOString(),status:'active'}).eq('id',pay.venue_id).then(function(){
return db.from('subscriptions').update({plan_id:pay.plan_id,status:'active',current_period_end:end.toISOString()}).eq('venue_id',pay.venue_id);
}).then(function(){return db.from('payments').update({status:'confirmed'}).eq('id',pay.id)}).then(function(){self.loadAll()})},
rejectPayment:function(pay){var self=this;
db.from('payments').update({status:'rejected'}).eq('id',pay.id).then(function(){self.loadAll()})},
logout:function(){try{db.auth.signOut()}catch(e){}location.href='/index.html'},

uploadBgImage:function(ev){
  var self=this;
  var f=ev.target.files[0];
  if(!f)return;
  self.resizeImage(f, 1920, 0.8).then(function(blob){
    var fn='bg/'+Date.now()+'.jpg';
    return db.storage.from('menu-images').upload(fn, blob, {cacheControl:'3600', upsert:true, contentType:'image/jpeg'}).then(function(r){
      if(r.error) throw r.error;
      self.adminDesignTemplate.background_image = db.storage.from('menu-images').getPublicUrl(fn).data.publicUrl;
      alert('Фоновое изображение загружено!');
    });
  }).catch(function(e){ alert('Ошибка: '+e.message); });
},
