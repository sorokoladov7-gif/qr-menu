<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head><body>
<div class="glow" style="width:40vw;height:40vw;background:rgba(244,114,182,.08);top:-100px;right:-100px"></div>
<div id="app" v-cloak>
  <div class="topbar">
    <div class="brand"><div class="logo">⚙️</div><span>Админ-панель</span></div>
    <div class="row"><span class="muted" style="font-size:13px">{{ profile?profile.email:'' }}</span>
      <button class="btn btn-ghost btn-sm" @click="logout">Выйти</button></div>
  </div>

  <div class="wrap">
    <div v-if="!ready" class="muted" style="text-align:center;padding:60px">Загрузка…</div>
    <template v-else>
      <div class="stats" style="margin-bottom:18px">
        <div class="glass stat"><div class="num">{{ venues.length }}</div><div class="lbl">Заведений</div></div>
        <div class="glass stat" style="border-color:#34d399"><div class="num">{{ fmt(mrr) }} ₽</div><div class="lbl">MRR / мес</div></div>
        <div class="glass stat" style="border-color:#fbbf24"><div class="num">{{ pausedCount }}</div><div class="lbl">На паузе</div></div>
        <div class="glass stat" style="border-color:#a78bfa"><div class="num">{{ managers.length }}</div><div class="lbl">Управляющих</div></div>
        <div class="glass stat" style="border-color:#f472b6"><div class="num">{{ cooksCount }}</div><div class="lbl">Поваров</div></div>
      </div>

      <div class="spread" style="margin-bottom:14px">
        <h3 style="margin:0">Заведения</h3>
        <button class="btn btn-primary btn-sm" @click="showCreate=true">+ Создать заведение</button>
      </div>

      <div class="glass" style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Заведение</th><th>Тариф</th><th>Статус</th><th>Повара</th><th></th></tr></thead>
          <tbody>
            <tr v-for="v in venues" :key="v.id">
              <td><b>{{ v.name }}</b><div class="muted" style="font-size:12px">/{{ v.slug }}</div></td>
              <td>
                <select :value="v.plan" @change="setPlan(v,$event.target.value)" style="width:auto;padding:7px 10px;font-size:13px">
                  <option v-for="(label,key) in PLANS" :key="key" :value="key">{{ label }} · {{ planPrice(key) }} ₽</option>
                </select>
              </td>
              <td><span class="badge" :class="v.status==='active'?'b-ready':'b-cooking'">{{ v.status==='active'?'Активен':'Пауза' }}</span></td>
              <td>{{ cooksByVenue(v.id) }}</td>
              <td>
                <div class="row">
                  <a class="btn btn-ghost btn-sm" :href="'menu.html?venue='+v.slug" target="_blank">Меню</a>
                  <button class="btn btn-ghost btn-sm" @click="togglePause(v)">{{ v.status==='active'?'⏸ Пауза':'▶️ Запуск' }}</button>
                  <button class="btn btn-danger btn-sm" @click="delVenue(v)">🗑</button>
                </div>
              </td>
            </tr>
            <tr v-if="!venues.length"><td colspan="5" class="muted" style="text-align:center;padding:30px">Заведений нет — создайте первое.</td></tr>
          </tbody>
        </table>
      </div>

      <h3 style="margin:26px 0 12px">Управляющие</h3>
      <div class="glass" style="overflow-x:auto">
        <table class="table">
          <thead><tr><th>Имя</th><th>Email</th><th>Заведение</th></tr></thead>
          <tbody>
            <tr v-for="m in managers" :key="m.id">
              <td>{{ m.display_name }}</td><td class="muted">{{ m.email }}</td>
              <td>
                <select :value="m.venue_id||''" @change="assign(m,$event.target.value)" style="width:auto;padding:7px 10px;font-size:13px">
                  <option value="">— не назначен —</option>
                  <option v-for="v in venues" :key="v.id" :value="v.id">{{ v.name }}</option>
                </select>
              </td>
            </tr>
            <tr v-if="!managers.length"><td colspan="3" class="muted" style="text-align:center;padding:20px">Нет зарегистрированных управляющих.</td></tr>
          </tbody>
        </table>
      </div>
      <p class="muted" style="font-size:12px;margin-top:10px">Порядок: вы создаёте заведение → управляющий регистрируется на index.html → вы назначаете его сюда → он добавляет блюда и поваров.</p>
    </template>
  </div>

  <!-- Модалка создания -->
  <div v-if="showCreate" class="modal" @click.self="showCreate=false">
    <div class="glass box">
      <h3 style="margin-top:0">Новое заведение</h3>
      <div class="field"><label>Название</label><input v-model="form.name" @input="form.slug=slugify(form.name)"></div>
      <div class="field"><label>Код (slug) для QR и входа поваров</label><input v-model="form.slug"></div>
      <div class="field"><label>Тариф</label>
        <select v-model="form.plan"><option v-for="(label,key) in PLANS" :key="key" :value="key">{{ label }} · {{ planPrice(key) }} ₽/мес</option></select>
      </div>
      <div class="field"><label>Описание</label><textarea v-model="form.description" rows="2"></textarea></div>
      <div class="row">
        <button class="btn btn-primary" style="flex:1" @click="createVenue">Создать</button>
        <button class="btn btn-ghost" @click="showCreate=false">Отмена</button>
      </div>
      <div v-if="msg" class="msg" :class="msgType">{{ msg }}</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script>
<script>
Vue.createApp({
  data(){return{ready:false,profile:null,venues:[],managers:[],cooks:[],showCreate:false,
    form:{name:'',slug:'',plan:'start',description:''},msg:'',msgType:'',PLANS}},
  computed:{
    mrr(){return this.venues.filter(v=>v.status==='active').reduce((s,v)=>s+planPrice(v.plan),0)},
    pausedCount(){return this.venues.filter(v=>v.status==='paused').length},
    cooksCount(){return this.cooks.length}
  },
  methods:{
    fmt,planPrice,slugify,logout,
    cooksByVenue(id){return this.cooks.filter(c=>c.venue_id===id).length},
    async init(){
      this.profile=await requireAuth(['admin']);
      if(!this.profile)return;
      await this.loadAll();this.ready=true;
    },
    async loadAll(){
      const [v,m,c]=await Promise.all([
        db.from('venues').select('*').order('created_at'),
        db.from('profiles').select('*').eq('role','manager'),
        db.from('cooks').select('*')
      ]);
      this.venues=v.data||[];this.managers=m.data||[];this.cooks=c.data||[];
    },
    async createVenue(){
      if(!this.form.name||!this.form.slug){this.msg='Заполните название и slug';this.msgType='err';return}
      const {error}=await db.from('venues').insert({name:this.form.name,slug:this.form.slug.toLowerCase(),plan:this.form.plan,description:this.form.description});
      if(error){this.msg='Ошибка: '+error.message;this.msgType='err';return}
      this.showCreate=false;this.form={name:'',slug:'',plan:'start',description:''};await this.loadAll();
    },
    async togglePause(v){await db.from('venues').update({status:v.status==='active'?'paused':'active'}).eq('id',v.id);await this.loadAll()},
    async setPlan(v,plan){await db.from('venues').update({plan}).eq('id',v.id);await this.loadAll()},
    async delVenue(v){if(confirm('Удалить "'+v.name+'" и все его данные?')){await db.from('venues').delete().eq('id',v.id);await this.loadAll()}},
    async assign(m,venueId){await db.from('profiles').update({venue_id:venueId||null}).eq('id',m.id);await this.loadAll()}
  },
  mounted(){this.init()}
}).mount('#app');
</script>
</body></html>
